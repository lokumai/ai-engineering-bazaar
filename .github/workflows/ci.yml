# Everything the deploy workflow will do, before it is allowed to do it.
#
# `push: main` is not redundant with `pull_request`, and its absence was a real
# gap: `deploy.yml` fires on every push to main and does not depend on this
# workflow, so nothing re-ran the tests against the commit that actually ships.
# A squash-merge produces a commit no CI run has ever seen — usually identical in
# content to the branch tip, but not necessarily, and a direct push is not
# identical to anything. Twenty runs of this workflow existed before this line
# and every one of them was a `pull_request`.
#
# Running here does not by itself stop a red commit from deploying: `deploy.yml`
# does not depend on this workflow, so what stops one is main's ruleset naming
# the job below as a required status check. It does — which means the job's
# `name:` is part of the repository's configuration and not free to edit: change
# it without changing the ruleset and the required check simply never reports,
# leaving every pull request unmergeable rather than failing loudly.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  site:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # §11.26: REVISION is each file's last-touching commit.
          fetch-depth: 0
      # v5 added automatic caching driven by a `packageManager` field in
      # package.json, and v6 narrowed it to npm. `package.json` declares no such
      # field, so nothing here is cached twice or cached differently; the
      # explicit `cache`/`cache-dependency-path` below is still what runs.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the B9 contrast check (§10.1): a token edited so that a pair
      # drops under its floor fails here, not in an audit six months later.
      - run: npm test
      # One build, the one the deploy publishes: since D92 (2026-11-06) the site
      # is served from the root of ai-bazaar.lokum.dev, so it has no base path. It also catches a moved route: a static export
      # ships an internal href that resolves to nothing without erroring, and
      # this gate reads the export itself. The base-path-less build that ran
      # first until M40 (2026-11-05, D88) asked the same questions of a build
      # nobody publishes; the browser suite below builds its own.
      # The bundle's finaliser draws every diagram in the bundled Chromium, not
      # in Chrome, so the build cannot run without it: it exits 1 naming this
      # command rather than fall back to a browser whose metrics differ.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/check-links-out.mjs out
      # The content bundle under out/api/ against its contract (ARCHITECTURE
      # §13): every file the index names, every hash, the SVG profile and the
      # diagram font. The copy is compared with the browser suite's own build.
      - run: node scripts/check-bundle-out.mjs out && cp -r out/api "$RUNNER_TEMP/api-first"
      # `chrome`, not `chromium`: playwright.config.ts runs the suite on real
      # Google Chrome via `channel: 'chrome'`, and installing the bundled
      # Chromium instead only passes because the runner image happens to ship
      # Chrome already.
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      # The browser suite rebuilt out/ from the same commit, so the two bundles
      # must match byte for byte: the mobile reader treats a new contentVersion
      # as new content. On PR #57 they did not until Playwright stopped
      # fetching the PR base shallowly (`captureGitInfo` in playwright.config.ts),
      # so a mismatch prints what git answered before it fails.
      - name: The two builds of this commit publish the same bundle
        run: |
          if diff -r "$RUNNER_TEMP/api-first" out/api > /dev/null; then exit 0; fi
          echo "HEAD $(git rev-parse HEAD), shallow: $(git rev-parse --is-shallow-repository)"
          git log -3 --format='%H %P %ad' --date=short
          for f in $(git -C mini-courses ls-files '*.md' | head -5); do
            echo "$f: $(git -C mini-courses log -1 --format=%H -- "$f")"
          done
          jq -c '[.modules[] | {key, r: .tracks.engineers.revision.hash}] | .[:5]' "$RUNNER_TEMP/api-first/v1/index.json" out/api/v1/index.json
          diff -r "$RUNNER_TEMP/api-first" out/api | head -c 4000
          exit 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
