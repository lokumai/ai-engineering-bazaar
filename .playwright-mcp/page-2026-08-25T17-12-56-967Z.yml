            - generic [ref=f3e682]:
              - heading "Performance stratified by difficulty" [level=3] [ref=f3e686]
              - generic [ref=f3e690]:
                - paragraph [ref=f3e691]: The increase in performance when evaluating on SWE-bench Verified may partly be explained by shifting the distribution toward easier samples (as shown in earlier analyses). However, our goal is not to inflate benchmark scores, but to make sure that the benchmark faithfully represents model capability at any given difficulty level.
                - paragraph [ref=f3e692]:
                  - text: We investigate this by plotting performance stratified by difficulty. If our new dataset merely shifted the difficulty distribution to contain more easy samples, the stratified performance within each category would not change, as appears to be the case going from the original SWE-bench to SWE-bench Lite. We instead observe that performance increases
                  - generic [ref=f3e693]: within
                  - text: individual difficulty categories when moving to SWE-bench Verified, which is consistent with the intended effect of removing impossible samples from all categories instead of removing difficult samples. The effect is clearest in the easiest two buckets of difficulty, where we have the most samples.
            - generic [ref=f3e696]:
