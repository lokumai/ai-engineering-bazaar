            - generic [ref=f3e134]:
              - paragraph [ref=f3e135]:
                - generic [ref=f3e136]: Updated February 24, 2025
              - paragraph [ref=f3e137]:
                - text: As part of our
                - link "Preparedness Framework⁠" [ref=f3e138] [cursor=pointer]:
                  - /url: https://openai.com/preparedness/
                  - generic [ref=f3e139]: Preparedness Framework
                  - text: ⁠
                - text: ", OpenAI develops a range of metrics to track, evaluate, and forecast models’ abilities to act autonomously. The ability to autonomously complete software engineering tasks is a key component of our Medium risk level in the Model Autonomy risk category. Evaluating these capabilities is challenging due to the complexity of software engineering tasks, the difficulty of accurately assessing generated code, and the challenge of simulating real-world development scenarios. Therefore, our approach to Preparedness must also involve careful examination of evaluations themselves, to reduce the potential for underestimating or overestimating performance in important risk categories."
              - paragraph [ref=f3e140]:
                - text: One of the most popular evaluation suites for software engineering is
                - link "SWE-bench⁠ (opens in a new window)" [ref=f3e141] [cursor=pointer]:
                  - /url: https://www.swebench.com/
                  - generic [ref=f3e142]: SWE-bench
                  - text: ⁠
                  - generic [ref=f3e143]: (opens in a new window)
                - superscript [ref=f3e144]:
                  - link "1" [ref=f3e146] [cursor=pointer]:
                    - /url: "#citation-bottom-1"
                - text: —a benchmark for evaluating large language models’ (LLMs’) abilities to solve real-world software issues sourced from GitHub. The benchmark involves giving agents a code repository and issue description, and challenging them to generate a patch that resolves the problem described by the issue. Coding agents have made impressive progress on SWE-bench, with top scoring agents scoring 20% on SWE-bench and 43% on SWE-bench Lite according to the
                - link "SWE-bench leaderboard⁠ (opens in a new window)" [ref=f3e147] [cursor=pointer]:
                  - /url: https://www.swebench.com/
                  - generic [ref=f3e148]: SWE-bench leaderboard
                  - text: ⁠
                  - generic [ref=f3e149]: (opens in a new window)
                - text: as of August 5, 2024.
              - paragraph [ref=f3e150]: Our testing identified some SWE-bench tasks which may be hard or impossible to solve, leading to SWE-bench systematically underestimating models’ autonomous software engineering capabilities. We’ve collaborated with the authors of SWE-bench to address those issues in a new release of the benchmark that should provide more accurate evaluations.
            - generic [ref=f3e152]:
              - heading "Background on SWE-bench" [level=2] [ref=f3e156]
              - generic [ref=f3e160]:
                - paragraph [ref=f3e161]:
                  - text: Each sample in the SWE-bench test set is created from a resolved GitHub issue in one of 12 open-source Python repositories on GitHub. Each sample has an associated pull request (PR), which includes both the solution code and unit tests to verify code correctness. These unit tests fail before the solution code in the PR is added, but pass afterwards, and are therefore called
                  - code [ref=f3e162]:
                    - generic [ref=f3e163]: FAIL_TO_PASS
                  - generic [ref=f3e164]: tests
                  - text: . Each sample also has associated
                  - code [ref=f3e165]:
                    - generic [ref=f3e166]: PASS_TO_PASS
                  - generic [ref=f3e167]: tests
                  - text: ", which pass both before and after the PR is merged, and are used to check that existing unrelated functionality in the codebase has not been broken by the PR."
                - paragraph [ref=f3e168]:
                  - text: For each sample in SWE-bench, agents are provided with the original text from the GitHub issue, known as the
                  - generic [ref=f3e169]: problem statement
                  - text: ", and are given access to the codebase. Given these, agents must edit the files in the codebase to resolve the issue. The tests are not shown to the agent."
                - paragraph [ref=f3e170]:
                  - text: A proposed edit is evaluated by running both the
                  - code [ref=f3e171]: FAIL_TO_PASS
                  - text: and
                  - code [ref=f3e172]: PASS_TO_PASS
                  - text: tests. If the
                  - code [ref=f3e173]: FAIL_TO_PASS
                  - text: tests pass, this means the edit solves the issue. If the
                  - code [ref=f3e175]: PASS_TO_PASS
                  - text: tests pass, then the edit has not inadvertently broken unrelated sections of the codebase. Both sets of tests are required to pass for the edit to fully resolve the original GitHub issue.
            - generic [ref=f3e177]:
              - heading "Adapting SWE-bench as a Preparedness Evaluation" [level=2] [ref=f3e181]
              - generic [ref=f3e183]:
                - generic [ref=f3e185]:
                  - paragraph [ref=f3e186]:
                    - text: Given the potential relevance of SWE-bench for the Preparedness Framework, we aimed to find ways in which we could improve the robustness and reliability of the benchmark. We identified three major areas for improvement
                    - superscript [ref=f3e187]:
                      - link "2" [ref=f3e189] [cursor=pointer]:
                        - /url: "#citation-bottom-2"
                    - text: ":"
                  - list [ref=f3e190]:
                    - listitem [ref=f3e191]: The unit tests used to evaluate the correctness of a solution are often overly specific, and in some cases are even unrelated to the issue. This potentially causes correct solutions to be rejected.
                    - listitem [ref=f3e192]: Many samples have an issue description that is underspecified, leading to ambiguity on what the problem is and how it should be solved.
                    - listitem [ref=f3e193]: It is sometimes difficult to reliably set up the SWE-bench development environments for the agents, inadvertently causing unit tests to fail regardless of the solution. In such cases, perfectly valid solutions might be graded as incorrect.
                  - paragraph [ref=f3e194]: Here is an example illustrating the first of these issues.
