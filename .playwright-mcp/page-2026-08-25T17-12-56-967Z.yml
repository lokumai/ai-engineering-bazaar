            - generic [ref=f3e748]:
              - heading "Discussion & Limitations" [level=2] [ref=f3e752]
              - generic [ref=f3e756]:
                - paragraph [ref=f3e757]: We use SWE-bench as one of several evaluations tracking the Medium risk level of the Model Autonomy risk category in our Preparedness Framework. Tracking catastrophic risk levels via evaluations relies on ensuring that we can trust evaluation results and are calibrated about what the scores entail.
                - paragraph [ref=f3e758]: "Our experiences suggest that we should:"
                - paragraph [ref=f3e759]:
                  - generic [ref=f3e760]: Invest in deeply understanding our benchmarks.
                  - text: Although SWE-bench was designed thoughtfully, it underestimates model capabilities due to the issues mentioned in this blogpost. As our systems get closer to AGI, we need to evaluate them on increasingly more challenging tasks. This also elevates the level of expertise and care needed to curate and verify benchmarks to ensure that they are sufficiently challenging and robust (a case where work like
                  - link "CriticGPT⁠" [ref=f3e761] [cursor=pointer]:
                    - /url: https://openai.com/index/finding-gpt4s-mistakes-with-gpt-4/
                    - generic [ref=f3e762]: CriticGPT
                    - text: ⁠
                  - text: ", which explores ways in which AI can assist with annotation pipelines, may be helpful)."
                - paragraph [ref=f3e763]:
                  - generic [ref=f3e764]: Account for progress in the ecosystem.
                  - text: Community-led progress in agent scaffolding highlights the need to consider potential external enhancements to a model when assessing risk. Looking at the difference between the worst- and best-performing scaffolds for a given model on the
                  - link "SWE-bench leaderboards⁠ (opens in a new window)" [ref=f3e765] [cursor=pointer]:
                    - /url: https://www.swebench.com/
                    - generic [ref=f3e766]: SWE-bench leaderboards
                    - text: ⁠
                    - generic [ref=f3e767]: (opens in a new window)
                  - text: ", we can see that, for example, GPT‑4’s performance on SWE-bench Lite varies between 2.7% using an early RAG-based scaffold and 28.3% using CodeR. Thus the Preparedness Framework calls for evaluations to be run continually and as often as needed to identify any non-trivial capability change; which includes before, during, and even after training, where models can be enhanced via integration with external systems. Furthermore, curating evaluations is an ecosystem-wide effort, and we hope to continue collaborating with researchers on building trustworthy, high-quality evaluations."
                - paragraph [ref=f3e768]:
                  - generic [ref=f3e769]: Be cognizant of limitations.
                  - text: Evaluations based on static datasets are inherently limited, and SWE-bench is no exception. Given that the benchmark is composed of scrapes of public GitHub repos, large foundation models that are pre-trained on internet text are likely to be contaminated on the tasks. Furthermore, SWE-bench only covers a narrow distribution of the Medium risk level for model autonomy and so must be supplemented with other evaluations.
                - paragraph [ref=f3e770]: We believe in an empirical and scientific approach to tracking and protecting against catastrophic risk. Building and continually improving evaluations is a key element of this work. There remains much to be done, and we’re eager to see more work from the community in contributing valuable benchmarks like SWE-bench.
