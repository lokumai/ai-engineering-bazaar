            - generic [ref=f3e547]:
              - paragraph [ref=f3e548]: The chart below compares the difficulty distributions of the original SWE-bench datasets and our new SWE-bench Verified dataset. We estimate the difficulty distribution of SWE-bench based on our random subset of 1699 samples. Note that while these results provide estimates of the effort necessary to implement a solution (refer to our annotation instructions for the precise wording), they assume a software engineer who is able to figure out the solution. In practice, we expect the baseline solve rate of a typical human software engineer to be lower than 100%.
              - paragraph [ref=f3e549]: "We observe that most (77.8%) of the samples in the original SWE-bench dataset were estimated to take less than an hour for an experienced software engineer to complete. Both SWE-bench Lite and our new SWE-bench Verified dataset skews this further, leaving fewer than 10% of issues estimated to take longer than an hour. However, the mechanism underlying this shift is importantly different: SWE-bench Lite subsampled the original dataset to make the benchmark easier, whereas SWE-bench Verified attempts to remove infeasible samples from the dataset. We further explore this effect in the next section."
