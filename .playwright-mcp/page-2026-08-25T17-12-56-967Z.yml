              - generic [ref=f3e612]:
                - paragraph [ref=f3e613]:
                  - text: With our new SWE-bench Verified dataset, we tested GPT‑4o’s performance using several open-source scaffolds that performed well on the original SWE-bench leaderboards
                  - superscript [ref=f3e614]:
                    - link "4" [ref=f3e616] [cursor=pointer]:
                      - /url: "#citation-bottom-4"
                  - text: .
                - paragraph [ref=f3e617]:
                  - text: We found that GPT‑4o’s performance on the best-performing scaffold reaches 33.2% on SWE-bench Verified, more than doubling its score of 16% on the original SWE-bench. In general, this validates our initial suspicion that the original SWE-bench dataset underestimates agent abilities. Note that the jump from SWE-bench Lite to SWE-bench Verified is not as significant, because SWE-bench Lite was already
                  - link "filtered in a way that makes it easier⁠ (opens in a new window)" [ref=f3e618] [cursor=pointer]:
                    - /url: https://www.swebench.com/lite.html
                    - generic [ref=f3e619]: filtered in a way that makes it easier
                    - text: ⁠
                    - generic [ref=f3e620]: (opens in a new window)
                  - generic [ref=f3e621]: than the full dataset, though that process would not fully capture the same issues as our filtering procedure.
            - generic [ref=f3e624]:
              - generic [ref=f3e625]:
                - heading "Performance of open-source scaffolds on SWE-bench subsets" [level=5] [ref=f3e626]
