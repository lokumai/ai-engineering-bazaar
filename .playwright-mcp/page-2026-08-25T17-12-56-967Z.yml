                    - text: parameter is used, although the original problem statement in the issue text above does not convey this requirement. Furthermore, even if the agent realized that a DeprecationWarning should be raised, the test also requires the agent to exactly match the deprecation message, which was only arrived at after some discussion in the PR which the agent has no access to.
                  - paragraph [ref=f3e301]: Note that the agent is only given the problem description from the main issue text, and does not have visibility into the tests that it needs to pass. Given this setup, it would be nearly impossible for an agent to solve this sample in SWE-bench.
            - generic [ref=f3e303]:
              - heading "SWE-bench Verified" [level=2] [ref=f3e307]
              - generic [ref=f3e311]:
                - paragraph [ref=f3e312]: To address these issues, we launched a human annotation campaign with professional software developers to screen each sample of the SWE-bench test set for appropriately scoped unit tests and well-specified issue descriptions.
                - paragraph [ref=f3e313]: "Together with the authors of SWE-bench, we are releasing SWE-bench Verified: a subset of the original test set from SWE-bench, consisting of 500 samples verified to be non-problematic by our human annotators. This version supersedes the original SWE-bench and SWE-bench Lite test sets. Additionally, we are releasing our human annotations for all SWE-bench test samples. These annotations enable slicing the dataset by difficulty. The 'easy' subset is composed of 196 <15-minute fix tasks, while the 'hard' subset is composed of 45 >1-hour tasks."
                - paragraph [ref=f3e314]:
                  - text: We also collaborated with the SWE-bench authors to
                  - link "develop a new evaluation harness for SWE-bench⁠ (opens in a new window)" [ref=f3e315] [cursor=pointer]:
                    - /url: https://github.com/princeton-nlp/SWE-bench/tree/main/docs/20240627_docker
                    - generic [ref=f3e316]: develop a new evaluation harness for SWE-bench
                    - text: ⁠
                    - generic [ref=f3e317]: (opens in a new window)
                  - text: which uses containerized Docker environments to make evaluating on SWE-bench easier and more reliable.
                - paragraph [ref=f3e318]:
                  - text: On SWE-bench Verified, GPT‑4o resolves 33.2% of samples
                  - superscript [ref=f3e319]:
                    - link "3" [ref=f3e321] [cursor=pointer]:
                      - /url: "#citation-bottom-3"
                  - text: ", with the best performing open-source scaffold, Agentless, doubling its previous score of 16% on SWE-bench."
            - generic [ref=f3e323]:
              - heading "Our Approach" [level=2] [ref=f3e327]
              - generic [ref=f3e331]:
                - paragraph [ref=f3e332]: We worked with 93 software developers experienced in Python to manually screen SWE-bench samples for quality. We annotated 1,699 random samples from the SWE-bench test set to produce SWE-bench Verified. The following analysis is based on the 1,699 samples.
                - paragraph [ref=f3e333]: "We annotate samples to capture:"
                - list [ref=f3e334]:
                  - listitem [ref=f3e335]: Whether we consider the issue description to be underspecified and hence unfair to be testing on.
                  - listitem [ref=f3e336]:
                    - text: Whether the
                    - code [ref=f3e337]: FAIL_TO_PASS
                    - text: unit tests filter out valid solutions.
                - paragraph [ref=f3e338]: Each annotation criterion has a label ranging [0, 1, 2, 3] in increasing severity. Labels 0 and 1 are minor; labels 2 and 3 are severe and indicate that the sample is inadequate in some way and should be discarded. We choose to annotate across four ordinal categories rather than a single binary label of severe/not severe to capture more granular detail.
                - paragraph [ref=f3e339]:
                  - text: Additionally, we rate the difficulty of each sample by having annotators estimate how long it would take for a developer to decide upon and implement the solution, assuming the sample is non-problematic. Finally, we provide a freeform input option to flag any other major issues with the sample (for example, if the
                  - code [ref=f3e340]: FAIL_TO_PASS
                  - text: unit tests are easily gamed, this could lead to an invalid solution being marked as correct).
                - paragraph [ref=f3e341]: Our team of engineers first hand-labeled 50 samples to a high degree of confidence for use in annotator onboarding tests. To take part in the annotation campaign, each prospective annotator had to pass our onboarding tests. We provided detailed feedback to each annotator throughout onboarding to better train them for the task. Annotators were not necessarily prior experts in the codebases relevant to SWE-bench, but were given time to familiarize themselves with each codebase they worked with.
                - paragraph [ref=f3e342]: To ensure a high-quality dataset, each sample is labeled 3 times by separate annotators. It is easy to accidentally miss potential issues, and issues themselves can be ambiguous, so we conservatively ensemble annotations by taking the highest-severity label amongst the 3 annotators.
                - paragraph [ref=f3e343]:
                  - text: The full text of our annotation rubric can be found
                  - link "here⁠ (opens in a new window)" [ref=f3e344] [cursor=pointer]:
                    - /url: https://cdn.openai.com/introducing-swe-bench-verified/swe-b-annotation-instructions.pdf
                    - generic [ref=f3e345]: here
                    - text: ⁠
                    - generic [ref=f3e346]: (opens in a new window)
                  - generic [ref=f3e347]: .
            - generic [ref=f3e349]:
              - heading "Annotation Criteria" [level=3] [ref=f3e353]
              - generic [ref=f3e358]:
                - generic [ref=f3e359]:
                  - button [ref=f3e360] [cursor=pointer]:
                    - heading "Are the tasks well-specified?" [level=3] [ref=f3e361]
                  - generic [ref=f3e364]:
                    - paragraph [ref=f3e365]: Evaluated models are expected to generate a patch given the problem statement and codebase. If the problem statement is poorly specified, it can be significantly harder, or in some cases impossible, to generate a patch that solves the problem.
                    - paragraph [ref=f3e366]: "We label the problem statement with these 4 possible labels:"
                    - list [ref=f3e367]:
                      - listitem [ref=f3e368]:
                        - paragraph [ref=f3e369]: "0: The issue is well-specified and it is clear what is required for a successful solution."
                      - listitem [ref=f3e370]:
                        - paragraph [ref=f3e371]: "1: There are some blanks to fill in about the issue, but there is a sensible interpretation of what is required for a successful solution."
                      - listitem [ref=f3e372]:
                        - paragraph [ref=f3e373]: "2: The issue is vague and there is room for ambiguity. It is unclear what a successful solution would look like."
                      - listitem [ref=f3e374]:
                        - paragraph [ref=f3e375]: "3: It is almost impossible to understand what you are being asked to do without further information."
                - generic [ref=f3e378]:
                  - button [ref=f3e379] [cursor=pointer]:
                    - heading "How valid are the evaluation criteria?" [level=3] [ref=f3e380]
                  - generic [ref=f3e383]:
                    - paragraph [ref=f3e384]: To evaluate a model’s proposed solution, the model’s generated patch is applied to the codebase and then the FAIL_TO_PASS and PASS_TO_PASS unit tests are executed. If the patch can be applied successfully and all of the tests pass, then the proposed solution is considered to have successfully resolved the issue.
                    - paragraph [ref=f3e385]: We check if the FAIL_TO_PASS tests might fail even when a valid solution is provided, resulting in a false negative.
                    - paragraph [ref=f3e386]: "We label the tests with these 4 possible labels:"
                    - list [ref=f3e387]:
                      - listitem [ref=f3e388]:
                        - paragraph [ref=f3e389]: "0: The tests perfectly cover all possible solutions."
                      - listitem [ref=f3e390]:
                        - paragraph [ref=f3e391]: "1: The tests cover the majority of correct solutions, however some unusual solutions may be missed."
                      - listitem [ref=f3e392]:
                        - paragraph [ref=f3e393]: "2: The tests work but some perfectly reasonable solutions may be missed by the tests."
                      - listitem [ref=f3e394]:
                        - paragraph [ref=f3e395]: "3: The tests are too narrow/broad or they look for something different than what the issue is about."
                - generic [ref=f3e398]:
                  - button [ref=f3e399] [cursor=pointer]:
                    - heading "How difficult are the tasks?" [level=3] [ref=f3e400]
                  - generic [ref=f3e403]:
                    - paragraph [ref=f3e404]: As supplementary information (not used for dataset filtering), we further ask annotators to estimate how much time it would take an experienced software engineer who has had a few hours to familiarize themselves with the codebase to write a patch solving the issue. This allows us to understand the difficulty distribution of SWE-bench tasks. Note that this may overestimate the difficulty for a LLM, which may have memorized aspects of codebases and PRs. We ensemble difficulty annotations by taking the majority choice for a sample, or the median if there is no majority.
                    - paragraph [ref=f3e405]: "There are 4 possible labels for difficulty:"
                    - list [ref=f3e406]:
                      - listitem [ref=f3e407]:
                        - paragraph [ref=f3e408]: <15 min fix (e.g., a trivial change adding some assertions to a function)
                      - listitem [ref=f3e409]:
                        - paragraph [ref=f3e410]: 15 min–1 hour (e.g., a small change that requires a bit of thought)
                      - listitem [ref=f3e411]:
                        - paragraph [ref=f3e412]: 1–4 hours (e.g., substantially rewriting a function or editing multiple files)
                      - listitem [ref=f3e413]:
                        - paragraph [ref=f3e414]: ">4 hours (e.g., a very esoteric issue that clearly requires a substantial amount of research to fix, changing >100 lines of code)"
            - generic [ref=f3e418]:
              - heading "Dataset construction" [level=3] [ref=f3e422]
              - generic [ref=f3e426]:
                - paragraph [ref=f3e427]:
                  - text: To construct SWE-bench Verified, we filter out any sample from the original test set where either the problem statement or the
                  - code [ref=f3e428]: FAIL_TO_PASS
                  - text: unit tests have an ensemble label of 2 or above in severity. We also filter out all samples that have other major issues flagged. Given our ensembling method, this is equivalent to filtering out samples where any single annotator of three has flagged an issue with the sample. This approach leads to a higher false-positive rate in removing samples, but helps increase our confidence in sample quality for the final dataset.
                - paragraph [ref=f3e429]: We include as many samples with difficulty 1-4 hours and >4 hours as possible, and then we randomly sample the remainder to arrive at the 500 samples that constitute SWE-bench Verified.
