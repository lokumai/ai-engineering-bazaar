          - generic [ref=f15e109]:
            - paragraph [ref=f15e111]:
              - text: Since we first published
              - link "SWE-bench Verified" [ref=f15e112] [cursor=pointer]:
                - /url: /index/introducing-swe-bench-verified/
              - text: in August 2024, the industry has widely used it to measure the progress of models on autonomous software engineering tasks. After its release, SWE-bench Verified provided a strong signal of capability progress and became a standard metric reported in frontier model releases. Tracking and forecasting progress of these capabilities is also an important part of OpenAI’s
              - link "Preparedness Framework" [ref=f15e113] [cursor=pointer]:
                - /url: /index/updating-our-preparedness-framework/
              - text: . When we created the Verified benchmark initially, we attempted to solve issues in the original evaluation that made certain tasks impossible to accomplish in the
              - link "SWE-bench dataset⁠ (opens in a new window)" [ref=f15e114] [cursor=pointer]:
                - /url: https://arxiv.org/abs/2310.06770
                - text: SWE-bench dataset⁠
                - generic [ref=f15e115]: (opens in a new window)
              - text: .
            - paragraph [ref=f15e117]:
              - text: After initial leaps, state-of-the-art progress on SWE-bench Verified has slowed,
              - link "improving⁠ (opens in a new window)" [ref=f15e118] [cursor=pointer]:
                - /url: https://llm-stats.com/benchmarks/swe-bench-verified
                - text: improving⁠
                - generic [ref=f15e119]: (opens in a new window)
              - text: "from 74.9% to 80.9% in the last 6 months. This raises the question: do the remaining failures reflect model limitations or properties of the dataset itself?"
            - paragraph [ref=f15e121]: "In a new analysis, we found two major issues with the Verified set that indicate the benchmark is no longer suitable for measuring progress on autonomous software engineering capabilities for frontier launches at today’s performance levels:"
            - list [ref=f15e123]:
              - listitem [ref=f15e124]:
                - generic [ref=f15e125]: "Tests reject correct solutions:"
                - text: We audited a 27.6% subset of the dataset that models often failed to solve and found that at least 59.4% of the audited problems have flawed test cases that reject functionally correct submissions, despite our best efforts in improving on this in the initial creation of SWE-bench Verified.
              - listitem [ref=f15e126]:
                - generic [ref=f15e127]: "Training on solutions:"
                - text: Because large frontier models can learn information from their training, it is important that they are never trained on problems and solutions they are evaluated on. This is akin to sharing problems and solutions for an upcoming test with students before the test - they may not memorize the answer but students who have seen the answers before will certainly do better than those without. SWE-bench problems are sourced from open-source repositories many model providers use for training purposes. In our analysis we found that all frontier models we tested were able to reproduce the original, human-written bug fix used as the ground-truth reference, known as the gold patch, or verbatim problem statement specifics for certain tasks, indicating that all of them have seen at least some of the problems and solutions during training.
            - paragraph [ref=f15e129]:
              - generic [ref=f15e130]: We also found evidence that models that have seen the problems during training are more likely to succeed, because they have additional information needed to pass the underspecified tests.
            - paragraph [ref=f15e132]: This means that improvements on SWE-bench Verified no longer reflect meaningful improvements in models’ real-world software development abilities. Instead, they increasingly reflect how much the model was exposed to the benchmark at training time. This is why we have stopped reporting SWE-bench Verified scores, and we recommend that other model developers do so too.
            - paragraph [ref=f15e134]: We’re building new, uncontaminated evaluations to better track coding capabilities, and we think this is an important area to focus on for the wider research community. Until we have those, OpenAI recommends reporting results for SWE-bench Pro.
            - heading "Background" [level=2] [ref=f15e138]
            - paragraph [ref=f15e140]:
              - text: The original
              - link "SWE-bench⁠ (opens in a new window)" [ref=f15e141] [cursor=pointer]:
                - /url: https://arxiv.org/abs/2310.06770
                - text: SWE-bench⁠
                - generic [ref=f15e142]: (opens in a new window)
              - text: "evaluation was released in 2023. Each problem is sourced from a resolved GitHub issue in one of 12 open-source Python repositories and paired with the corresponding pull request (PR). To determine whether a model-generated code change is correct, each problem comes with two sets of tests:"
            - list [ref=f15e144]:
              - listitem [ref=f15e145]: Tests that fail on the unmodified codebase but pass if the issue is correctly fixed
              - listitem [ref=f15e146]: Regression tests that pass both before and after the fix to ensure unrelated functionality remains intact.
            - paragraph [ref=f15e148]: The model does not see the tests. It has to produce a code change given only the original issue text and the state of the repository before the fix. It passes a problem only if all tests pass after the code change is applied.
            - paragraph [ref=f15e150]: We found many issues with that evaluation that could lead to underreporting the capability of models.
            - list [ref=f15e152]:
              - listitem [ref=f15e153]: Some unit tests were overly specific or misaligned with the task so correct fixes could be rejected.
              - listitem [ref=f15e154]: Many task statements were underspecified, which could lead to multiple valid interpretations - while the tests only covered a specific one.
              - listitem [ref=f15e155]: Depending on setup of the environment (for example Linux vs Windows, or the python version), some tests could spuriously fail
            - paragraph [ref=f15e157]:
              - text: We created
              - link "SWE-bench Verified" [ref=f15e158] [cursor=pointer]:
                - /url: /index/introducing-swe-bench-verified/
              - text: in 2024 to address these issues. We worked with expert software engineers to review 1,699 SWE-bench problems and filter out problems that had these issues. Each problem was reviewed by three experts independently. This review process resulted in SWE-bench Verified, a curated set of 500 problems.
            - heading "Too narrow and too wide tests" [level=2] [ref=f15e162]
            - paragraph [ref=f15e164]: While SWE-bench Verified is a big improvement over the initial version, residual issues remain. We conducted an audit of 138 SWE-bench Verified problems that OpenAI o3 did not consistently solve over 64 independent runs. Each case was independently reviewed by at least six experienced software engineers. If an expert flagged an issue, it was re-verified by an additional team.
            - paragraph [ref=f15e166]: We found that 59.4% of the 138 problems contained material issues in test design and/or problem description, rendering them extremely difficult or impossible even for the most capable model or human to solve.
            - list [ref=f15e168]:
              - listitem [ref=f15e169]:
                - text: 35.5% of the audited tasks have strict test cases that enforce specific implementation details, invalidating many functionally correct submissions, which we call
                - generic [ref=f15e170]: narrow test cases.
              - listitem [ref=f15e171]:
                - text: 18.8% of the audited tasks have tests that check for additional functionality that wasn’t specified in the problem description, which we call
                - generic [ref=f15e172]: wide test cases.
              - listitem [ref=f15e173]: The remaining 5.1% of tasks had miscellaneous issues that were not well grouped with this taxonomy.
            - paragraph [ref=f15e175]:
              - text: An illustrative example of the first failure mode is
              - link "pylint-dev__pylint-4551⁠ (opens in a new window)" [ref=f15e176] [cursor=pointer]:
                - /url: https://github.com/pylint-dev/pylint/pull/4551
                - text: pylint-dev__pylint-4551⁠
                - generic [ref=f15e177]: (opens in a new window)
              - text: ", where the PR introduces a new function `get_annotation` as part of the overall solution. This function name is not mentioned in the problem description, but is imported directly by the tests. While some models might intuit to create such a function, it’s not strictly necessary to implement a function with this specific name to correctly address the problem. Many valid solutions fail the tests on import errors."
