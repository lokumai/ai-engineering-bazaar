            - heading "Contamination" [level=2] [ref=f15e408]
            - paragraph [ref=f15e410]: SWE-bench Verified and the repositories (code bases and release notes) are both open-source and broadly used and discussed, which makes avoiding contamination difficult for model developers.
            - paragraph [ref=f15e412]:
              - text: We first encountered signs of contamination in our own models. For example, when GPT‑5.2 solved 31 tasks we identified to be almost impossible to solve. In
              - link "django__django-14725⁠ (opens in a new window)" [ref=f15e413] [cursor=pointer]:
                - /url: https://github.com/django/django/pull/14725
                - text: django__django-14725⁠
                - generic [ref=f15e414]: (opens in a new window)
              - text: "the tests require a specific new parameter `edit_only` which is not explicitly required by the problem statement. While solving the problem, GPT‑5.2 shows in its chain of thought that it has information about the release notes that detail changes to the codebase, and correctly identifies that the `edit_only` parameter was introduced in Django 4.1."
            - generic [ref=f15e418]:
              - heading "GPT‑5.2 CoT" [level=4] [ref=f15e422]
              - generic [ref=f15e425]:
                - generic [ref=f15e426]:
                  - heading "Plain Text" [level=4] [ref=f15e427]
                  - button "Copy code block" [ref=f15e428] [cursor=pointer]
                - code [ref=f15e432]:
                  - generic [ref=f15e434]:
                    - generic [ref=f15e435]: "1"
                    - generic [ref=f15e436]: "There is also `edit_only` parameter maybe added around 4.1 or 4.2. Since this is 4.1 dev 2022, the code might be before introduction. We will implement now. Hidden tests will check new behavior."
            - paragraph [ref=f15e438]: To assess how significant contamination is more broadly, we created an automated red-teaming setup. For each SWE-bench Verified question, we tasked GPT‑5 with probing a GPT‑5.2‑Chat, Claude Opus 4.5 and Gemini 3 Flash Preview for contamination. These models were chosen to exclude reasoning models, but we acknowledge there is likely a non-trivial capability gap between them.
            - paragraph [ref=f15e440]: "To probe for contamination, GPT‑5 received: the SWE-bench Verified task’s ID, description, gold patch, and PR tests. Over 15 turns, we allowed GPT‑5 to vary the system/developer prompt, user prompt, and assistant prefill and different elicitation strategies. After each turn, a judge model labeled how much novel task-specific information appeared and each response was labeled for contamination severity from “none” to “strong.” GPT‑5 was allowed to adapt its strategy based on prior turns to iteratively recover task-specific details. For each example of strong contamination, we verified with another judge that GPT‑5 didn’t leak too much information to the target model. Finally, we then manually reviewed the “strong” examples that make up the transcripts in this post."
            - paragraph [ref=f15e442]: Below are examples of strong contamination across different model providers.
