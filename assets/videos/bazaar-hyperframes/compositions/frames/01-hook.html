    /* Hand-drawn brick underline. Its viewBox matches the word's aspect closely, so the

    .f01-hook-underline {

  <div id="root" data-composition-id="01-hook" data-start="0" data-duration="3.623" data-width="1920" data-height="1080">

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const DURATION = 3.273;
      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.00-0.25s): the tile band wipes in left to right across the top edge.
      const band = document.getElementById("f01-hook-band");
      tl.fromTo(
        band,
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.25, ease: "power2.inOut" },
        0,
      );

      // Scenes 2-3: the sentence assembles word by word (dynamic-content-sequencing).
      // Each word's start is computed once from content length: a longer word earns a
      // longer dwell before the next arrives, and the line break carries a short beat.
      // Line 1 lands by ~1.1s, "is guesswork." follows on the same left edge.
      const FIRST_START = 0.18;
      const BASE = 0.06;
      const SEC_PER_CHAR = 0.02;
      const LINE_BREAK = 0.06;
      const WORD_IN = 0.34;

      const headline = document.getElementById("f01-hook-headline");
      const words = Array.prototype.slice.call(headline.getElementsByClassName("f01-hook-word"));
      let cumulative = FIRST_START;
      const TIMELINE = words.map(function (el) {
        const text = (el.textContent || "").trim();
        const start = cumulative;
        cumulative += BASE + text.length * SEC_PER_CHAR + (el.getAttribute("data-line-end") ? LINE_BREAK : 0);
        return { el: el, start: start };
      });

      TIMELINE.forEach(function (entry) {
        tl.fromTo(
          entry.el,
          { opacity: 0, y: 30, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: WORD_IN, ease: "power3.out" },
          entry.start,
        );
      });

      // Scene 3 tail: the brick underline self-draws beneath "guesswork." (svg-path-draw),
      // starting as the word settles, a hand lifting at the end of the stroke.
      const payoffStart = TIMELINE[TIMELINE.length - 1].start;
      const stroke = document.getElementById("f01-hook-stroke");
      const measured = stroke.getTotalLength ? stroke.getTotalLength() : 0;
      const len = (measured > 0 ? measured : 520) * 1.05;
      stroke.style.strokeDasharray = len + " " + len;
      stroke.style.strokeDashoffset = String(len);
      const DRAW_START = payoffStart + 0.22;
      // Hidden until the pen touches down, so a round cap never shows as a dot early.
      tl.fromTo(stroke, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, DRAW_START);
      tl.fromTo(stroke, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.36, ease: "power2.out" }, DRAW_START);

      // Scene 4: hold still to the end of the frame. No drift, no exit.
      tl.set({}, {}, DURATION);

      window.__timelines["01-hook"] = tl;
    })();
