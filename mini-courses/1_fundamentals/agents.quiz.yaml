# Quick quiz: AI Agents. Reinforcement, not assessment.
questions:
  - answer: 2
    en:
      question: "What ends the agent loop?"
      options:
        - "A counter stops the loop after a fixed number of passes."
        - "A supervisor checks the work and decides that it is finished."
        - "The LLM calls no tool, and its output becomes the final answer."
        - "The host stops the loop when every tool has run once."
      explain: "The absence of a tool call is the termination condition, and the text the model writes is the answer. The loop has no counter and no supervisor."
    tr:
      question: "Agent döngüsünü ne bitirir?"
      options:
        - "Sabit sayıda geçişten sonra bir sayaç (counter) döngüyü durdurur."
        - "Bir denetleyici (supervisor) işi kontrol eder ve bittiğine karar verir."
        - "LLM hiçbir tool çağırmaz ve çıktısı son cevap olur."
        - "Host, her tool bir kez çalıştığında döngüyü durdurur."
      explain: "Tool çağrısının olmaması, bitiş koşulunun ta kendisidir. Modelin yazdığı metin ise cevaptır; döngüde ne bir sayaç (counter) ne de bir denetleyici (supervisor) vardır."
    fa:
      question: "loop یه agent رو چی تموم می‌کنه؟"
      options:
        - "یه counter که بعد از تعداد مشخصی دور، loop رو نگه می‌داره."
        - "یه supervisor که کار رو بررسی می‌کنه و تشخیص می‌ده تموم شده."
        - "LLM دیگه هیچ tool‌ای صدا نمی‌زنه و خروجیش می‌شه جواب نهایی."
        - "host وقتی همه‌ی tool‌ها یه بار اجرا شدن، loop رو نگه می‌داره."
      explain: "شرط پایان، نبودن tool call‌ه و متنی که مدل می‌نویسه همون جوابه. loop نه counter داره، نه supervisor."
  - answer: 0
    en:
      question: "What is the difference between a plain LLM and an agent?"
      options:
        - "The same model is called many times, and each call can ask for a tool."
        - "The agent uses a different model that was trained to run tools."
        - "The agent's model keeps the past messages stored inside itself."
        - "The agent's model runs the tools itself between two answers."
      explain: "A plain LLM is single-turn: one input, one output. An agent calls the same model again and again, and nothing is added to the model."
    tr:
      question: "Düz bir LLM ile bir agent arasındaki fark nedir?"
      options:
        - "Aynı model birçok kez çağrılır ve her çağrıda bir tool isteyebilir."
        - "Agent, tool çalıştırmak için eğitilmiş farklı bir model kullanır."
        - "Agent'ın modeli geçmiş mesajları kendi içinde saklar."
        - "Agent'ın modeli, iki cevap arasında tool'ları kendisi çalıştırır."
      explain: "Düz bir LLM tek turlu (single-turn) çalışır: bir girdi, bir çıktı. Bir agent aynı modeli tekrar tekrar çağırır ve modele hiçbir şey eklenmez."
    fa:
      question: "فرق یه LLM معمولی با یه agent چیه؟"
      options:
        - "توی agent همون مدل چند بار صدا زده می‌شه و هر بار می‌تونه یه tool بخواد."
        - "agent از یه مدل دیگه استفاده می‌کنه که برای اجرای tool‌ها train شده."
        - "مدل agent پیام‌های قبلی رو داخل خودش نگه می‌داره."
        - "مدل agent بین دو تا جواب، خودش tool‌ها رو اجرا می‌کنه."
      explain: "LLM معمولی single-turn‌ه: یه ورودی، یه خروجی. agent همون مدل رو بارها و بارها صدا می‌زنه و هیچ چیزی به خود مدل اضافه نمی‌شه."
  - answer: 1
    en:
      question: "A single LLM call needs no framework. Why does an agent use one?"
      options:
        - "The framework makes each model call faster and cheaper to run."
        - "The host must run the loop, parse tool calls, and keep the message stack."
        - "The framework adds new reasoning skills to the model's weights."
        - "The framework moves the loop inside the LLM, so the model runs it."
      explain: "All of the loop runs on the host machine, and a framework writes that boilerplate once. A single call has no loop, no tool parsing and no message stack, so it needs no framework."
    tr:
      question: "Tek bir LLM çağrısına framework gerekmez. Peki bir agent neden bir framework kullanır?"
      options:
        - "Framework, her model çağrısını daha hızlı ve daha ucuz çalıştırır."
        - "Host'un döngüyü çalıştırması, tool call'ları ayrıştırması ve mesaj yığınını (message stack) tutması gerekir."
        - "Framework, modelin weight'lerine yeni akıl yürütme (reasoning) becerileri ekler."
        - "Framework, döngüyü LLM'in içine taşır ve döngüyü model çalıştırır."
      explain: "Döngünün tamamı host makinede çalışır ve framework bu boilerplate kodunu bir kez yazar. Tek bir çağrıda döngü, tool ayrıştırması ya da mesaj yığını bulunmaz; bu yüzden framework gerekmez."
    fa:
      question: "برای یه call ساده به LLM هیچ framework‌ای لازم نیست. پس چرا agent‌ها از framework استفاده می‌کنن؟"
      options:
        - "چون framework هر call به مدل رو سریع‌تر و ارزون‌تر می‌کنه."
        - "چون host باید loop رو اجرا کنه، tool call‌ها رو parse کنه و message stack رو نگه داره."
        - "چون framework مهارت‌های استدلال تازه‌ای به weight‌های مدل اضافه می‌کنه."
        - "چون framework، loop رو می‌بره داخل LLM تا خود مدل اجراش کنه."
      explain: "کل loop روی host machine اجرا می‌شه و framework این کد boilerplate رو یه بار برای همیشه می‌نویسه. یه call ساده نه loop داره، نه parse کردن tool call، نه message stack، پس framework هم لازم نداره."
  - answer: 3
    en:
      question: "How does the LLM in an agent know which tools it can call?"
      options:
        - "The model learned the tools during its training on text."
        - "The model remembers the tool list from its first call in the loop."
        - "The model reads the Python files on the host to find the tools."
        - "The system prompt lists them, and the host sends it before every call."
      explain: "The host rebuilds the system prompt before every call, and it lists each tool's name and description. The @tool decorator builds that list from your function's name, docstring and type hints."
    tr:
      question: "Bir agent'taki LLM hangi tool'ları çağırabileceğini nereden biliyor?"
      options:
        - "Model, tool'ları metin üzerindeki training sırasında öğrendi."
        - "Model, tool listesini döngünün ilk çağrısından hatırlıyor."
        - "Model, tool'ları bulmak için host'taki Python dosyalarını okuyor."
        - "System prompt onları listeler ve host bunu her çağrıdan önce gönderir."
      explain: "Host, system prompt'u her çağrıdan önce yeniden oluşturur ve bu prompt her tool'un adını ile açıklamasını listeler. @tool dekoratörü bu listeyi fonksiyonunun adından, docstring'inden ve type hint'lerinden üretir."
    fa:
      question: "LLM داخل یه agent از کجا می‌فهمه کدوم tool‌ها رو می‌تونه صدا بزنه؟"
      options:
        - "موقع training از روی متن‌ها tool‌ها رو یاد گرفته."
        - "فهرست tool‌ها رو از اولین call توی loop یادشه."
        - "فایل‌های Python روی host رو می‌خونه تا tool‌ها رو پیدا کنه."
        - "system prompt فهرستشون رو داره و host قبل از هر call می‌فرستدش."
      explain: "host قبل از هر call، system prompt رو از نو می‌سازه و اسم و توضیح همه‌ی tool‌ها رو توش می‌ذاره. این فهرست رو decorator @tool از اسم تابع، docstring و type hint‌هات درمیاره."
