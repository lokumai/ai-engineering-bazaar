# Quick quiz: LLM Fundamentals. Reinforcement, not assessment.
questions:
  - answer: 2
    en:
      question: "An LLM is trained on a huge amount of text. What one skill does it learn from that text?"
      options:
        - "It learns to search the internet for the answer to each prompt."
        - "It learns to run functions on your own machine."
        - "It learns to guess the most likely next word."
        - "It learns to pick answers from a stored list of facts."
      explain: "An LLM learns one skill: it guesses the most likely next word. Everything it writes is this one guess, repeated one word at a time."
    tr:
      question: "Bir LLM çok büyük bir metin yığınıyla eğitilir. Bu metinden hangi tek yeteneği (skill) öğrenir?"
      options:
        - "Her prompt için cevabı internette aramayı öğrenir."
        - "Kendi makinende fonksiyon çalıştırmayı öğrenir."
        - "En olası sonraki kelimeyi tahmin etmeyi öğrenir."
        - "Cevapları saklı bir gerçek listesinden seçmeyi öğrenir."
      explain: "Bir LLM tek bir yetenek (skill) öğrenir: en olası sonraki kelimeyi tahmin etmek. Yazdığı her şey, bu tek tahminin kelime kelime tekrarından ibarettir."
    fa:
      question: "LLM با حجم خیلی زیادی متن آموزش می‌بینه. از این همه متن، فقط چه کاری رو یاد می‌گیره؟"
      options:
        - "یاد می‌گیره برای هر prompt، جواب رو توی اینترنت پیدا کنه."
        - "یاد می‌گیره function‌ها رو روی ماشین خودت اجرا کنه."
        - "یاد می‌گیره محتمل‌ترین کلمه‌ی بعدی رو حدس بزنه."
        - "یاد می‌گیره جواب‌ها رو از یه فهرست آماده از دانسته‌ها برداره."
      explain: "LLM فقط یه کار یاد می‌گیره: حدس زدن محتمل‌ترین کلمه‌ی بعدی. هر چیزی هم که می‌نویسه، همین یه حدسه که کلمه به کلمه تکرار می‌شه."
  - answer: 0
    en:
      question: "What is the context window of an LLM?"
      options:
        - "The maximum text the model can process at one time, input and output together."
        - "The maximum length of the reply only, which you set with a hyperparameter."
        - "The number of parameters in the model, which decides how big the model is."
        - "The list of tools that the SystemMessage allows the model to call."
      explain: "The context window limits the input and the output together, and you get an error if you exceed it. Max output tokens limits only the reply."
    tr:
      question: "Bir LLM'in context window'u nedir?"
      options:
        - "Modelin tek seferde işleyebildiği en fazla metin, girdi ve çıktı birlikte."
        - "Yalnızca yanıtın en fazla uzunluğu; bunu bir hiperparametre ile ayarlarsın."
        - "Modeldeki parametre sayısı; modelin ne kadar büyük olduğunu belirler."
        - "SystemMessage'ın modelin çağırabileceği tool'ların listesi."
      explain: "Context window, girdi ve çıktıyı birlikte sınırlar ve bu sınırı aşarsan hata alırsın. Max output tokens ise yalnızca yanıtı sınırlar."
    fa:
      question: "context window یه LLM چیه؟"
      options:
        - "سقف متنی که مدل می‌تونه یک‌جا پردازش کنه، ورودی و خروجی روی هم."
        - "فقط سقف طول جواب، که با یه hyperparameter تنظیمش می‌کنی."
        - "تعداد parameter‌های مدل، که اندازه‌ی مدل رو معلوم می‌کنه."
        - "فهرست tool‌هایی که SystemMessage به مدل اجازه می‌ده صداشون بزنه."
      explain: "context window ورودی و خروجی رو با هم محدود می‌کنه و اگه ازش رد بشی خطا می‌گیری. Max output tokens فقط طول جواب رو محدود می‌کنه."
  - answer: 3
    en:
      question: "In an agent, who writes the ToolCall, and who writes the ToolResult?"
      options:
        - "The host machine writes the ToolCall, and the LLM writes the ToolResult."
        - "The LLM writes the ToolCall, and the LLM also writes the ToolResult."
        - "The host machine writes the ToolCall, and it also writes the ToolResult."
        - "The LLM writes the ToolCall, and the host machine writes the ToolResult."
      explain: "The LLM asks for a tool with a ToolCall. The host machine runs the function, so the host machine writes the ToolResult."
    tr:
      question: "Bir agent'ta ToolCall'ı kim üretir, ToolResult'ı kim üretir?"
      options:
        - "ToolCall'ı host makine üretir, ToolResult'ı LLM üretir."
        - "ToolCall'ı LLM üretir, ToolResult'ı da yine LLM üretir."
        - "ToolCall'ı host makine üretir, ToolResult'ı da yine host makine üretir."
        - "ToolCall'ı LLM üretir, ToolResult'ı host makine üretir."
      explain: "LLM, bir ToolCall ile bir tool'u çalıştırmak istediğini belirtir. Fonksiyonu host makine çalıştırır, bu yüzden ToolResult'ı host makine üretir."
    fa:
      question: "توی یه agent، ToolCall رو کی می‌نویسه و ToolResult رو کی؟"
      options:
        - "ToolCall رو host machine می‌نویسه و ToolResult رو LLM."
        - "ToolCall رو LLM می‌نویسه، ToolResult رو هم خود LLM."
        - "ToolCall رو host machine می‌نویسه، ToolResult رو هم خود host machine."
        - "ToolCall رو LLM می‌نویسه و ToolResult رو host machine."
      explain: "LLM با یه ToolCall درخواست می‌کنه که یه tool اجرا بشه. function رو host machine اجرا می‌کنه، پس ToolResult رو هم همون می‌نویسه."
  - answer: 1
    en:
      question: "You want predictable and consistent answers from the model. What do you do?"
      options:
        - "Use a model with more parameters."
        - "Set the temperature low, for example 0.1."
        - "Set the temperature high, for example 0.9."
        - "Set a higher value for max output tokens."
      explain: "A low temperature such as 0.1 gives predictable, consistent answers. A high temperature such as 0.9 gives more creative but less reliable answers."
    tr:
      question: "Modelden öngörülebilir ve tutarlı yanıtlar istiyorsun. Ne yaparsın?"
      options:
        - "Daha fazla parametreye sahip bir model kullanırsın."
        - "Temperature'ı düşük bir değere, örneğin 0.1'e ayarlarsın."
        - "Temperature'ı yüksek bir değere, örneğin 0.9'a ayarlarsın."
        - "Max output tokens değerini daha yükseğe ayarlarsın."
      explain: "0.1 gibi düşük bir temperature öngörülebilir ve tutarlı yanıtlar verir. 0.9 gibi yüksek bir temperature ise daha yaratıcı, ama daha az güvenilir yanıtlar verir."
    fa:
      question: "می‌خوای جواب‌های مدل قابل‌پیش‌بینی و یکدست باشه. چی کار می‌کنی؟"
      options:
        - "سراغ یه مدل با parameter‌های بیشتر می‌ری."
        - "temperature رو پایین می‌ذاری، مثلاً 0.1."
        - "temperature رو بالا می‌ذاری، مثلاً 0.9."
        - "max output tokens رو بیشتر می‌کنی."
      explain: "temperature پایین، مثلاً 0.1، جواب‌های قابل‌پیش‌بینی و یکدست می‌ده. temperature بالا، مثلاً 0.9، جواب‌ها رو خلاقانه‌تر می‌کنه، ولی کمتر می‌شه بهشون تکیه کرد."
  - answer: 2
    en:
      question: "Compared with cloud inference, what is the main limit of local inference?"
      options:
        - "You need an internet connection to use it."
        - "You pay money for every request you send."
        - "You can only run the smaller models."
        - "You must quantize every model yourself."
      explain: "Local inference is free after setup and works offline, but it limits you to the smaller models. Cost and the need for internet are limits of cloud inference."
    tr:
      question: "Cloud inference'a kıyasla, local inference'ın ana kısıtı nedir?"
      options:
        - "Kullanmak için internet bağlantısı gerekir."
        - "Gönderdiğin her istek için para ödersin."
        - "Yalnızca küçük modelleri çalıştırabilirsin."
        - "Her modeli kendin quantize etmen gerekir."
      explain: "Local inference, kurulumdan sonra ücretsizdir ve internetsiz çalışır. Ama seni yalnızca küçük modellerle sınırlar. Maliyet ve internet ihtiyacı ise cloud inference'ın eksileridir."
    fa:
      question: "local inference در مقایسه با cloud inference، بزرگ‌ترین محدودیتش چیه؟"
      options:
        - "برای استفاده ازش اینترنت لازم داری."
        - "بابت هر درخواستی که می‌فرستی پول می‌دی."
        - "فقط مدل‌های کوچیک‌تر رو می‌تونی اجرا کنی."
        - "باید همه‌ی مدل‌ها رو خودت quantize کنی."
      explain: "local inference بعد از راه‌اندازی رایگانه و آفلاین هم کار می‌کنه، ولی دستت فقط به مدل‌های کوچیک‌تر می‌رسه. هزینه و نیاز به اینترنت، محدودیت‌های cloud inference‌ان."
