# Quick quiz: Memory. Reinforcement, not assessment.
questions:
  - answer: 2
    en:
      question: "What is working memory?"
      options:
        - "Knowledge that training stores in the model's weights"
        - "A summary of past sessions in an external database"
        - "The text that is inside the context window right now"
        - "A record of the chat that the model keeps by itself"
      explain: "Working memory is the text in the context window at this moment. The model does not keep it by itself, so it is gone when a new session starts."
    tr:
      question: "Çalışma belleği (working memory) nedir?"
      options:
        - "Eğitimin modelin ağırlıklarına kaydettiği bilgi"
        - "Harici bir veritabanında tutulan geçmiş oturumların bir özeti"
        - "Şu anda context window'un içinde bulunan metin"
        - "Modelin kendi kendine tuttuğu bir konuşma kaydı"
      explain: "Çalışma belleği, tam bu anda context window'un içindeki metindir. Model bu metni kendi başına tutmaz; bu yüzden yeni bir oturum başladığında metin kaybolur."
    fa:
      question: "working memory چیه؟"
      options:
        - "دانشی که training داخل weight‌های مدل ذخیره می‌کنه"
        - "یه خلاصه از session‌های قبلی توی یه database بیرونی"
        - "متنی که همین الان داخل context window هست"
        - "یه سابقه‌ی گفتگو که مدل خودش برای خودش نگه می‌داره"
      explain: "working memory همون متنیه که همین لحظه داخل context window هست. مدل خودش این متن رو نگه نمی‌داره، برای همین با شروع یه session جدید از بین می‌ره."
  - answer: 1
    en:
      question: "Parametric memory is permanent. Why is it still imprecise?"
      options:
        - "The model deletes it when the session ends"
        - "Your document is mixed with billions of others in the weights"
        - "The context window is too small to hold all of it"
        - "It is stored in a database outside the model"
      explain: "The weights hold information from billions of documents, so the model cannot recall one document exactly. Parametric memory does not disappear when a session ends."
    tr:
      question: "Parametrik bellek kalıcıdır. Peki neden yine de kesin değildir?"
      options:
        - "Model onu oturum bittiğinde siler"
        - "Senin dokümanın, ağırlıklardaki milyarlarca başka dokümanla karışır"
        - "Context window, hepsini tutmak için çok küçüktür"
        - "Modelin dışındaki bir veritabanında saklanır"
      explain: "Ağırlıklar milyarlarca dokümanın bilgisini tutar, bu yüzden model tek bir dokümanı tam olarak hatırlayamaz. Parametrik bellek ise oturum bittiğinde kaybolmaz."
    fa:
      question: "parametric memory دائمیه. با این حال چرا بازم نادقیقه؟"
      options:
        - "مدل وقتی session تموم می‌شه اون رو پاک می‌کنه"
        - "سند تو با میلیاردها سند دیگه توی weight‌ها قاطی شده"
        - "context window اونقدر کوچیکه که نمی‌تونه همه‌ی اون رو نگه داره"
        - "توی یه database بیرون از مدل ذخیره می‌شه"
      explain: "weight‌ها اطلاعات میلیاردها سند رو با هم نگه می‌دارن، برای همین مدل نمی‌تونه یه سند رو دقیق به یاد بیاره. parametric memory وقتی session تموم می‌شه از بین نمی‌ره."
  - answer: 3
    en:
      question: "An LLM is stateless during generation. How does a chat still feel like one continuous conversation?"
      options:
        - "The model saves each new message in its weights"
        - "The model remembers the previous call by itself"
        - "The app sends only the newest message to the model"
        - "The app sends the whole message stack on every call"
      explain: "The app keeps a growing stack of all messages and sends the whole stack on every call. The model remembers nothing from the previous call, so the newest message alone is not enough."
    tr:
      question: "Bir LLM generation sırasında stateless'tır. Peki bir sohbet nasıl yine de kesintisiz bir konuşma gibi görünür?"
      options:
        - "Model her yeni mesajı ağırlıklarına kaydeder"
        - "Model önceki çağrıyı kendi başına hatırlar"
        - "Uygulama modele yalnızca en yeni mesajı gönderir"
        - "Uygulama her çağrıda mesaj yığınının (stack) tamamını gönderir"
      explain: "Uygulama, bütün mesajların büyüyen bir yığınını (stack) tutar ve her çağrıda yığının tamamını gönderir. Model önceki çağrıdan hiçbir şey hatırlamaz, bu yüzden yalnızca en yeni mesaj yeterli değildir."
    fa:
      question: "LLM موقع generation stateless هست. پس چطور یه چت باز هم حس یه گفتگوی پیوسته رو می‌ده؟"
      options:
        - "مدل هر پیام تازه رو توی weight‌هاش ذخیره می‌کنه"
        - "مدل خودش call قبلی رو به یاد می‌آره"
        - "اپ فقط جدیدترین پیام رو برای مدل می‌فرسته"
        - "اپ توی هر call کل stack پیام‌ها رو می‌فرسته"
      explain: "اپ یه stack در حال رشد از همه‌ی پیام‌ها نگه می‌داره و توی هر call کل stack رو می‌فرسته. مدل از call قبلی چیزی به یاد نداره، برای همین فقط جدیدترین پیام کافی نیست."
  - answer: 0
    en:
      question: "You upload 5 PDFs to ChatGPT. Later, in a new session, it answers a question about them. How can it do this?"
      options:
        - "ChatGPT indexed the PDFs and retrieves the relevant parts into context"
        - "The upload stored the PDFs permanently in the model's weights"
        - "The PDFs are still in the new session's context window"
        - "The LLM keeps the earlier session in its own state"
      explain: "This is long-term memory: the PDFs were indexed outside the model and retrieved back into context, often with RAG. A new session starts with an empty context window, so working memory cannot explain it."
    tr:
      question: "ChatGPT'ye 5 PDF yüklüyorsun. Daha sonra yeni bir oturumda, ChatGPT bu PDF'ler hakkındaki bir soruyu cevaplıyor. Bunu nasıl yapabiliyor?"
      options:
        - "ChatGPT PDF'leri index'ledi ve ilgili parçaları context'e geri getiriyor"
        - "Yükleme, PDF'leri modelin ağırlıklarına kalıcı olarak kaydetti"
        - "PDF'ler hâlâ yeni oturumun context window'unun içinde duruyor"
        - "LLM önceki oturumu kendi state'inde tutuyor"
      explain: "Bu long-term memory'dir: PDF'ler modelin dışında index'lendi ve context'e geri getirildi, çoğu zaman RAG ile. Yeni oturum boş bir context window ile başlar, bu yüzden working memory bunu açıklayamaz."
    fa:
      question: "تو 5 تا PDF رو توی ChatGPT آپلود می‌کنی. بعداً، توی یه session جدید، ChatGPT به یه سؤال درباره‌شون جواب می‌ده. این کار رو چطوری انجام می‌ده؟"
      options:
        - "ChatGPT اون PDF‌ها رو index کرده و بخش‌های مرتبط رو دوباره به context برمی‌گردونه"
        - "آپلود، PDF‌ها رو برای همیشه توی weight‌های مدل ذخیره کرد"
        - "PDF‌ها هنوز توی context window این session جدید هستن"
        - "LLM وضعیت session قبلی رو توی state خودش نگه می‌داره"
      explain: "این long-term memory هست: PDF‌ها بیرون از مدل index شدن و معمولاً با RAG دوباره به context برگشتن. یه session جدید با context window خالی شروع می‌شه، پس working memory نمی‌تونه توضیحش بده."
