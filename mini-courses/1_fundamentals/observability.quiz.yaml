# Quick quiz: Observability. Reinforcement, not assessment.
questions:
  - answer: 1
    en:
      question: "In ordinary software, the code tells you what the system does. Why is this not true for an agent?"
      options:
        - "The model rewrites the agent code on each run, so the code never stays the same."
        - "The code describes only the loop. What happened on a given run exists only in the trace."
        - "The final output lists every step, so you read the output instead of the code."
        - "The prompt holds all the logic, so you read the prompt instead of the code."
      explain: "The code only describes the loop: call the model, run the tool, repeat. The trace records every model call, tool call and subagent of one request."
    tr:
      question: "Sıradan yazılımda kod, sistemin ne yaptığını söyler. Bu durum agent'lar için neden geçerli değil?"
      options:
        - "Model her çalıştırmada agent kodunu yeniden yazar, bu yüzden kod hiçbir zaman sabit kalmaz."
        - "Kod yalnızca döngüyü (loop) tarif eder. Belirli bir çalıştırmada ne olduğu yalnızca trace'te bulunur."
        - "Son çıktı (final output) her adımı listeler, bu yüzden kod yerine çıktıyı okursun."
        - "Bütün mantık prompt'ta durur, bu yüzden kod yerine prompt'u okursun."
      explain: "Kod yalnızca döngüyü tarif eder: modeli çağır, tool'u çalıştır, tekrarla. Trace ise tek bir isteğin her model çağrısını, tool çağrısını ve subagent'ını kaydeder."
    fa:
      question: "توی نرم‌افزار معمولی، کد بهت می‌گه سیستم چیکار می‌کنه. چرا این حرف برای یه agent درست نیست؟"
      options:
        - "مدل توی هر اجرا کد agent رو بازنویسی می‌کنه، پس کد هیچ‌وقت ثابت نمی‌مونه."
        - "کد فقط loop رو توصیف می‌کنه. اون چیزی که توی یه اجرای مشخص اتفاق افتاده، فقط توی trace هست."
        - "خروجی نهایی همه‌ی مراحل رو فهرست می‌کنه، پس به جای کد، خروجی رو می‌خونی."
        - "کل منطق توی prompt هست، پس به جای کد، prompt رو می‌خونی."
      explain: "کد فقط loop رو توصیف می‌کنه: مدل رو صدا می‌زنه، tool رو اجرا می‌کنه و دوباره تکرار می‌کنه. trace هر model call، هر tool call و هر subagent یک درخواست رو ثبت می‌کنه."
  - answer: 3
    en:
      question: "Your agent gives a confident answer that is wrong. Where do you usually find the cause?"
      options:
        - "In the final output, because the agent explains its mistakes in the answer."
        - "Inside one model call, because one step usually holds the whole failure."
        - "In the agent code, because the code shows which tools the agent chose."
        - "In the trace, because failures usually happen in the gaps between steps."
      explain: "Failures like a slightly wrong tool argument happen in the gaps between steps. The final output hides them, but the trace shows them."
    tr:
      question: "Agent kendinden emin ama yanlış bir cevap veriyor. Sebebini genellikle nerede bulursun?"
      options:
        - "Son çıktıda (final output), çünkü agent hatalarını cevabın içinde açıklar."
        - "Tek bir model çağrısının içinde, çünkü genellikle tek bir adım bütün hatayı taşır."
        - "Agent kodunda, çünkü kod agent'ın hangi tool'ları seçtiğini gösterir."
        - "Trace'te, çünkü hatalar genellikle adımlar arasındaki boşluklarda olur."
      explain: "Biraz yanlış bir tool argümanı gibi hatalar adımlar arasındaki boşluklarda oluşur. Son çıktı (final output) bu hataları saklar, trace ise gösterir."
    fa:
      question: "agent تو یه جواب مطمئن ولی اشتباه می‌ده. معمولاً علتش رو کجا پیدا می‌کنی؟"
      options:
        - "توی خروجی نهایی، چون agent اشتباهاتش رو توی جوابش توضیح می‌ده."
        - "داخل یه model call، چون معمولاً یه مرحله کل خطا رو توی خودش داره."
        - "توی کد agent، چون کد نشون می‌ده agent کدوم tool‌ها رو انتخاب کرده."
        - "توی trace، چون خطاها معمولاً توی فاصله‌ی بین مراحل اتفاق می‌افتن."
      explain: "خطاهایی مثل یه آرگومان کمی غلط توی tool، توی فاصله‌ی بین مراحل رخ می‌دن. خروجی نهایی اون‌ها رو پنهون می‌کنه، ولی trace نشونشون می‌ده."
  - answer: 0
    en:
      question: "What should you check before you choose a platform for your traces?"
      options:
        - "Whether it collects from what you already run, and keeps traces where your data policy says."
        - "Whether it offers more features than the other platforms, such as evals and datasets."
        - "Whether it is the most popular platform among the teams that build agents."
        - "Whether it stores only the final output of each run, so it uses less storage."
      explain: "The module says the feature list is not the main check. Prompts and tool results hold customer text, so your data policy decides where you keep the traces."
    tr:
      question: "Trace'ler için bir platform seçmeden önce neyi kontrol etmelisin?"
      options:
        - "Zaten çalıştırdığın sistemlerden trace toplayıp toplayamadığını ve trace'leri veri politikanın istediği yerde tutup tutamadığını."
        - "Eval'ler ve dataset'ler gibi özellikleri (feature) diğer platformlardan daha fazla sunup sunmadığını."
        - "Agent geliştiren ekipler arasında en popüler platform olup olmadığını."
        - "Daha az yer kaplasın diye her çalıştırmanın yalnızca son çıktısını tutup tutmadığını."
      explain: "Modüle göre ana kontrol özellik listesi değildir. Prompt'lar ve tool sonuçları müşteri metni taşır, bu yüzden trace'leri nerede tutacağına veri politikan karar verir."
    fa:
      question: "قبل از اینکه یه پلتفرم برای trace‌هات انتخاب کنی، چی رو باید چک کنی؟"
      options:
        - "اینکه آیا از چیزهایی که از قبل اجرا می‌کنی trace جمع می‌کنه، و trace‌ها رو همون‌جایی نگه می‌داره که data policy‌ت می‌گه."
        - "اینکه آیا feature‌های بیشتری نسبت به پلتفرم‌های دیگه داره، مثل eval‌ها و dataset‌ها."
        - "اینکه آیا بین تیم‌هایی که agent می‌سازن محبوب‌ترین پلتفرمه."
        - "اینکه آیا فقط خروجی نهایی هر اجرا رو ذخیره می‌کنه تا فضای کمتری مصرف کنه."
      explain: "این درس می‌گه لیست feature‌ها اصلی‌ترین بررسی نیست. prompt‌ها و نتیجه‌ی tool‌ها پر از متن مشتری‌ان، پس data policy‌ت مشخص می‌کنه trace‌ها کجا نگه داشته بشن."
  - answer: 2
    en:
      question: "In the improvement loop, what connects each stage to the next stage?"
      options:
        - "The final output, because the evaluators score only the answer of each run."
        - "The agent code, because each pass writes its change into the code."
        - "The trace, because evaluators, annotations and the offline dataset all use it."
        - "The analytics dashboard, because it counts the failure rate of each check."
      explain: "Evaluators score traces, annotations attach to traces, and the offline dataset is made of traces. Without the trace, the steps cannot reach each other."
    tr:
      question: "İyileştirme döngüsünde (improvement loop) her aşamayı bir sonrakine ne bağlar?"
      options:
        - "Son çıktı (final output), çünkü evaluator'lar her çalıştırmanın yalnızca cevabını puanlar."
        - "Agent kodu, çünkü her tur kendi değişikliğini koda yazar."
        - "Trace, çünkü evaluator'lar, annotation'lar ve offline dataset hepsi onu kullanır."
        - "Analitik paneli (analytics dashboard), çünkü her kontrolün hata oranını sayar."
      explain: "Evaluator'lar trace'leri puanlar, annotation'lar trace'lere eklenir ve offline dataset trace'lerden oluşur. Trace olmadan bu adımlar birbirine ulaşamaz."
    fa:
      question: "توی حلقه‌ی بهبود (improvement loop)، چی هر مرحله رو به مرحله‌ی بعدی وصل می‌کنه؟"
      options:
        - "خروجی نهایی، چون evaluator‌ها فقط جواب هر اجرا رو نمره می‌دن."
        - "کد agent، چون هر دور تغییرش رو توی کد می‌نویسه."
        - "trace، چون evaluator‌ها، annotation‌ها و dataset آفلاین همه ازش استفاده می‌کنن."
        - "داشبورد analytics، چون نرخ خطای هر کنترل رو می‌شماره."
      explain: "evaluator‌ها trace‌ها رو نمره می‌دن، annotation‌ها به trace‌ها وصل می‌شن و dataset آفلاین از trace‌ها ساخته می‌شه. بدون trace، این مرحله‌ها به هم نمی‌رسن."
  - answer: 1
    en:
      question: "A team records over 100,000 traces a day, and nobody reads them. What does the module name as the newest answer?"
      options:
        - "More online evaluators, one for each failure mode the team can think of."
        - "An agent that clusters the traces and finds failure modes nobody asked about."
        - "Product analytics that report the failure rate of each check the team wrote."
        - "Fewer traces each day, so that a person can read every one of them."
      explain: "Analytics and evaluators answer only the questions you already thought of. An agent such as LangSmith's Insights Agent clusters traces and finds failure modes nobody specified."
    tr:
      question: "Bir ekip günde 100,000'den fazla trace kaydediyor ve kimse bunları okumuyor. Modül en yeni cevap olarak neyi öneriyor?"
      options:
        - "Daha fazla online evaluator, ekibin aklına gelen her hata türü (failure mode) için bir tane."
        - "Trace'leri kümeleyen ve kimsenin sormadığı hata türlerini (failure mode) bulan bir agent."
        - "Ekibin yazdığı her kontrolün hata oranını raporlayan ürün analitiği (product analytics)."
        - "Günde daha az trace olsun, böylece bir insan hepsini okuyabilsin."
      explain: "Analitik ve evaluator'lar yalnızca zaten düşündüğün soruları yanıtlar. LangSmith'in Insights Agent'ı gibi bir agent trace'leri kümeler ve kimsenin belirtmediği hata türlerini bulur."
    fa:
      question: "یه تیم هر روز بیش از 100,000 trace ثبت می‌کنه و هیچ‌کس اون‌ها رو نمی‌خونه. این درس، جدیدترین جواب رو چی معرفی می‌کنه؟"
      options:
        - "evaluator‌های آنلاین بیشتر، یکی برای هر failure mode که تیم بتونه بهش فکر کنه."
        - "یه agent که trace‌ها رو خوشه‌بندی می‌کنه و failure mode‌هایی رو پیدا می‌کنه که کسی درباره‌شون نپرسیده بود."
        - "product analytics که نرخ خطای هر کنترلی رو که تیم نوشته گزارش می‌کنه."
        - "trace‌های کمتری توی هر روز، تا یه آدم بتونه همه‌شون رو بخونه."
      explain: "analytics و evaluator‌ها فقط به سوال‌هایی جواب می‌دن که قبلاً به ذهنت رسیده. یه agent مثل Insights Agent توی LangSmith، trace‌ها رو خوشه‌بندی می‌کنه و failure mode‌هایی رو پیدا می‌کنه که کسی مشخص نکرده بود."
