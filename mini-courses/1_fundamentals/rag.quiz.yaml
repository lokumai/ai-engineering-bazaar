# Quick quiz: RAG & Embeddings. Reinforcement, not assessment.
questions:
  - answer: 1
    en:
      question: "What is the main idea of Retrieval-Augmented Generation (RAG)?"
      options:
        - "Put all of your data into the context window for every question."
        - "Keep the data outside the model and fetch only the relevant parts per question."
        - "Train the model on your data so that it remembers the facts."
        - "Make the context window larger so that all of your data fits in it."
      explain: "RAG keeps the data outside the model and puts only the relevant parts in the context for each question. Putting all the data in the context does not work, because the context window is a hard limit."
    tr:
      question: "Retrieval-Augmented Generation (RAG) fikrinin özü nedir?"
      options:
        - "Her soruda bütün verini context window'a koymak."
        - "Veriyi modelin dışında tutup her soru için yalnızca ilgili parçaları getirmek."
        - "Modeli kendi verinle train etmek, böylece model gerçekleri hatırlasın."
        - "Context window'u büyütmek, böylece bütün verin ona sığsın."
      explain: "RAG veriyi modelin dışında tutar ve her soru için yalnızca ilgili parçaları context'e koyar. Bütün veriyi context'e koymak işe yaramaz, çünkü context window kesin bir sınırdır."
    fa:
      question: "ایده‌ی اصلی Retrieval-Augmented Generation (RAG) چیه؟"
      options:
        - "همه‌ی داده‌هاتو برای هر سؤال توی context window بذار."
        - "داده رو بیرون از مدل نگه دار و برای هر سؤال فقط بخش‌های مرتبط رو بیار."
        - "مدل رو روی داده‌هات train کن تا حقایق رو یادش بمونه."
        - "context window رو بزرگ‌تر کن تا همه‌ی داده‌هات توش جا بشه."
      explain: "RAG داده رو بیرون از مدل نگه می‌داره و برای هر سؤال فقط بخش‌های مرتبط رو توی context می‌ذاره. گذاشتن همه‌ی داده توی context جواب نمی‌ده، چون context window یه سقف سخته."

  - answer: 2
    en:
      question: "A contract clause has the same meaning as the question, but almost no words in common. Why does retrieval with embeddings still find it?"
      options:
        - "The search counts the words that the two texts have in common."
        - "The LLM reads every clause in the database and picks the best one."
        - "Similar meaning gives similar numbers, so the two vectors are close."
        - "Cosine similarity gives a high score to texts of the same length."
      explain: "Embeddings catch meaning, not matching words, so texts with the same meaning get close vectors. Keyword search counts shared words, so it misses this clause."
    tr:
      question: "Bir sözleşme maddesi soruyla aynı anlama geliyor, ama neredeyse hiç ortak kelimesi yok. Embedding'lerle çalışan retrieval onu yine de neden buluyor?"
      options:
        - "Arama, iki metindeki ortak kelimeleri sayıyor."
        - "LLM, database'deki her maddeyi okuyup en iyisini seçiyor."
        - "Benzer anlam benzer sayılar üretir, bu yüzden iki vector birbirine yakın olur."
        - "Cosine similarity, aynı uzunluktaki metinlere yüksek skor veriyor."
      explain: "Embedding'ler eşleşen kelimeleri değil anlamı yakalar, bu yüzden aynı anlamdaki metinlerin vector'leri birbirine yakın olur. Keyword arama ise ortak kelimeleri sayar, bu yüzden bu maddeyi kaçırır."
    fa:
      question: "یه بند قرارداد همون معنای سؤال رو داره، ولی تقریباً هیچ کلمه‌ی مشترکی باهاش نداره. با این حال، retrieval با embedding‌ها چرا اون رو پیدا می‌کنه؟"
      options:
        - "جستجو تعداد کلمه‌های مشترک دو متن رو می‌شمره."
        - "LLM همه‌ی بندهای توی database رو می‌خونه و بهترینش رو انتخاب می‌کنه."
        - "معنای مشابه، عددهای مشابه می‌ده، پس دو تا vector به هم نزدیکن."
        - "Cosine similarity به متن‌هایی با طول یکسان امتیاز بالا می‌ده."
      explain: "embedding‌ها معنا رو می‌گیرن، نه کلمه‌های یکسان، برای همین متن‌هایی با معنای یکسان vector‌های نزدیک دارن. جستجوی keyword کلمه‌های مشترک رو می‌شمره، پس این بند رو از دست می‌ده."

  - answer: 3
    en:
      question: "RAG has a setup part and an answering part. In the answering part, what happens after the question becomes an embedding?"
      options:
        - "RAG breaks the source data into chunks and stores them in the database."
        - "RAG fine-tunes the model on the closest chunks, then asks the question."
        - "RAG sends the closest vectors to the LLM, which answers from the numbers."
        - "RAG finds the closest chunks and puts their real text in the context."
      explain: "RAG searches the database for the closest chunks and puts their real text in the context. Breaking the data into chunks is setup, which happens once and again when the data changes."
    tr:
      question: "RAG'in bir kurulum (setup) kısmı ve bir cevaplama kısmı var. Cevaplama kısmında soru bir embedding'e dönüştükten sonra ne olur?"
      options:
        - "RAG, kaynak veriyi chunk'lara bölüp database'de saklar."
        - "RAG, modeli en yakın chunk'larla fine-tune eder ve sonra soruyu modele sorar."
        - "RAG en yakın vector'leri LLM'e gönderir, LLM de sayılara bakarak cevap verir."
        - "RAG en yakın chunk'ları bulur ve onların gerçek metnini context'e koyar."
      explain: "RAG, database'de en yakın chunk'ları arar ve onların gerçek metnini context'e koyar. Veriyi chunk'lara bölmek ise kurulumun parçasıdır: bir kez yapılır, veri değiştikçe yeniden yapılır."
    fa:
      question: "RAG یه بخش راه‌اندازی (setup) و یه بخش جواب دادن داره. توی بخش جواب دادن، بعد از اینکه سؤال تبدیل شد به embedding، چی می‌شه؟"
      options:
        - "RAG داده‌ی منبع رو به chunk تقسیم می‌کنه و توی database ذخیره‌شون می‌کنه."
        - "RAG مدل رو روی نزدیک‌ترین chunk‌ها fine-tune می‌کنه و بعد سؤال رو می‌پرسه."
        - "RAG نزدیک‌ترین vector‌ها رو به LLM می‌فرسته و LLM از روی عددها جواب می‌ده."
        - "RAG نزدیک‌ترین chunk‌ها رو پیدا می‌کنه و متن واقعی‌شون رو توی context می‌ذاره."
      explain: "RAG توی database دنبال نزدیک‌ترین chunk‌ها می‌گرده و متن واقعی‌شون رو توی context می‌ذاره. تقسیم داده به chunk‌ها بخشی از راه‌اندازیه: یه بار انجام می‌شه، و هر وقت داده عوض شه دوباره انجام می‌شه."

  - answer: 0
    en:
      question: "Your company's documents change every day. Why is RAG better than fine-tuning for these facts?"
      options:
        - "Fine-tuning is slow and costly, so you cannot repeat it after every change."
        - "Fine-tuning makes the context window smaller, so fewer documents fit in it."
        - "Fine-tuning is good at teaching facts but bad at teaching a format."
        - "RAG updates the model's weights faster than fine-tuning can update them."
      explain: "Fine-tuning takes hours or days and costs money, so you cannot repeat it each time a file changes. RAG changes what the model sees, not what it knows."
    tr:
      question: "Şirketinin belgeleri her gün değişiyor. Bu tür bilgiler için RAG neden fine-tuning'den daha iyi bir seçenek?"
      options:
        - "Fine-tuning yavaş ve pahalıdır, bu yüzden her değişiklikten sonra tekrarlayamazsın."
        - "Fine-tuning context window'u küçültür, bu yüzden daha az doküman sığar."
        - "Fine-tuning gerçekleri öğretmekte iyidir, ama bir formatı öğretmekte kötüdür."
        - "RAG, modelin weight'lerini fine-tuning'den daha hızlı günceller."
      explain: "Fine-tuning saatler ya da günler sürer ve para tutar, bu yüzden her dosya değiştiğinde onu tekrarlayamazsın. RAG modelin bildiğini değil, gördüğünü değiştirir."
    fa:
      question: "اسناد شرکتت هر روز عوض می‌شن. چرا برای این اطلاعات RAG از fine-tuning بهتره؟"
      options:
        - "Fine-tuning کنده و پرهزینه‌ست، پس نمی‌تونی بعد از هر تغییر دوباره‌ش انجام بدی."
        - "Fine-tuning، context window رو کوچیک‌تر می‌کنه، پس سند کمتری توش جا می‌شه."
        - "Fine-tuning توی یاد دادن حقایق خوبه، ولی توی یاد دادن یه فرمت بده."
        - "RAG، weights مدل رو سریع‌تر از fine-tuning به‌روز می‌کنه."
      explain: "Fine-tuning ساعت‌ها یا روزها طول می‌کشه و هزینه داره، پس نمی‌تونی هر بار که یه فایل عوض می‌شه دوباره‌ش کنی. RAG چیزی رو عوض می‌کنه که مدل می‌بینه، نه چیزی که می‌دونه."
