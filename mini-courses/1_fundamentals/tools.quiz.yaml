# Quick quiz: Tool Calling. Reinforcement, not assessment.
questions:
  - answer: 2
    en:
      question: "A model decides to call the tool `read_file`. Who runs the function?"
      options:
        - "The model runs the function inside its own weights."
        - "The framework sends the function to the model, and the model runs it."
        - "The host machine runs the function and writes the Tool Result."
        - "The user runs the function and types the result into the chat."
      explain: "The model has no computer, so it only writes a Tool Call that asks for the function. The host machine, your laptop or your server, runs it and writes the Tool Result."
    tr:
      question: "Model `read_file` tool'unu çağırmaya karar veriyor. Fonksiyonu kim çalıştırıyor?"
      options:
        - "Model, fonksiyonu kendi weight'lerinin içinde çalıştırıyor."
        - "Framework fonksiyonu modele gönderiyor ve model onu çalıştırıyor."
        - "Host makine fonksiyonu çalıştırıyor ve Tool Result'ı yazıyor."
        - "Kullanıcı fonksiyonu çalıştırıyor ve sonucu chat'e yazıyor."
      explain: "Modelin bilgisayarı yok, bu yüzden model yalnızca fonksiyonu isteyen bir Tool Call yazıyor. Fonksiyonu host makine (senin laptop'un ya da sunucun) çalıştırıyor ve Tool Result'ı yazıyor."
    fa:
      question: "مدل تصمیم می‌گیرد tool به نام `read_file` را صدا بزند. چه کسی تابع را اجرا می‌کند؟"
      options:
        - "مدل، تابع را داخل model weights خودش اجرا می‌کند."
        - "Framework تابع را به مدل می‌فرستد و مدل آن را اجرا می‌کند."
        - "Host machine تابع را اجرا می‌کند و Tool Result را می‌نویسد."
        - "کاربر تابع را اجرا می‌کند و نتیجه را در chat تایپ می‌کند."
      explain: "مدل کامپیوتر ندارد، پس فقط یک Tool Call می‌نویسد که تابع را درخواست کند. Host machine، یعنی لپ‌تاپ یا سرور شما، آن را اجرا می‌کند و Tool Result را می‌نویسد."
  - answer: 0
    en:
      question: "Why does an agent's context grow faster than a chat's context?"
      options:
        - "Each Tool Call and each Tool Result stay in the context."
        - "Each tool call adds a new system prompt to the context."
        - "The model must write a longer answer after each tool call."
        - "The user must ask the question again after each tool call."
      explain: "A tool call adds two new messages: the Tool Call and the Tool Result. Both stay in the context, so one turn can add several messages instead of two."
    tr:
      question: "Bir agent'ın context'i neden bir chat'in context'inden daha hızlı büyüyor?"
      options:
        - "Her Tool Call ve her Tool Result context'te kalıyor."
        - "Her tool call context'e yeni bir system prompt ekliyor."
        - "Model her tool call'dan sonra daha uzun bir cevap yazmak zorunda."
        - "Kullanıcı her tool call'dan sonra soruyu tekrar sormak zorunda."
      explain: "Bir tool call iki yeni mesaj ekliyor: Tool Call ve Tool Result. İkisi de context'te kalıyor, bu yüzden tek bir tur iki mesaj yerine birkaç mesaj ekleyebiliyor."
    fa:
      question: "چرا context یک agent سریع‌تر از context یک chat بزرگ می‌شود؟"
      options:
        - "هر Tool Call و هر Tool Result در context می‌مانند."
        - "هر tool call یک system prompt تازه به context اضافه می‌کند."
        - "مدل باید بعد از هر tool call جواب طولانی‌تری بنویسد."
        - "کاربر باید بعد از هر tool call سوال را دوباره بپرسد."
      explain: "یک tool call دو پیام تازه اضافه می‌کند: Tool Call و Tool Result. هر دو در context می‌مانند، پس یک نوبت می‌تواند به جای دو پیام، چند پیام اضافه کند."
  - answer: 3
    en:
      question: "You write a function with the `@tool` decorator. Where does the framework get the tool's description?"
      options:
        - "From the function name, `get_weather`."
        - "From the type hints, for example `city: str`."
        - "From a JSON file that you write by hand."
        - "From the docstring of the function."
      explain: "The framework generates the tool schema for you, and it reads the description from the docstring. The name comes from the function name, and the parameters come from the type hints."
    tr:
      question: "`@tool` decorator'ı ile bir fonksiyon yazıyorsun. Framework, tool'un description'ını nereden alıyor?"
      options:
        - "Fonksiyonun adından, `get_weather`."
        - "Type hint'lerden, örneğin `city: str`."
        - "Elle yazdığın bir JSON dosyasından."
        - "Fonksiyonun docstring'inden."
      explain: "Tool schema'yı senin yerine framework üretiyor, ve description'ı docstring'den okuyor. Name fonksiyonun adından, parameters ise type hint'lerden geliyor."
    fa:
      question: "شما یک تابع را با decorator `@tool` می‌نویسید. framework، description یک tool را از کجا می‌گیرد؟"
      options:
        - "از نام تابع، `get_weather`."
        - "از type hint‌ها، برای مثال `city: str`."
        - "از یک فایل JSON که شما با دست می‌نویسید."
        - "از docstring تابع."
      explain: "framework، tool schema را به جای شما می‌سازد و description را از docstring می‌خواند. نام از نام تابع می‌آید و parameter‌ها از type hint‌ها."
  - answer: 1
    en:
      question: "Your tool is called `get_data` and its docstring says \"gets data\". The model picks it at the wrong moments. What fixes this?"
      options:
        - "Add more instructions about the tool to the system prompt."
        - "Rename the tool and rewrite its docstring for the model."
        - "Make the code inside the function faster and more correct."
        - "Add longer comments inside the body of the function."
      explain: "The name and the description are the only things the model uses to choose a tool. More prompting does not fix a vague name and docstring."
    tr:
      question: "Tool'unun adı `get_data` ve docstring'i \"gets data\" diyor. Model onu yanlış anlarda seçiyor. Bunu ne düzeltir?"
      options:
        - "System prompt'a tool hakkında daha fazla talimat eklemek."
        - "Tool'un adını değiştirmek ve docstring'ini model için yeniden yazmak."
        - "Fonksiyonun içindeki kodu daha hızlı ve daha doğru yapmak."
        - "Fonksiyonun gövdesine daha uzun yorumlar (comment) eklemek."
      explain: "Model bir tool seçerken yalnızca name ve description'ı kullanıyor. Daha fazla prompt yazmak, belirsiz bir isim ve docstring'i düzeltmez."
    fa:
      question: "tool شما `get_data` نام دارد و docstring آن می‌گوید «gets data». مدل آن را در زمان‌های اشتباه انتخاب می‌کند. چه چیزی این را درست می‌کند؟"
      options:
        - "اضافه کردن دستورالعمل‌های بیشتر درباره‌ی tool به system prompt."
        - "تغییر نام tool و بازنویسی docstring آن برای مدل."
        - "سریع‌تر و درست‌تر کردن کد داخل تابع."
        - "اضافه کردن کامنت‌های طولانی‌تر در بدنه‌ی تابع."
      explain: "مدل برای انتخاب tool فقط از نام و description استفاده می‌کند. prompt بیشتر، یک نام و docstring مبهم را درست نمی‌کند."
  - answer: 2
    en:
      question: "In the Tool Call message, the model writes an `id`, for example `call_9k2m4Xq7`. What is it for?"
      options:
        - "It tells the host machine which Python file to open."
        - "It counts how many tools the model called in this chat."
        - "It matches the Tool Result back to this specific call."
        - "It identifies the user who asked the question."
      explain: "The host machine tags the Tool Result with the same `id`, in the field `tool_call_id`. This links the result to the call that asked for it."
    tr:
      question: "Tool Call mesajında model bir `id` yazıyor, örneğin `call_9k2m4Xq7`. Bu ne işe yarıyor?"
      options:
        - "Host makineye hangi Python dosyasını açacağını söylüyor."
        - "Modelin bu chat'te kaç tool çağırdığını sayıyor."
        - "Tool Result'ı tam olarak bu çağrıyla eşleştiriyor."
        - "Soruyu soran kullanıcıyı tanımlıyor."
      explain: "Host makine, Tool Result'ı aynı `id` ile, `tool_call_id` field'ında etiketliyor. Bu, sonucu onu isteyen çağrıya bağlıyor."
    fa:
      question: "در پیام Tool Call، مدل یک `id` می‌نویسد، برای مثال `call_9k2m4Xq7`. این `id` برای چیست؟"
      options:
        - "به host machine می‌گوید کدام فایل Python را باز کند."
        - "تعداد tool‌هایی را که مدل در این chat صدا زده می‌شمارد."
        - "Tool Result را دقیقاً به همین call وصل می‌کند."
        - "کاربری را که سوال پرسیده شناسایی می‌کند."
      explain: "host machine، Tool Result را با همان `id` در field‌ای به نام `tool_call_id` برچسب می‌زند. این کار نتیجه را به call‌ای که آن را خواسته وصل می‌کند."
