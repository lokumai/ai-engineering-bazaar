# Quick quiz: Training LLMs. Reinforcement, not assessment.
questions:
  - answer: 2
    en:
      question: "What does training change inside a model?"
      options:
        - "It adds rules and facts that you can read."
        - "It changes the size and shape of the network."
        - "It adjusts the numbers inside the parameters."
        - "It saves a copy of every text that it reads."
      explain: "Training only adjusts numbers, and the knowledge is spread across billions of them. The shape of the network does not change."
    tr:
      question: "Training, bir modelin içinde neyi değiştirir?"
      options:
        - "Okuyabileceğin kurallar ve bilgiler ekler."
        - "Ağın boyutunu ve şeklini değiştirir."
        - "Parametrelerin içindeki sayıları ayarlar."
        - "Okuduğu her metnin bir kopyasını saklar."
      explain: "Training yalnızca sayıları ayarlar, bilgi ise milyarlarca sayının arasına yayılır. Ağın şekli değişmez."
    fa:
      question: "training دقیقاً چی رو توی مدل عوض می‌کنه؟"
      options:
        - "یه سری قانون و اطلاعات بهش اضافه می‌کنه که می‌تونی بخونیشون."
        - "اندازه و شکل شبکه رو تغییر می‌ده."
        - "عددهای داخل parameter‌ها رو تنظیم می‌کنه."
        - "از هر متنی که می‌خونه یه کپی برای خودش نگه می‌داره."
      explain: "training فقط عددها رو تنظیم می‌کنه و دانش مدل بین میلیاردها عدد پخش می‌شه. شکل شبکه هم هیچ تغییری نمی‌کنه."
  - answer: 0
    en:
      question: "How is the data for pre-training different from the data for fine-tuning?"
      options:
        - "Pre-training uses unlabelled text, and fine-tuning uses input and output pairs."
        - "Pre-training uses input and output pairs, and fine-tuning uses unlabelled text."
        - "Both steps use unlabelled text, but fine-tuning uses a smaller amount of it."
        - "Both steps use pairs that people wrote, but pre-training uses many more of them."
      explain: "In pre-training, the next word is the answer, so nobody writes labels. Fine-tuning uses thousands of pairs that people wrote or checked."
    tr:
      question: "Pre-training verisi, fine-tuning verisinden nasıl farklıdır?"
      options:
        - "Pre-training etiketsiz metin kullanır, fine-tuning ise girdi ve çıktı çiftleri kullanır."
        - "Pre-training girdi ve çıktı çiftleri kullanır, fine-tuning ise etiketsiz metin kullanır."
        - "İki adım da etiketsiz metin kullanır, ama fine-tuning bunun daha az bir kısmını kullanır."
        - "İki adım da insanların yazdığı çiftleri kullanır, ama pre-training bunlardan çok daha fazlasını kullanır."
      explain: "Pre-training'de bir sonraki kelime zaten cevaptır, bu yüzden kimse etiket yazmaz. Fine-tuning ise insanların yazdığı ya da kontrol ettiği binlerce çifti kullanır."
    fa:
      question: "داده‌ای که pre-training لازم داره، با داده‌ی fine-tuning چه فرقی داره؟"
      options:
        - "pre-training با متن بدون برچسب کار می‌کنه و fine-tuning با جفت‌های ورودی و خروجی."
        - "pre-training با جفت‌های ورودی و خروجی کار می‌کنه و fine-tuning با متن بدون برچسب."
        - "هر دو با متن بدون برچسب کار می‌کنن، فقط fine-tuning مقدار کمتری ازش می‌خواد."
        - "هر دو با جفت‌هایی کار می‌کنن که آدم‌ها نوشتن، فقط pre-training خیلی بیشترش رو می‌خواد."
      explain: "توی pre-training جواب خود کلمه‌ی بعدیه، پس کسی برچسب نمی‌نویسه. ولی fine-tuning با هزاران جفت کار می‌کنه که آدم‌ها نوشتن یا بررسی کردن."
  - answer: 3
    en:
      question: "What does PEFT, for example LoRA, do during fine-tuning?"
      options:
        - "It updates all parameters, but on a smaller dataset."
        - "It compresses the model so that it runs more cheaply."
        - "It starts from random weights, but it uses less data."
        - "It freezes most of the model and trains a few extra parameters."
      explain: "PEFT freezes almost the whole model and trains a small number of new parameters, often under 1%. Quantization is the different idea that makes a model cheaper to run."
    tr:
      question: "PEFT, örneğin LoRA, fine-tuning sırasında ne yapar?"
      options:
        - "Tüm parametreleri günceller, ama daha küçük bir veri seti üzerinde."
        - "Modeli sıkıştırır, böylece daha ucuza çalışır."
        - "Rastgele ağırlıklardan başlar, ama daha az veri kullanır."
        - "Modelin büyük kısmını dondurur ve birkaç ek parametre eğitir."
      explain: "PEFT modelin neredeyse tamamını dondurur ve genellikle toplamın %1'inin altında olan az sayıda yeni parametreyi eğitir. Modeli ucuza çalıştıran ayrı bir fikir ise kuantizasyondur."
    fa:
      question: "PEFT، مثلاً LoRA، موقع fine-tuning چی کار می‌کنه؟"
      options:
        - "همه‌ی parameter‌ها رو به‌روز می‌کنه، فقط روی یه dataset کوچیک‌تر."
        - "مدل رو فشرده می‌کنه تا اجراش ارزون‌تر دربیاد."
        - "از weight‌های تصادفی شروع می‌کنه، ولی داده‌ی کمتری لازم داره."
        - "بیشتر مدل رو freeze می‌کنه و فقط چند تا parameter اضافه رو train می‌کنه."
      explain: "PEFT تقریباً کل مدل رو freeze می‌کنه و فقط تعداد کمی parameter جدید رو train می‌کنه، معمولاً زیر 1%. ارزون اجرا کردن مدل کار quantization‌ه که یه بحث جداست."
  - answer: 1
    en:
      question: "Your company wants a model that knows its codebase and its policies. Both change often. What should you use?"
      options:
        - "Fine-tune the model again each time a file changes."
        - "Use retrieval (RAG), and do not fine-tune for this."
        - "Pre-train a new model on the company's own data."
        - "Use PEFT on the documents, because PEFT is cheap."
      explain: "Fine-tuning is a snapshot, and it teaches a behaviour well but facts poorly. For knowledge that changes often, use retrieval with RAG."
    tr:
      question: "Şirketin, kendi kod tabanını ve politikalarını bilen bir model istiyor. İkisi de sık sık değişiyor. Ne kullanmalısın?"
      options:
        - "Her dosya değiştiğinde modeli yeniden fine-tune et."
        - "Retrieval (RAG) kullan ve bunun için fine-tuning yapma."
        - "Şirketin kendi verisiyle yeni bir model pre-train et."
        - "Dokümanlar üzerinde PEFT kullan, çünkü PEFT ucuz."
      explain: "Fine-tuning bir anlık görüntüdür (snapshot) ve davranışı iyi öğretirken bilgiyi zayıf öğretir. Sık değişen bilgi için RAG ile retrieval kullan."
    fa:
      question: "شرکتت مدلی می‌خواد که codebase و سیاست‌هاش رو بشناسه، و هر دو هم مدام عوض می‌شن. سراغ چی می‌ری؟"
      options:
        - "هر بار که یه فایل عوض شد، مدل رو از نو fine-tune می‌کنی."
        - "از retrieval (RAG) استفاده می‌کنی و برای این کار fine-tune نمی‌کنی."
        - "یه مدل جدید رو با داده‌های خود شرکت pre-train می‌کنی."
        - "روی سندها PEFT اجرا می‌کنی، چون PEFT ارزونه."
      explain: "fine-tuning یه snapshot‌ه؛ رفتار رو خوب یاد می‌ده ولی اطلاعات رو نه. برای اطلاعاتی که مدام عوض می‌شن، باید با RAG سراغ retrieval بری."
