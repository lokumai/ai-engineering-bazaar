# Quick quiz: Training LLMs. Reinforcement, not assessment.
questions:
  - answer: 2
    en:
      question: "What does training change inside a model?"
      options:
        - "It adds rules and facts that you can read."
        - "It changes the size and shape of the network."
        - "It adjusts the numbers inside the parameters."
        - "It saves a copy of every text that it reads."
      explain: "Training only adjusts numbers, and the knowledge is spread across billions of them. The shape of the network does not change."
    tr:
      question: "Training, bir modelin içinde neyi değiştirir?"
      options:
        - "Okuyabileceğin kurallar ve bilgiler ekler."
        - "Network'ün boyutunu ve şeklini değiştirir."
        - "Parameter'ların içindeki sayıları ayarlar."
        - "Okuduğu her metnin bir kopyasını saklar."
      explain: "Training sadece sayıları ayarlar ve bilgi milyarlarca sayının arasına yayılır. Network'ün şekli değişmez."
    fa:
      question: "Training، داخل یک مدل چه چیزی را تغییر می‌دهد؟"
      options:
        - "قانون‌ها و واقعیت‌هایی اضافه می‌کند که می‌توانید بخوانید."
        - "اندازه و شکل network را تغییر می‌دهد."
        - "عددهای داخل parameter‌ها را تنظیم می‌کند."
        - "از هر متنی که می‌خواند یک کپی ذخیره می‌کند."
      explain: "Training فقط عددها را تنظیم می‌کند و دانش در میلیاردها عدد پخش می‌شود. شکل network تغییر نمی‌کند."
  - answer: 0
    en:
      question: "How is the data for pre-training different from the data for fine-tuning?"
      options:
        - "Pre-training uses unlabelled text, and fine-tuning uses input and output pairs."
        - "Pre-training uses input and output pairs, and fine-tuning uses unlabelled text."
        - "Both steps use unlabelled text, but fine-tuning uses a smaller amount of it."
        - "Both steps use pairs that people wrote, but pre-training uses many more of them."
      explain: "In pre-training, the next word is the answer, so nobody writes labels. Fine-tuning uses thousands of pairs that people wrote or checked."
    tr:
      question: "Pre-training verisi, fine-tuning verisinden nasıl farklıdır?"
      options:
        - "Pre-training label'lanmamış metin kullanır, fine-tuning ise input ve output çiftleri kullanır."
        - "Pre-training input ve output çiftleri kullanır, fine-tuning ise label'lanmamış metin kullanır."
        - "İki adım da label'lanmamış metin kullanır, ama fine-tuning bunun daha azını kullanır."
        - "İki adım da insanların yazdığı çiftleri kullanır, ama pre-training çok daha fazlasını kullanır."
      explain: "Pre-training'de sonraki kelimenin kendisi cevaptır, bu yüzden kimse label yazmaz. Fine-tuning, insanların yazdığı veya kontrol ettiği binlerce çifti kullanır."
    fa:
      question: "داده‌ی pre-training با داده‌ی fine-tuning چه فرقی دارد؟"
      options:
        - "Pre-training از متن بدون برچسب استفاده می‌کند، و fine-tuning از جفت‌های input و output."
        - "Pre-training از جفت‌های input و output استفاده می‌کند، و fine-tuning از متن بدون برچسب."
        - "هر دو مرحله از متن بدون برچسب استفاده می‌کنند، اما fine-tuning مقدار کمتری از آن را به کار می‌برد."
        - "هر دو مرحله از جفت‌هایی استفاده می‌کنند که آدم‌ها نوشته‌اند، اما pre-training خیلی بیشتر از آن‌ها را به کار می‌برد."
      explain: "در pre-training کلمه‌ی بعدی خودش پاسخ است، پس کسی برچسب نمی‌نویسد. Fine-tuning از هزاران جفتی استفاده می‌کند که آدم‌ها نوشته یا بررسی کرده‌اند."
  - answer: 3
    en:
      question: "What does PEFT, for example LoRA, do during fine-tuning?"
      options:
        - "It updates all parameters, but on a smaller dataset."
        - "It compresses the model so that it runs more cheaply."
        - "It starts from random weights, but it uses less data."
        - "It freezes most of the model and trains a few extra parameters."
      explain: "PEFT freezes almost the whole model and trains a small number of new parameters, often under 1%. Quantization is the different idea that makes a model cheaper to run."
    tr:
      question: "PEFT, örneğin LoRA, fine-tuning sırasında ne yapar?"
      options:
        - "Bütün parameter'ları günceller, ama daha küçük bir dataset üzerinde."
        - "Modeli sıkıştırır, böylece model daha ucuza çalışır."
        - "Rastgele weight'lerden başlar, ama daha az veri kullanır."
        - "Modelin çoğunu dondurur (freeze) ve birkaç ek parameter eğitir."
      explain: "PEFT modelin neredeyse tamamını dondurur (freeze) ve az sayıda yeni parameter eğitir, genelde toplamın %1'inden azını. Modeli ucuza çalıştıran farklı fikir ise quantization'dır."
    fa:
      question: "PEFT، برای نمونه LoRA، در طول fine-tuning چه کاری می‌کند؟"
      options:
        - "همه‌ی parameter‌ها را به‌روز می‌کند، اما روی dataset کوچک‌تری."
        - "مدل را فشرده می‌کند تا ارزان‌تر اجرا شود."
        - "از weight‌های تصادفی شروع می‌کند، اما داده‌ی کمتری استفاده می‌کند."
        - "بیشتر مدل را freeze می‌کند و چند parameter اضافی را train می‌کند."
      explain: "PEFT تقریباً کل مدل را freeze می‌کند و تعداد کمی parameter جدید را train می‌کند، معمولاً کمتر از 1%. Quantization ایده‌ی متفاوتی است که اجرای مدل را ارزان‌تر می‌کند."
  - answer: 1
    en:
      question: "Your company wants a model that knows its codebase and its policies. Both change often. What should you use?"
      options:
        - "Fine-tune the model again each time a file changes."
        - "Use retrieval (RAG), and do not fine-tune for this."
        - "Pre-train a new model on the company's own data."
        - "Use PEFT on the documents, because PEFT is cheap."
      explain: "Fine-tuning is a snapshot, and it teaches a behaviour well but facts poorly. For knowledge that changes often, use retrieval with RAG."
    tr:
      question: "Şirketin, kendi codebase'ini ve politikalarını bilen bir model istiyor. İkisi de sık değişiyor. Ne kullanmalısın?"
      options:
        - "Her dosya değiştiğinde modeli yeniden fine-tune et."
        - "Retrieval (RAG) kullan, bunun için fine-tune etme."
        - "Şirketin kendi verisiyle yeni bir model pre-train et."
        - "Dokümanlar üzerinde PEFT kullan, çünkü PEFT ucuz."
      explain: "Fine-tuning bir anlık görüntüdür (snapshot) ve bilgiyi (facts) değil, davranışı (behaviour) iyi öğretir. Sık değişen bilgi için RAG ile retrieval kullan."
    fa:
      question: "شرکت شما می‌خواهد مدلی داشته باشد که codebase و سیاست‌هایش را بداند. هر دو اغلب تغییر می‌کنند. باید چه چیزی را به کار ببرید؟"
      options:
        - "هر بار که یک فایل عوض می‌شود، مدل را دوباره fine-tune کنید."
        - "از retrieval (RAG) استفاده کنید و برای این کار fine-tune نکنید."
        - "یک مدل جدید را روی داده‌ی خود شرکت pre-train کنید."
        - "روی سندها PEFT به کار ببرید، چون PEFT ارزان است."
      explain: "Fine-tuning یک snapshot است و رفتار را خوب یاد می‌دهد، اما واقعیت‌ها را ضعیف. برای دانشی که اغلب تغییر می‌کند، از retrieval با RAG استفاده کنید."
