# Quick quiz: Code Agents. Reinforcement, not assessment.
questions:
  - answer: 1
    en:
      question: "Why can a coding agent help with tasks that are not about software?"
      options:
        - "It has a ready tool for each common job, such as image conversion."
        - "It can write and run code, so it installs a library or writes what it needs."
        - "It sends each job to a separate agent that has tools for that one domain."
        - "It connects to an MCP server that already has a tool for every job."
      explain: "Code reaches almost anything a computer can do, so the agent installs a library or writes the code itself. The PNG and slide deck jobs were not in its tool list."
    tr:
      question: "Bir coding agent neden yazılımla ilgisi olmayan işlerde de yardımcı olabilir?"
      options:
        - "Her yaygın iş için hazır bir tool'u vardır, örneğin görsel dönüştürme için."
        - "Kod yazıp çalıştırabilir, bu yüzden bir library kurar ya da ihtiyacı olanı yazar."
        - "Her işi, sadece o alan için tool'ları olan ayrı bir agent'a gönderir."
        - "Her iş için zaten bir tool'u olan bir MCP server'a bağlanır."
      explain: "Kod, bir bilgisayarın yapabildiği hemen her şeye ulaşır, bu yüzden agent bir library kurar ya da kodu kendisi yazar. PNG ve sunum işleri onun tool listesinde yoktu."
    fa:
      question: "چرا یک coding agent می‌تواند در کارهایی که ربطی به نرم‌افزار ندارند کمک کند؟"
      options:
        - "هر کار رایج یک tool آماده دارد، مثلاً تبدیل تصویر."
        - "می‌تواند کد بنویسد و اجرا کند، پس یک library نصب می‌کند یا آنچه لازم دارد را خودش می‌نویسد."
        - "هر کار را به یک agent جداگانه می‌فرستد که tool‌هایی فقط برای همان یک حوزه دارد."
        - "به یک MCP server وصل می‌شود که از قبل برای هر کار یک tool دارد."
      explain: "کد به تقریباً هر کاری که یک کامپیوتر می‌تواند انجام دهد می‌رسد، پس agent یک library نصب می‌کند یا خود کد را می‌نویسد. کارهای PNG و slide deck در فهرست tool‌های آن نبودند."
  - answer: 3
    en:
      question: "Which content belongs in AGENTS.md?"
      options:
        - "Details about this week's work, so the agent knows the newest state of the code."
        - "Notes the agent writes about your corrections, so it remembers them next session."
        - "A new system prompt that replaces the one the vendor wrote for the agent."
        - "Build and test commands, the directory layout, and team rules that rarely change."
      explain: "AGENTS.md holds what stays true across the whole repository. A file with details that no longer match the code is worse than no file, because the agent believes it."
    tr:
      question: "AGENTS.md içine ne girmeli?"
      options:
        - "Bu haftaki işin detayları, agent kodun en yeni hâlini bilsin diye."
        - "Agent'ın senin düzeltmelerine göre yazdığı notlar, sonraki session'da hatırlasın diye."
        - "Vendor'ın agent için yazdığı system prompt'un yerine geçen yeni bir system prompt."
        - "Build ve test komutları, dizin düzeni ve pek değişmeyen ekip kuralları."
      explain: "AGENTS.md, bütün repo boyunca doğru kalan şeyleri tutar. Koda artık uymayan detaylarla dolu bir dosya, hiç dosya olmamasından kötüdür, çünkü agent ona inanır."
    fa:
      question: "کدام محتوا باید در AGENTS.md باشد؟"
      options:
        - "جزئیات کار این هفته، تا agent جدیدترین وضعیت کد را بداند."
        - "یادداشت‌هایی که agent درباره‌ی اصلاحات شما می‌نویسد، تا در session بعدی آن‌ها را به یاد بیاورد."
        - "یک system prompt جدید که جای system prompt‌ای را می‌گیرد که vendor برای agent نوشته است."
        - "دستورهای build و test، چیدمان directory‌ها، و قواعد تیمی که به ندرت تغییر می‌کنند."
      explain: "AGENTS.md چیزهایی را نگه می‌دارد که در کل repository درست می‌مانند. فایلی با جزئیاتی که دیگر با کد جور نیست، از نداشتن فایل بدتر است، چون agent به آن باور دارد."
  - answer: 0
    en:
      question: "What does MCP (Model Context Protocol) change for a tool that you write?"
      options:
        - "You write it once in a standard shape, and every agent that speaks MCP can use it."
        - "Its name and description no longer take any space in the context window."
        - "The service behind it no longer needs an API, because the model calls the service directly."
        - "The agent reads its full description only at the moment a task needs the tool."
      explain: "Before MCP, you wrote the same Jira tools again for each agent. With MCP the tool lives in an MCP server, and any agent that speaks the protocol can connect to it."
    tr:
      question: "MCP (Model Context Protocol), senin yazdığın bir tool için neyi değiştirir?"
      options:
        - "Tool'u bir kez standart bir şekilde yazarsın, MCP konuşan her agent onu kullanabilir."
        - "Tool'un adı ve açıklaması artık context window'da hiç yer kaplamaz."
        - "Tool'un arkasındaki servisin artık bir API'ye ihtiyacı olmaz, çünkü model servisi doğrudan çağırır."
        - "Agent, tool'un tam açıklamasını ancak bir iş o tool'a ihtiyaç duyduğunda okur."
      explain: "MCP'den önce aynı Jira tool'larını her agent için yeniden yazıyordun. MCP ile tool bir MCP server'da durur ve protokolü konuşan her agent ona bağlanabilir."
    fa:
      question: "MCP (Model Context Protocol) برای tool‌ای که خودتان می‌نویسید چه چیزی را تغییر می‌دهد؟"
      options:
        - "آن را یک بار با شکل استاندارد می‌نویسید، و هر agent که MCP را پشتیبانی کند می‌تواند از آن استفاده کند."
        - "نام و توضیح آن دیگر هیچ جایی از context window را اشغال نمی‌کند."
        - "سرویس پشت آن دیگر به API نیاز ندارد، چون مدل مستقیماً سرویس را فراخوانی می‌کند."
        - "agent توضیح کامل آن را فقط در لحظه‌ای می‌خواند که یک کار به tool نیاز دارد."
      explain: "پیش از MCP، همان tool‌های Jira را برای هر agent دوباره می‌نوشتید. با MCP، tool در یک MCP server قرار می‌گیرد و هر agent که پروتکل را پشتیبانی کند می‌تواند به آن وصل شود."
  - answer: 2
    en:
      question: "What does an agent load from each installed skill when a session starts?"
      options:
        - "The full SKILL.md of every skill, so every instruction is in the window from the start."
        - "Nothing, until you type the skill's name as a slash command yourself."
        - "Only the name and the description of each skill, a line or two for each one."
        - "Only the skills that belong to the directory where the agent works now."
      explain: "This is progressive disclosure: the agent reads the full instructions only when it decides a skill fits the task. So twenty skills cost almost nothing."
    tr:
      question: "Bir session başladığında agent, kurulu her skill'den neyi yükler?"
      options:
        - "Her skill'in tam SKILL.md dosyasını, böylece her talimat baştan window'da olur."
        - "Hiçbir şeyi, sen skill'in adını bir slash command olarak yazana kadar."
        - "Sadece her skill'in adını (name) ve açıklamasını (description), her biri için bir iki satır."
        - "Sadece agent'ın şu an çalıştığı dizine ait olan skill'leri."
      explain: "Bu, progressive disclosure: agent tam talimatları ancak bir skill'in işe uyduğuna karar verdiğinde okur. Bu yüzden yirmi skill neredeyse hiçbir şeye mal olmaz."
    fa:
      question: "وقتی یک session شروع می‌شود، agent از هر skill نصب‌شده چه چیزی را بارگذاری می‌کند؟"
      options:
        - "SKILL.md کامل هر skill، تا هر دستورالعمل از همان ابتدا در window باشد."
        - "هیچ چیز، تا وقتی که خودتان نام skill را به عنوان slash command تایپ کنید."
        - "فقط نام و توضیح هر skill، یک یا دو خط برای هر کدام."
        - "فقط skill‌هایی که متعلق به directory‌ای هستند که agent الان در آن کار می‌کند."
      explain: "این progressive disclosure است: agent دستورالعمل‌های کامل را فقط وقتی می‌خواند که تصمیم بگیرد یک skill با کار مناسب است. پس بیست skill تقریباً هزینه‌ای ندارد."
  - answer: 1
    en:
      question: "AGENTS.md asks the agent never to edit a file. A PreToolUse hook blocks that edit. What is the difference?"
      options:
        - "The hook is advice that the model follows most of the time, like AGENTS.md."
        - "The AGENTS.md line is a request, and the hook is a rule that runs every time."
        - "The hook works only when the model decides that the edit is a mistake."
        - "The two are the same, because the model reads both of them in the system prompt."
      explain: "AGENTS.md is advice that the model follows most of the time. A hook is a shell command that runs whether the model wants it or not."
    tr:
      question: "AGENTS.md, agent'tan bir dosyayı asla düzenlememesini istiyor. Bir PreToolUse hook'u ise o edit'i engelliyor. Aradaki fark nedir?"
      options:
        - "Hook da AGENTS.md gibi, modelin çoğu zaman uyduğu bir tavsiyedir."
        - "AGENTS.md satırı bir ricadır, hook ise her seferinde çalışan bir kuraldır."
        - "Hook, sadece model edit'in bir hata olduğuna karar verdiğinde çalışır."
        - "İkisi aynıdır, çünkü model ikisini de system prompt'ta okur."
      explain: "AGENTS.md, modelin çoğu zaman uyduğu bir tavsiyedir. Hook ise model istesin istemesin çalışan bir shell komutudur."
    fa:
      question: "AGENTS.md از agent می‌خواهد که هرگز یک فایل را ویرایش نکند. یک PreToolUse hook آن ویرایش را مسدود می‌کند. تفاوت چیست؟"
      options:
        - "hook هم مثل AGENTS.md یک توصیه است که مدل بیشتر وقت‌ها از آن پیروی می‌کند."
        - "خط AGENTS.md یک درخواست است، و hook یک قانون است که هر بار اجرا می‌شود."
        - "hook فقط وقتی کار می‌کند که مدل تصمیم بگیرد ویرایش یک اشتباه است."
        - "این دو یکی هستند، چون مدل هر دو را در system prompt می‌خواند."
      explain: "AGENTS.md یک توصیه است که مدل بیشتر وقت‌ها از آن پیروی می‌کند. hook یک shell command است که چه مدل بخواهد چه نخواهد اجرا می‌شود."
