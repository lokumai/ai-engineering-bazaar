# Quick quiz: Code Agents. Reinforcement, not assessment.
questions:
  - answer: 1
    en:
      question: "Why can a coding agent help with tasks that are not about software?"
      options:
        - "It has a ready tool for each common job, such as image conversion."
        - "It can write and run code, so it installs a library or writes what it needs."
        - "It sends each job to a separate agent that has tools for that one domain."
        - "It connects to an MCP server that already has a tool for every job."
      explain: "Code reaches almost anything a computer can do, so the agent installs a library or writes the code itself. The PNG and slide deck jobs were not in its tool list."
    tr:
      question: "Bir code agent neden yazılımla ilgisi olmayan işlerde de yardımcı olabilir?"
      options:
        - "Görsel dönüştürme gibi her yaygın iş için hazır bir tool'u vardır."
        - "Kod yazıp çalıştırabildiği için bir library kurar ya da ihtiyacı olan kodu kendisi yazar."
        - "Her işi, yalnızca tek bir alan için tool'ları olan ayrı bir agent'a gönderir."
        - "Her iş için tool'u hazır olan bir MCP server'a bağlanır."
      explain: "Kod, bir bilgisayarın yapabildiği neredeyse her şeye ulaşabildiği için agent bir library kurar ya da kodu kendisi yazar. PNG ve sunum işleri ise tool listesinde yoktu."
    fa:
      question: "چرا یه coding agent توی کارهایی هم کمک می‌کنه که ربطی به نرم‌افزار ندارن؟"
      options:
        - "برای هر کار رایجی، مثل تبدیل عکس، یه tool آماده داره."
        - "می‌تونه کد بنویسه و اجرا کنه، پس یه کتابخونه نصب می‌کنه یا هر چی لازم داره رو خودش می‌نویسه."
        - "هر کار رو می‌فرسته برای یه agent جدا که tool‌هاش فقط مال همون حوزه‌ست."
        - "به یه MCP server وصل می‌شه که از قبل برای هر کاری یه tool داره."
      explain: "با کد تقریباً به هر کاری که از کامپیوتر برمیاد می‌شه رسید، پس agent یه کتابخونه نصب می‌کنه یا کد رو خودش می‌نویسه. کار PNG و پرزنتیشن هیچ‌کدوم توی لیست tool‌هاش نبودن."
  - answer: 3
    en:
      question: "Which content belongs in AGENTS.md?"
      options:
        - "Details about this week's work, so the agent knows the newest state of the code."
        - "Notes the agent writes about your corrections, so it remembers them next session."
        - "A new system prompt that replaces the one the vendor wrote for the agent."
        - "Build and test commands, the directory layout, and team rules that rarely change."
      explain: "AGENTS.md holds what stays true across the whole repository. A file with details that no longer match the code is worse than no file, because the agent believes it."
    tr:
      question: "AGENTS.md içine hangi içerik girmelidir?"
      options:
        - "Bu haftaki işin ayrıntıları, agent kodun en güncel hâlini bilsin diye."
        - "Agent'ın senin düzeltmelerinden yazdığı notlar, bir sonraki oturumda hatırlasın diye."
        - "Üreticinin agent için yazdığı sistem prompt'unun yerini alan yeni bir sistem prompt'u."
        - "Build ve test komutları, dizin yapısı ve nadiren değişen ekip kuralları."
      explain: "AGENTS.md, repository'nin tamamında doğru kalan şeyleri tutar. Koda artık uymayan ayrıntılarla dolu bir dosya, hiç dosya olmamasından daha kötüdür, çünkü agent dosyadaki her şeye inanır."
    fa:
      question: "چه چیزهایی جاشون توی AGENTS.md‌ه؟"
      options:
        - "جزئیات کار همین هفته، تا agent از آخرین وضعیت کد باخبر باشه."
        - "یادداشت‌هایی که agent از اصلاح‌های تو برمی‌داره، تا session بعدی یادش بمونه."
        - "یه system prompt تازه که جای system prompt‌ی رو بگیره که سازنده‌ی agent نوشته."
        - "دستورهای build و test، چیدمان پوشه‌ها، و قانون‌های تیم که کم پیش میاد عوض بشن."
      explain: "AGENTS.md چیزهایی رو نگه می‌داره که توی کل repository درست می‌مونن. فایلی که جزئیاتش دیگه با کد نمی‌خونه، از نبودنش بدتره، چون agent هر چی توشه رو باور می‌کنه."
  - answer: 0
    en:
      question: "What does MCP (Model Context Protocol) change for a tool that you write?"
      options:
        - "You write it once in a standard shape, and every agent that speaks MCP can use it."
        - "Its name and description no longer take any space in the context window."
        - "The service behind it no longer needs an API, because the model calls the service directly."
        - "The agent reads its full description only at the moment a task needs the tool."
      explain: "Before MCP, you wrote the same Jira tools again for each agent. With MCP the tool lives in an MCP server, and any agent that speaks the protocol can connect to it."
    tr:
      question: "Kendi yazdığın bir tool için MCP (Model Context Protocol) neyi değiştirir?"
      options:
        - "Tool'u standart bir biçimde bir kez yazarsın ve MCP'yi konuşan her agent onu kullanabilir."
        - "Tool'un adı ve açıklaması artık context window'da hiç yer kaplamaz."
        - "Tool'un arkasındaki servis artık bir API'ye ihtiyaç duymaz, çünkü model servisi doğrudan çağırır."
        - "Agent, tool'un tam açıklamasını yalnızca bir görev o tool'a ihtiyaç duyduğunda okur."
      explain: "MCP'den önce aynı Jira tool'larını her agent için yeniden yazıyordun. MCP ile tool bir MCP server'da durur ve protokolü konuşan her agent bu server'a bağlanabilir."
    fa:
      question: "MCP (Model Context Protocol) برای tool‌ی که خودت می‌نویسی چه فرقی ایجاد می‌کنه؟"
      options:
        - "یه بار با یه شکل استاندارد می‌نویسیش و هر agent‌ی که MCP بلده، می‌تونه ازش استفاده کنه."
        - "اسم و توضیحش دیگه هیچ جایی از context window رو نمی‌گیره."
        - "سرویس پشتش دیگه API لازم نداره، چون مدل مستقیم خود سرویس رو صدا می‌زنه."
        - "agent توضیح کامل tool رو فقط همون لحظه‌ای می‌خونه که یه کار لازمش داره."
      explain: "قبل از MCP، باید همون tool‌های Jira رو برای هر agent از نو می‌نوشتی. با MCP، tool توی یه MCP server می‌مونه و هر agent‌ی که این پروتکل رو بلده، می‌تونه بهش وصل بشه."
  - answer: 2
    en:
      question: "What does an agent load from each installed skill when a session starts?"
      options:
        - "The full SKILL.md of every skill, so every instruction is in the window from the start."
        - "Nothing, until you type the skill's name as a slash command yourself."
        - "Only the name and the description of each skill, a line or two for each one."
        - "Only the skills that belong to the directory where the agent works now."
      explain: "This is progressive disclosure: the agent reads the full instructions only when it decides a skill fits the task. So twenty skills cost almost nothing."
    tr:
      question: "Bir oturum başladığında agent, kurulu her skill'den neyi yükler?"
      options:
        - "Her skill'in tam SKILL.md dosyasını, böylece her talimat baştan window'da olur."
        - "Hiçbir şeyi, sen skill'in adını bir slash command olarak yazana kadar."
        - "Her skill'in yalnızca adını (name) ve açıklamasını (description), her biri için bir ya da iki satır."
        - "Yalnızca agent'ın o an çalıştığı dizine ait skill'leri."
      explain: "Bu bir kademeli açılımdır (progressive disclosure): agent tam talimatları yalnızca bir skill'in işe uyduğuna karar verdiğinde okur. Bu yüzden yirmi skill neredeyse hiçbir yer kaplamaz."
    fa:
      question: "وقتی یه session شروع می‌شه، agent از هر skill نصب‌شده چی رو لود می‌کنه؟"
      options:
        - "کل SKILL.md همه‌ی skill‌ها رو، تا همه‌ی دستورالعمل‌ها از همون اول توی window باشن."
        - "هیچی، تا وقتی که خودت اسم skill رو مثل یه slash command تایپ کنی."
        - "فقط اسم و توضیح هر skill رو، که برای هر کدوم یکی دو خطه."
        - "فقط skill‌هایی رو که مال پوشه‌ای‌ان که agent الان داره توش کار می‌کنه."
      explain: "این همون progressive disclosure‌ه: agent دستورالعمل کامل رو فقط وقتی می‌خونه که به این نتیجه برسه یه skill به کار فعلی می‌خوره. برای همین بیست تا skill تقریباً هیچ هزینه‌ای ندارن."
  - answer: 1
    en:
      question: "AGENTS.md asks the agent never to edit a file. A PreToolUse hook blocks that edit. What is the difference?"
      options:
        - "The hook is advice that the model follows most of the time, like AGENTS.md."
        - "The AGENTS.md line is a request, and the hook is a rule that runs every time."
        - "The hook works only when the model decides that the edit is a mistake."
        - "The two are the same, because the model reads both of them in the system prompt."
      explain: "AGENTS.md is advice that the model follows most of the time. A hook is a shell command that runs whether the model wants it or not."
    tr:
      question: "AGENTS.md, agent'tan bir dosyayı asla düzenlememesini ister. Bir PreToolUse hook'u da o düzenlemeyi engeller. Aradaki fark nedir?"
      options:
        - "Hook da AGENTS.md gibi, modelin çoğu zaman uyduğu bir tavsiyedir."
        - "AGENTS.md'deki satır bir istektir, hook ise her seferinde çalışan bir kuraldır."
        - "Hook yalnızca model düzenlemenin bir hata olduğuna karar verdiğinde çalışır."
        - "İkisi aynıdır, çünkü model ikisini de sistem prompt'unda okur."
      explain: "AGENTS.md, modelin çoğu zaman uyduğu bir tavsiyedir. Hook ise model isterse de istemezse de çalışan bir shell komutudur."
    fa:
      question: "توی AGENTS.md از agent خواستی هیچ‌وقت یه فایل رو ویرایش نکنه، و یه hook از نوع PreToolUse هم جلوی همین ویرایش رو می‌گیره. فرق این دو تا چیه؟"
      options:
        - "hook هم مثل AGENTS.md یه توصیه‌ست که مدل بیشتر وقت‌ها بهش عمل می‌کنه."
        - "خطی که توی AGENTS.md نوشتی یه خواهشه، ولی hook قانونیه که هر بار اجرا می‌شه."
        - "hook فقط وقتی کار می‌کنه که خود مدل به این نتیجه برسه که اون ویرایش اشتباهه."
        - "این دو تا هیچ فرقی ندارن، چون مدل هر دو رو توی system prompt می‌خونه."
      explain: "AGENTS.md توصیه‌ایه که مدل بیشتر وقت‌ها بهش عمل می‌کنه. hook یه shell command‌ه که چه مدل بخواد چه نخواد، اجرا می‌شه."
