# Quick quiz: Context Engineering. Reinforcement, not assessment.
questions:
  - answer: 2
    en:
      question: "What is context rot?"
      options:
        - "The model loses the oldest context when the history is larger than the window."
        - "The model gives better answers when you add more context to the window."
        - "The model does the task worse as the context grows, before the window is full."
        - "The model changes its weights when a session becomes very long."
      explain: "Context rot means the answers get worse as the context grows, long before the window is full. The cause is attention, a fixed budget divided across everything in the window."
    tr:
      question: "Context rot nedir?"
      options:
        - "Geçmişin window'a sığmayacak kadar büyüdüğünde model en eski context'i kaybeder."
        - "Window'a daha fazla context eklediğinde model daha iyi cevaplar verir."
        - "Context büyüdükçe model görevi daha kötü yapar, hem de window dolmadan önce."
        - "Session çok uzadığında model kendi weight'lerini değiştirir."
      explain: "Context rot, context büyüdükçe cevapların window dolmadan çok önce kötüleşmesi demek. Bunun nedeni attention: window'daki her şeye bölünen, sabit bir bütçe."
    fa:
      question: "context rot یعنی چی؟"
      options:
        - "وقتی history از window بزرگ‌تر بشه، مدل قدیمی‌ترین قسمت context رو از دست می‌ده."
        - "هر چی context بیشتری بریزی توی window، مدل جواب بهتری می‌ده."
        - "هر چی context بزرگ‌تر بشه، مدل کار رو بدتر انجام می‌ده، حتی قبل از اینکه window پر بشه."
        - "وقتی session خیلی طولانی می‌شه، مدل وزن‌های خودش رو تغییر می‌ده."
      explain: "context rot یعنی با بزرگ‌تر شدن context جواب‌ها بدتر می‌شن، خیلی قبل از اینکه window پر بشه. علتش attention‌ه، یعنی یه بودجه‌ی ثابت که بین همه‌ی چیزهای توی window پخش می‌شه."
  - answer: 0
    en:
      question: "Which question does context engineering answer?"
      options:
        - "How do you choose what goes into the context and what does not?"
        - "How do you write one prompt so that the model gives a good answer?"
        - "How do you get a bigger context window for a long session?"
        - "How do you add every useful document to the context on each turn?"
      explain: "The window is limited, so context engineering decides what goes in, again on every turn. Writing one good prompt is the job of prompt engineering."
    tr:
      question: "Context engineering hangi soruyu cevaplıyor?"
      options:
        - "Context'e neyin girip neyin girmeyeceği nasıl seçilir?"
        - "Model iyi bir cevap versin diye tek bir prompt nasıl yazılır?"
        - "Uzun bir session için daha büyük bir context window nasıl alınır?"
        - "Her faydalı doküman her turda context'e nasıl eklenir?"
      explain: "Window sınırlı olduğu için context engineering, içeri neyin gireceğine her turda yeniden karar verir. Tek bir iyi prompt yazmak ise prompt engineering'in işi."
    fa:
      question: "context engineering جواب کدوم سواله؟"
      options:
        - "چطور انتخاب کنیم چی بره توی context و چی بیرون بمونه؟"
        - "چطور یه prompt بنویسیم که مدل جواب خوبی بده؟"
        - "چطور برای یه session طولانی context window بزرگ‌تری گیر بیاریم؟"
        - "چطور توی هر نوبت همه‌ی سندهای مفید رو به context اضافه کنیم؟"
      explain: "window محدوده، پس context engineering توی هر نوبت از نو تصمیم می‌گیره چی بره تو. نوشتن یه prompt خوب کار prompt engineering‌ه."
  - answer: 3
    en:
      question: "An agent must read many files to answer one short question. Why does it give this work to a subagent?"
      options:
        - "The subagent uses the main agent's window, so no new context is needed."
        - "The subagent makes the main agent's window larger for the rest of the session."
        - "The subagent sends every intermediate step back to the main agent."
        - "The subagent reads in its own context and returns only the conclusion."
      explain: "The subagent does the reading in its own empty context and returns only the conclusion. The main agent's context gains one sentence, not every file."
    tr:
      question: "Bir agent, kısa bir soruyu cevaplamak için çok sayıda dosya okumak zorunda. Peki bu işi neden bir subagent'a devrediyor?"
      options:
        - "Subagent, ana agent'ın window'unu kullanır; bu yüzden yeni bir context gerekmez."
        - "Subagent, session'ın geri kalanı için ana agent'ın window'unu büyütür."
        - "Subagent, her ara adımı ana agent'a geri gönderir."
        - "Subagent okumayı kendi context'inde yapar ve yalnızca sonucu döndürür."
      explain: "Subagent okumayı kendi boş context'inde yapar ve yalnızca sonucu geri döndürür. Ana agent'ın context'ine ise bütün dosyalar değil, tek bir cümle eklenir."
    fa:
      question: "یه agent برای جواب دادن به یه سوال کوتاه باید کلی فایل بخونه. چرا این کار رو می‌سپره به یه subagent؟"
      options:
        - "subagent از window خود agent اصلی استفاده می‌کنه، پس context تازه‌ای لازم نیست."
        - "subagent باعث می‌شه window agent اصلی تا آخر session بزرگ‌تر بشه."
        - "subagent همه‌ی قدم‌های وسط کار رو برمی‌گردونه به agent اصلی."
        - "subagent توی context خودش می‌خونه و فقط نتیجه رو برمی‌گردونه."
      explain: "subagent خوندن رو توی context خالی خودش انجام می‌ده و فقط نتیجه رو برمی‌گردونه. این‌جوری به context agent اصلی فقط یه جمله اضافه می‌شه، نه همه‌ی اون فایل‌ها."
  - answer: 1
    en:
      question: "What must an agent have, at least, to count as a deep agent?"
      options:
        - "A very large context window and a sliding window for old tokens"
        - "Planning with a to-do list, subagents, and a filesystem"
        - "A full RAG pipeline that adds all documents to every prompt"
        - "One model in a plain loop, with a short system prompt"
      explain: "A deep agent needs at least planning, subagents and a filesystem. Claude Code, Codex, Copilot and OpenCode have all three, so they are already deep agents."
    tr:
      question: "Bir agent'ın deep agent sayılması için en azından neye ihtiyacı var?"
      options:
        - "Çok büyük bir context window'u ve eski token'lar için bir sliding window"
        - "Bir to-do listesiyle planlama (planning), subagent'lar ve bir filesystem"
        - "Bütün dokümanları her prompt'a ekleyen tam bir RAG pipeline'ı"
        - "Kısa bir system prompt ile çalışan, düz bir loop içinde tek bir model"
      explain: "Bir deep agent'ın en azından planlama (planning), subagent'lar ve bir filesystem'e ihtiyacı var. Claude Code, Codex, Copilot ve OpenCode bu üçünün hepsine sahip, dolayısıyla zaten deep agent'tır."
    fa:
      question: "یه agent دست‌کم چی باید داشته باشه تا deep agent حساب بشه؟"
      options:
        - "یه context window خیلی بزرگ، و یه sliding window برای token‌های قدیمی"
        - "planning با to-do list، subagent و filesystem"
        - "یه RAG pipeline کامل که همه‌ی سندها رو به هر prompt اضافه می‌کنه"
        - "یه مدل توی یه loop ساده، با یه system prompt کوتاه"
      explain: "deep agent دست‌کم planning، subagent و filesystem لازم داره. Claude Code، Codex، Copilot و OpenCode هر سه تا رو دارن، پس همین حالا هم deep agent‌ان."
  - answer: 2
    en:
      question: "In a long session, how do a to-do list and chain of thought both help the model follow the goal?"
      options:
        - "They delete old tokens, so the window has more free space."
        - "They add new documents from the knowledge base to the window."
        - "They repeat the important thing close to where the model writes."
        - "They put the goal at the start of the window, where it stays."
      explain: "Both work by recitation: they say the important thing again, near where the model is about to write. Attention goes to what is near and repeated."
    tr:
      question: "Uzun bir session'da hem bir to-do listesi hem de chain of thought, modelin hedefi takip etmesine nasıl yardımcı oluyor?"
      options:
        - "Eski token'ları silerler ve window'da daha fazla boş yer kalır."
        - "Knowledge base'den window'a yeni dokümanlar eklerler."
        - "Önemli olanı, modelin yazdığı yerin hemen yakınında tekrar ederler."
        - "Hedefi window'un başına koyarlar ve hedef orada öylece kalır."
      explain: "İkisi de recitation ile çalışır: önemli olanı, modelin yazmak üzere olduğu yerin yakınında yeniden söylerler. Attention, yakında olan ve tekrar edilen şeye gider."
    fa:
      question: "توی یه session طولانی، to-do list و chain of thought هر دو چطور کمک می‌کنن مدل هدف رو گم نکنه؟"
      options:
        - "token‌های قدیمی رو پاک می‌کنن تا window جای خالی بیشتری داشته باشه."
        - "سندهای تازه رو از knowledge base میارن توی window."
        - "چیز مهم رو نزدیک همون جایی که مدل داره می‌نویسه، دوباره تکرار می‌کنن."
        - "هدف رو اول window می‌ذارن که همون‌جا بمونه."
      explain: "هر دو با recitation کار می‌کنن، یعنی چیز مهم رو دوباره نزدیک جایی می‌گن که مدل الان می‌خواد بنویسه. attention می‌ره سمت چیزی که نزدیک باشه و تکرار شده باشه."
