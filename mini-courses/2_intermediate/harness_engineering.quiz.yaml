# Quick quiz: Harness Engineering. Reinforcement, not assessment.
questions:
  - answer: 2
    en:
      question: "An agent must never push to main. Why is the instruction \"do not push to main\" not enough for this rule?"
      options:
        - "The model does not read the instructions in AGENTS.md."
        - "The instruction uses too much space in the context window."
        - "The model is non-deterministic, so an instruction gives no guarantee."
        - "The model follows instructions only in the first turn."
      explain: "The same input can give a different result next time. An instruction works most of the time, but this rule needs a mechanical part that acts the same every run."
    tr:
      question: "Bir agent asla main'e push atmamalı. Talimatta 'main'e push atma' yazmak bu kural için neden yeterli değil?"
      options:
        - "Model AGENTS.md içindeki talimatları okumuyor."
        - "Talimat, context window'da çok fazla yer kaplıyor."
        - "Model deterministik değil, yani bir talimat garanti vermiyor."
        - "Model talimatlara yalnızca ilk turda uyuyor."
      explain: "Aynı girdi bir dahaki sefer farklı bir sonuç verebilir. Talimat çoğu zaman işe yarar, ama bu kural için her çalışmada aynı davranan mekanik bir parça gerekir."
    fa:
      question: "یه agent هیچ‌وقت نباید روی main push کنه. چرا دستور «روی main push نکن» برای این قانون کافی نیست؟"
      options:
        - "مدل دستورهایی رو که توی AGENTS.md نوشتی نمی‌خونه."
        - "این دستور جای زیادی از context window رو می‌گیره."
        - "مدل non-deterministic‌ه، پس هیچ دستوری تضمین نمی‌ده."
        - "مدل فقط توی نوبت اول به دستورها عمل می‌کنه."
      explain: "همون ورودی ممکنه دفعه‌ی بعد نتیجه‌ی دیگه‌ای بده. دستور بیشتر وقت‌ها جواب می‌ده، ولی این قانون یه بخش مکانیکی لازم داره که توی هر اجرا دقیقاً یه جور رفتار کنه."
  - answer: 0
    en:
      question: "How does the harness relate to prompt engineering and context engineering?"
      options:
        - "The harness is the outer layer. It contains your prompt and context work."
        - "The harness replaces them. You use it instead of prompt and context work."
        - "The harness is a part of the context. It sits inside the context window."
        - "The harness is a new name for context engineering. They are the same thing."
      explain: "Each layer contains the one inside it, so the three are not alternatives. You do context engineering inside the harness you chose."
    tr:
      question: "Harness, prompt engineering ve context engineering ile nasıl bir ilişki içinde?"
      options:
        - "Harness dış katmandır. Prompt ve context çalışmanı içinde barındırır."
        - "Harness onların yerini alır. Prompt ve context işi yerine onu kullanırsın."
        - "Harness, context'in bir parçasıdır. Context window'un içinde durur."
        - "Harness, context engineering'in yeni adıdır. İkisi aynı şeydir."
      explain: "Her katman, içindeki katmanı kapsar, bu yüzden üçü birbirinin alternatifi değildir. Context engineering'i seçtiğin harness'in içinde yaparsın."
    fa:
      question: "harness چه نسبتی با prompt engineering و context engineering داره؟"
      options:
        - "harness لایه‌ی بیرونیه و کار prompt و context تو رو در بر می‌گیره."
        - "harness جای اون‌ها رو می‌گیره و به‌جای کار prompt و context ازش استفاده می‌کنی."
        - "harness یه بخش از context‌ه و داخل context window می‌شینه."
        - "harness فقط اسم تازه‌ی context engineering‌ه و هر دو یه چیزن."
      explain: "هر لایه لایه‌ی داخلی‌ش رو در بر می‌گیره، پس این سه تا جایگزین هم نیستن. context engineering رو توی همون harness‌ی انجام می‌دی که انتخاب کردی."
  - answer: 1
    en:
      question: "Böckeler splits a harness into guides and sensors. What is the difference?"
      options:
        - "Guides report how the work went. Sensors tell the agent what to do before it acts."
        - "Guides tell the agent what to do before it acts. Sensors report how the work went."
        - "Guides are written by the vendor. Sensors are written by the user of the agent."
        - "Guides change the model weights. Sensors change the size of the context window."
      explain: "Guides, such as AGENTS.md and tool descriptions, come before the work. Sensors, such as tests and linters, report after the work, so the agent can fix what it broke."
    tr:
      question: "Böckeler, bir harness'ı guide'lar ve sensor'lar olarak ikiye ayırıyor. Aralarındaki fark ne?"
      options:
        - "Guide'lar işin nasıl gittiğini bildirir. Sensor'lar ise agent harekete geçmeden önce ne yapacağını söyler."
        - "Guide'lar agent harekete geçmeden önce ne yapacağını söyler. Sensor'lar işin nasıl gittiğini bildirir."
        - "Guide'ları sağlayıcı yazar. Sensor'ları agent'ı kullanan kişi yazar."
        - "Guide'lar model weight'lerini değiştirir. Sensor'lar context window'un boyutunu değiştirir."
      explain: "AGENTS.md ve tool açıklamaları gibi guide'lar işten önce gelir. Testler ve linter'lar gibi sensor'lar ise işten sonra bilgi verir, böylece agent bozduğu şeyi düzeltebilir."
    fa:
      question: "Böckeler اجزای harness رو به guide و sensor تقسیم می‌کنه. فرق این دو تا چیه؟"
      options:
        - "guide‌ها گزارش می‌دن کار چطور پیش رفت، و sensor‌ها قبل از شروع کار به agent می‌گن چیکار کنه."
        - "guide‌ها قبل از شروع کار به agent می‌گن چیکار کنه، و sensor‌ها گزارش می‌دن کار چطور پیش رفت."
        - "guide‌ها رو سازنده‌ی agent می‌نویسه، و sensor‌ها رو کسی که از agent استفاده می‌کنه."
        - "guide‌ها وزن‌های مدل رو عوض می‌کنن، و sensor‌ها اندازه‌ی context window رو."
      explain: "guide‌ها، مثل AGENTS.md و توضیح tool‌ها، قبل از کار میان. sensor‌ها، مثل تست‌ها و linter‌ها، بعد از کار گزارش می‌دن تا agent بتونه هر چی رو خراب کرده درست کنه."
  - answer: 3
    en:
      question: "LangChain made five changes to the harness of their coding agent. What was the result on Terminal Bench 2.0?"
      options:
        - "The score increased, because they also used a larger model."
        - "The score did not change, because only the model controls the score."
        - "The score decreased, because more hooks make the agent slower."
        - "The score increased from 52.8% to 66.5%, and the model did not change."
      explain: "The model weights were the same in both runs. Nearly fourteen points came from changes to the environment around the model."
    tr:
      question: "LangChain, coding agent'larının harness'ında beş değişiklik yaptı. Terminal Bench 2.0'da sonuç ne oldu?"
      options:
        - "Skor arttı, çünkü daha büyük bir model de kullandılar."
        - "Skor değişmedi, çünkü skoru yalnızca model belirler."
        - "Skor düştü, çünkü daha fazla hook agent'ı yavaşlatır."
        - "Skor 52.8%'ten 66.5%'e çıktı ve model değişmedi."
      explain: "İki çalışmada da model weight'leri aynıydı. Neredeyse on dört puan, modelin etrafındaki ortamı (environment) değiştirmekten geldi."
    fa:
      question: "LangChain پنج تا تغییر توی harness coding agent خودش داد. نتیجه‌ش توی Terminal Bench 2.0 چی شد؟"
      options:
        - "امتیاز بالا رفت، چون یه مدل بزرگ‌تر هم گذاشته بودن."
        - "امتیاز تکون نخورد، چون امتیاز فقط دست مدله."
        - "امتیاز پایین اومد، چون hook بیشتر agent رو کندتر می‌کنه."
        - "امتیاز از 52.8% به 66.5% رسید، بدون اینکه مدل عوض بشه."
      explain: "وزن‌های مدل توی هر دو اجرا عین هم بودن، و نزدیک چهارده امتیاز فقط از تغییر دادن محیط دور مدل اومد."
  - answer: 2
    en:
      question: "Composio ran one model through eight harnesses on the same tasks. What is the main lesson?"
      options:
        - "Pi Agent scored highest, so every team should use Pi Agent."
        - "The harness has little effect, because the model was the same."
        - "The pairing matters: a harness fits the model it was built for."
        - "The fastest harness is always the cheapest harness per success."
      explain: "A harness makes assumptions about the model it was built for, so another model can do worse in it. Pi Agent won here, but the lesson is the pairing."
    tr:
      question: "Composio, bir modeli aynı görevlerde sekiz harness'ten geçirdi. Ana ders ne?"
      options:
        - "Pi Agent en yüksek skoru aldı, o yüzden her ekip Pi Agent kullanmalı."
        - "Harness'ın etkisi az, çünkü model aynıydı."
        - "Eşleşme (pairing) önemli: bir harness, kendisi için kurulduğu modele uyar."
        - "En hızlı harness her zaman başarı başına en ucuz harness demektir."
      explain: "Bir harness, kendisi için kurulduğu modele dair varsayımlar yapar, bu yüzden başka bir model onun içinde daha kötü çalışabilir. Pi Agent burada kazandı, ama asıl ders eşleşmenin önemi."
    fa:
      question: "Composio یه مدل رو با همون کارها توی هشت harness مختلف اجرا کرد. درس اصلی‌ش چیه؟"
      options:
        - "Pi Agent بیشترین امتیاز رو گرفت، پس همه‌ی تیم‌ها باید برن سراغ Pi Agent."
        - "harness اثر زیادی نداره، چون مدل همون مدل بود."
        - "جفت شدن مدل و harness مهمه: هر harness به مدلی می‌خوره که براش ساخته شده."
        - "سریع‌ترین harness همیشه به ازای هر موفقیت ارزون‌ترین هم هست."
      explain: "هر harness درباره‌ی مدلی که براش ساخته شده یه سری فرض داره، پس یه مدل دیگه ممکنه توش ضعیف‌تر کار کنه. این‌جا Pi Agent برنده شد، ولی درس اصلی همین جفت شدنه."
