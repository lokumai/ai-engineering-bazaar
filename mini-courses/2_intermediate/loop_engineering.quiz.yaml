# Quick quiz: Loop Engineering. Reinforcement, not assessment.
questions:
  - answer: 1
    en:
      question: "In loop engineering, which single question does the whole design follow from?"
      options:
        - "Which model runs the agent?"
        - "What is the stop condition?"
        - "Which tools can the agent call?"
        - "Who writes the first prompt?"
      explain: "The module says everything else follows from the stop condition. If it is wrong, the loop stops too early or runs too long and costs too much."
    tr:
      question: "Loop engineering'de bütün tasarım hangi tek sorunun cevabına bağlıdır?"
      options:
        - "Agent'ı hangi model çalıştırıyor?"
        - "Durma koşulu (stop condition) nedir?"
        - "Agent hangi tool'ları çağırabilir?"
        - "İlk prompt'u kim yazıyor?"
      explain: "Modüle göre geri kalan her şey durma koşulundan çıkar. Yanlış kurulursa döngü ya iş bitmeden durur ya da gereğinden uzun çalışıp fazla maliyet çıkarır."
    fa:
      question: "توی loop engineering، کل طراحی از کدوم یک سؤال نتیجه می‌شه؟"
      options:
        - "کدوم مدل agent رو اجرا می‌کنه؟"
        - "stop condition چیه؟"
        - "agent چه tool‌هایی می‌تونه صدا بزنه؟"
        - "چه کسی اولین prompt رو می‌نویسه؟"
      explain: "ماژول می‌گه بقیه‌ی چیزها از stop condition نتیجه می‌شن. اگه این شرط غلط باشه، loop یا زودتر از موعد می‌ایسته، یا اون‌قدر ادامه پیدا می‌کنه که هزینه‌ش بالا بره."
  - answer: 2
    en:
      question: "In the verification loop, the /goal command in Claude Code has a goal and a cap on the number of tries. Why is the cap necessary?"
      options:
        - "It tells the grader which criteria to check."
        - "It stops the context window from filling up."
        - "It makes the loop stop when success is impossible."
        - "It decides when a clock starts the next run."
      explain: "A loop whose only stop condition is success does not stop when success is impossible. The cap gives the loop a second way to stop."
    tr:
      question: "Doğrulama döngüsünde (verification loop) Claude Code'un /goal komutunun bir hedefi ve bir deneme üst sınırı var. Bu üst sınır neden gerekli?"
      options:
        - "Grader'a hangi kriterleri kontrol edeceğini söylüyor."
        - "Context window'un dolmasını önlüyor."
        - "Başarı imkânsız hâle geldiğinde loop'u durduruyor."
        - "Bir saat, bir sonraki çalışmanın ne zaman başlayacağına karar veriyor."
      explain: "Tek durma koşulu başarı olan bir loop, başarı imkânsız olduğunda durmaz. Üst sınır (cap) ise loop'a ikinci bir durma yolu verir."
    fa:
      question: "توی verification loop، دستور /goal توی Claude Code یه هدف داره و یه سقف برای تعداد تلاش‌ها. این سقف چرا لازمه؟"
      options:
        - "به grader می‌گه کدوم معیارها رو چک کنه."
        - "نمی‌ذاره context window پر بشه."
        - "وقتی موفقیت غیرممکن باشه، loop رو متوقف می‌کنه."
        - "تعیین می‌کنه کی یه clock اجرای بعدی رو شروع کنه."
      explain: "loop‌ای که تنها شرط توقفش موفقیته، وقتی موفقیت غیرممکن باشه متوقف نمی‌شه. سقف به loop یه راه دوم برای توقف می‌ده."
  - answer: 0
    en:
      question: "What is the most important rule of the Ralph loop?"
      options:
        - "Each iteration does one task from the plan, then exits."
        - "Each iteration works through the whole backlog at once."
        - "Each iteration keeps the context from the pass before."
        - "Each iteration waits for a person to accept the result."
      explain: "Ralph does one task per loop, and each pass starts with a fresh context window. The state lives on disk, not in the window."
    tr:
      question: "Ralph loop'un en önemli kuralı nedir?"
      options:
        - "Her tur, plandan tek bir görev yapar ve sonra çıkar."
        - "Her tur, bütün backlog'u tek seferde işler."
        - "Her tur, bir önceki geçişin context'ini korur."
        - "Her tur, sonucun bir insan tarafından kabul edilmesini bekler."
      explain: "Ralph her döngüde tek bir görev yapar ve her geçiş temiz bir context penceresiyle başlar. Durum pencerede değil, diskte tutulur."
    fa:
      question: "مهم‌ترین قاعده‌ی Ralph loop چیه؟"
      options:
        - "هر iteration یه task از plan رو انجام می‌ده، بعد خارج می‌شه."
        - "هر iteration کل backlog رو یک‌جا جلو می‌بره."
        - "هر iteration context دور قبل رو نگه می‌داره."
        - "هر iteration منتظر می‌مونه تا یه آدم نتیجه رو قبول کنه."
      explain: "Ralph توی هر loop یه task انجام می‌ده، و هر دور با یه context window تازه شروع می‌شه. state توی window نیست، روی دیسکه."
  - answer: 3
    en:
      question: "What makes a dynamic workflow different from an agent team?"
      options:
        - "A workflow uses one agent, and a team uses many."
        - "A workflow waits for a person to press enter each turn."
        - "A workflow keeps its results in a shared task list."
        - "A workflow puts the plan in a script, not in an agent."
      explain: "In a workflow, the script decides what runs next and holds the intermediate results. The shared task list belongs to agent teams."
    tr:
      question: "Dinamik workflow'u agent team'den ayıran şey nedir?"
      options:
        - "Workflow tek bir agent kullanır, team ise birçok agent kullanır."
        - "Workflow her turda bir insanın enter tuşuna basmasını bekler."
        - "Workflow sonuçlarını ortak bir görev listesinde tutar."
        - "Workflow planı bir agent'ta değil, bir betikte tutar."
      explain: "Workflow'da sıradaki işi betik belirler ve ara sonuçları da betik tutar. Ortak görev listesi ise agent team'lere aittir."
    fa:
      question: "چی باعث می‌شه dynamic workflow با agent team فرق داشته باشه؟"
      options:
        - "workflow از یه agent استفاده می‌کنه، و team از چندتا."
        - "workflow توی هر نوبت منتظر می‌مونه تا یه آدم Enter بزنه."
        - "workflow نتیجه‌هاش رو توی یه فهرست مشترک task نگه می‌داره."
        - "workflow برنامه‌ش رو توی یه script می‌ذاره، نه توی یه agent."
      explain: "توی workflow، script تعیین می‌کنه بعدش چی اجرا بشه و نتیجه‌های میانی رو هم خودش نگه می‌داره. فهرست مشترک task مال agent teams هست."
