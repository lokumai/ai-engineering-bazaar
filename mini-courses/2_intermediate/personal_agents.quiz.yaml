# Quick quiz: Personal Agents. Reinforcement, not assessment.
questions:
  - answer: 1
    en:
      question: "Which of these makes a personal agent different from a coding agent?"
      options:
        - "It uses a larger and stronger model than a coding agent uses."
        - "It keeps a memory on disk that grows across all your conversations."
        - "It works inside one repository and stops when you close the terminal."
        - "It forgets each conversation, so it starts every session with no history."
      explain: "A personal agent keeps a lifelong memory on disk that keeps growing. The model is not the difference: the module says none of the four differences is about the model."
    tr:
      question: "Aşağıdakilerden hangisi bir personal agent'ı bir coding agent'tan ayırır?"
      options:
        - "Bir coding agent'ın kullandığından daha büyük ve daha güçlü bir model kullanır."
        - "Bütün konuşmalarının boyunca büyüyen bir hafızayı diskte tutar."
        - "Tek bir repository'nin içinde çalışır ve terminali kapattığında durur."
        - "Her konuşmayı unutur, bu yüzden her session'a hiç geçmişi olmadan başlar."
      explain: "Bir personal agent, diskte sürekli büyüyen ömür boyu bir hafıza tutar. Asıl fark model değildir: modüle göre dört farkın hiçbiri modelle ilgili değil."
    fa:
      question: "کدوم یکی از این‌ها باعث می‌شه یه personal agent با یه coding agent فرق داشته باشه؟"
      options:
        - "یه مدل بزرگ‌تر و قوی‌تر از مدل coding agent استفاده می‌کنه."
        - "یه memory روی دیسک نگه می‌داره که با همه‌ی گفتگوهات بزرگ‌تر می‌شه."
        - "داخل یه repository کار می‌کنه و وقتی ترمینال رو می‌بندی، کارش هم تموم می‌شه."
        - "هر گفتگو رو فراموش می‌کنه، پس هر session رو بدون هیچ سابقه‌ای شروع می‌کنه."
      explain: "یه personal agent یه memory مادام‌العمر روی دیسک نگه می‌داره که همیشه داره بزرگ‌تر می‌شه. فرق اصلی به مدل برنمی‌گرده: ماژول گفته هیچ‌کدوم از اون چهار تفاوت ربطی به مدل نداره."

  - answer: 3
    en:
      question: "SOUL.md is a system prompt kept as a file. Why is it a security risk?"
      options:
        - "It stores your passwords and API keys as plain text in the file."
        - "It holds the model weights, so an attacker can copy the whole model."
        - "The agent posts its full content to Moltbook each time it logs in."
        - "It is writable, so anything that writes to it can change who the agent is."
      explain: "The agent reads SOUL.md every time it wakes up and follows it. Anything that can write to the file changes the agent permanently, and the change is silent."
    tr:
      question: "SOUL.md, dosya olarak tutulan bir system prompt'tur. Peki neden bir güvenlik riski?"
      options:
        - "Şifrelerini ve API anahtarlarını dosyanın içinde düz metin olarak saklar."
        - "Model weight'lerini tutar, yani bir saldırgan bütün modeli kopyalayabilir."
        - "Agent her giriş yaptığında tüm içeriğini Moltbook'a gönderi olarak atar."
        - "Yazılabilir, yani ona yazabilen her şey agent'ın kim olduğunu değiştirebilir."
      explain: "Agent her uyandığında SOUL.md'yi okur ve ona göre davranır. Dosyaya yazabilen her şey agent'ı kalıcı olarak değiştirir ve bu değişiklik fark edilmez."
    fa:
      question: "SOUL.md یه system prompt‌ه که به شکل فایل نگه داشته شده. چرا این فایل ریسک امنیتی داره؟"
      options:
        - "رمزها و API key‌هات رو داخل فایل، به شکل متن ساده نگه می‌داره."
        - "model weights رو توش نگه می‌داره، پس یه مهاجم می‌تونه کل مدل رو کپی کنه."
        - "هر بار که agent لاگین می‌کنه، کل محتواش رو توی Moltbook پست می‌کنه."
        - "قابل نوشتنه، پس هر چیزی که بتونه توش بنویسه، می‌تونه تغییر بده که agent کیه."
      explain: "agent هر بار که بیدار می‌شه SOUL.md رو می‌خونه و بهش عمل می‌کنه. هر چیزی که بتونه توی این فایل بنویسه، agent رو برای همیشه عوض می‌کنه، و این تغییر بی‌صداست."

  - answer: 2
    en:
      question: "When does Hermes Agent fit better than OpenClaw?"
      options:
        - "When the problem is orchestration across many different channels."
        - "When you want a ready-made skill from the ClawHub marketplace."
        - "When the problem is repetitive work that should improve on its own."
        - "When you need a stronger model than OpenClaw can run."
      explain: "Hermes writes its own skills from patterns in your requests, so repetitive work improves over time. Both tools run the same models, so the model is not the difference."
    tr:
      question: "Hermes Agent, OpenClaw'dan ne zaman daha uygundur?"
      options:
        - "Problem birçok farklı kanal genelinde orkestrasyon gerektirdiğinde."
        - "ClawHub marketplace'inden hazır bir skill istediğinde."
        - "Problem, kendiliğinden iyileşmesi gereken tekrarlayan bir iş olduğunda."
        - "OpenClaw'ın çalıştıramadığı daha güçlü bir modele ihtiyaç duyduğunda."
      explain: "Hermes, isteklerindeki örüntülerden kendi skill'lerini yazar; bu yüzden tekrarlayan iş zamanla iyileşir. İki araç da aynı modelleri çalıştırır, yani fark model değildir."
    fa:
      question: "Hermes Agent کی بهتر از OpenClaw جواب می‌ده؟"
      options:
        - "وقتی مسئله، orchestration بین کلی کانال مختلفه."
        - "وقتی می‌خوای یه skill آماده از marketplace ClawHub بگیری."
        - "وقتی مسئله، کار تکراریه که خودش باید کم‌کم بهتر بشه."
        - "وقتی به یه مدل قوی‌تر از چیزی که OpenClaw می‌تونه اجرا کنه نیاز داری."
      explain: "Hermes از الگوهای درخواست‌های تو، skill‌های خودش رو می‌نویسه، پس کار تکراری با گذشت زمان بهتر می‌شه. هر دو ابزار همون مدل‌ها رو اجرا می‌کنن، پس مدل تفاوت اصلی نیست."

  - answer: 0
    en:
      question: "What did Moltbook, the social network for agents, show?"
      options:
        - "Agents that read each other's posts spread instructions that no owner approved."
        - "Agents stop posting and replying when no human gives them a prompt."
        - "Agents never challenge a risky post unless a human tells them to."
        - "Agents keep a consistent personality only when a human watches them."
      explain: "A study found that 18.4% of posts told another agent to do something. This is indirect prompt injection, and it happened by accident at a large scale."
    tr:
      question: "Agent'lar için kurulmuş bir sosyal ağ olan Moltbook ne gösterdi?"
      options:
        - "Birbirlerinin gönderilerini okuyan agent'ların, hiçbir sahibinin onaylamadığı talimatları yaydığını."
        - "Hiçbir insan prompt vermediğinde agent'ların gönderi atmayı ve yanıt vermeyi bıraktığını."
        - "Agent'ların, bir insan söylemedikçe riskli bir gönderiye asla itiraz etmediğini."
        - "Agent'ların tutarlı bir kişiliği yalnızca bir insan izlediğinde koruduğunu."
      explain: "Bir çalışma, gönderilerin %18.4'ünün başka bir agent'a bir şey yapmasını söylediğini buldu. Bu, büyük ölçekte ve kazara yaşanan bir dolaylı prompt injection'dır."
    fa:
      question: "Moltbook، شبکه‌ی اجتماعی agent‌ها، چی رو نشون داد؟"
      options:
        - "agent‌هایی که پست‌های همدیگه رو می‌خونن، دستورهایی رو پخش می‌کنن که هیچ صاحبی تأییدشون نکرده."
        - "وقتی هیچ آدمی بهشون prompt نمی‌ده، agent‌ها دیگه پست نمی‌ذارن و جواب هم نمی‌دن."
        - "agent‌ها هیچ‌وقت یه پست پرخطر رو زیر سؤال نمی‌برن، مگه اینکه یه آدم بهشون بگه."
        - "agent‌ها فقط وقتی یه آدم زیر نظرشونه، شخصیت ثابت‌شون رو حفظ می‌کنن."
      explain: "یه مطالعه نشون داد که 18.4% از پست‌ها به یه agent دیگه می‌گفتن یه کاری انجام بده. این همون indirect prompt injection هست، که خیلی بزرگ و تصادفی اتفاق افتاد."

  - answer: 1
    en:
      question: "What does the module advise to reduce the risk of a personal agent?"
      options:
        - "Give it your main accounts, so it can act fully for you."
        - "Run it in a container and give it separate accounts, not your main ones."
        - "Keep your credentials in a file it can read, so it can log in."
        - "Trust OpenClaw 2.0, because version 2.0 made the agent fully safe."
      explain: "The access that makes the agent useful is the same access that makes it dangerous. OpenClaw 2.0 is better, but its stored credentials are not encrypted by default."
    tr:
      question: "Modül, bir personal agent'ın riskini azaltmak için ne öneriyor?"
      options:
        - "Ona ana hesaplarını ver, böylece senin adına tam olarak hareket edebilsin."
        - "Onu bir container içinde çalıştır ve ona ana hesaplarını değil, ayrı hesaplar ver."
        - "Kimlik bilgilerini okuyabildiği bir dosyada tut, böylece giriş yapabilsin."
        - "OpenClaw 2.0'a güven, çünkü 2.0 sürümü agent'ı tamamen güvenli hale getirdi."
      explain: "Agent'ı faydalı kılan erişim, onu tehlikeli kılan erişimle aynıdır. OpenClaw 2.0 daha iyidir, ama saklanan kimlik bilgileri varsayılan olarak şifrelenmiyor."
    fa:
      question: "ماژول برای کم کردن ریسک یه personal agent چی پیشنهاد می‌کنه؟"
      options:
        - "حساب‌های اصلی‌ت رو بهش بده، تا کاملاً به جات کار کنه."
        - "داخل یه container اجراش کن و براش حساب‌های جدا بساز، نه حساب‌های اصلی‌ت."
        - "credential‌هات رو توی فایلی بذار که بتونه بخونه، تا بتونه لاگین کنه."
        - "به OpenClaw 2.0 اعتماد کن، چون نسخه‌ی 2.0 agent رو کاملاً امن کرده."
      explain: "همون دسترسی‌ای که agent رو مفید می‌کنه، همونیه که خطرناکش می‌کنه. OpenClaw 2.0 بهتره، ولی credential‌های ذخیره‌شده‌ش به‌طور پیش‌فرض رمزگذاری نشدن."
