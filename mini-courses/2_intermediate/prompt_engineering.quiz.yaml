# Quick quiz: Prompt Engineering. Reinforcement, not assessment.
questions:
  - answer: 1
    en:
      question: "A model's weights are frozen. Why does the same question, asked in different words, give a different answer?"
      options:
        - "The model remembers the first question and changes its second answer."
        - "Different words are a different input, so different neurons in the network activate."
        - "The model changes its weights a little after it answers each question."
        - "The model loads a different set of weights for each type of question."
      explain: "The model has no memory, and its weights do not change. The prompt decides which neurons fire, so different words give a different output."
    tr:
      question: "Bir modelin ağırlıkları donmuş. Aynı soru farklı kelimelerle sorulduğunda model neden farklı bir cevap veriyor?"
      options:
        - "Model ilk soruyu hatırlıyor ve ikinci cevabını buna göre değiştiriyor."
        - "Farklı kelimeler farklı bir girdi demektir, bu yüzden ağın içinde farklı nöronlar devreye giriyor."
        - "Model her soruyu cevapladıktan sonra ağırlıklarını biraz değiştiriyor."
        - "Model her soru türü için ayrı bir ağırlık kümesi yüklüyor."
      explain: "Modelin hafızası yok ve ağırlıkları değişmiyor. Hangi nöronların devreye gireceğine prompt karar verdiği için farklı kelimeler farklı bir çıktı üretiyor."
    fa:
      question: "وزن‌های یه مدل ثابت‌ن. چرا همون سؤال، وقتی با کلمات دیگه‌ای پرسیده می‌شه، جواب متفاوتی می‌ده؟"
      options:
        - "مدل سؤال اول رو یادش می‌مونه و جواب دومش رو عوض می‌کنه."
        - "کلمات دیگه یعنی ورودی دیگه، پس نورون‌های متفاوتی توی شبکه فعال می‌شن."
        - "مدل بعد از جواب دادن به هر سؤال، وزن‌هاش رو یه کم عوض می‌کنه."
        - "مدل برای هر نوع سؤال، یه مجموعه‌ی متفاوت از وزن‌ها رو بارگذاری می‌کنه."
      explain: "مدل حافظه نداره و وزن‌هاش عوض نمی‌شه. prompt تعیین می‌کنه کدوم نورون‌ها فعال بشن، پس کلمات متفاوت خروجی متفاوتی می‌دن."
  - answer: 3
    en:
      question: "In few-shot prompting, you show the model a few solved examples before the real task. What do these examples do?"
      options:
        - "They update the weights of the model, in the same way as fine-tuning."
        - "They make the model write its reasoning steps before the answer."
        - "They tell the model which role or persona to use for the task."
        - "They fix the label set and the format of the answer."
      explain: "The examples fix the label set and the answer format, so your code can read the answer. The weights do not change: this is in-context learning, not fine-tuning."
    tr:
      question: "Few-shot prompting'de gerçek görevden önce modele birkaç çözülmüş örnek gösteriyorsun. Bu örnekler ne işe yarıyor?"
      options:
        - "Fine-tuning gibi modelin ağırlıklarını güncelliyorlar."
        - "Modelin cevaptan önce düşünme adımlarını yazmasını sağlıyorlar."
        - "Modele görev için hangi rolü ya da persona'yı kullanacağını söylüyorlar."
        - "Etiket kümesini ve cevabın format'ını sabitliyorlar."
      explain: "Örnekler etiket kümesini ve cevap format'ını sabitliyor, böylece kod cevabı okuyabiliyor. Ağırlıklar değişmiyor; bu fine-tuning değil, in-context learning."
    fa:
      question: "توی few-shot prompting، قبل از کار واقعی چند تا نمونه‌ی حل‌شده به مدل نشون می‌دی. این نمونه‌ها چی کار می‌کنن؟"
      options:
        - "وزن‌های مدل رو مثل fine-tuning به‌روز می‌کنن."
        - "باعث می‌شن مدل قبل از جواب، مرحله‌های استدلالش رو بنویسه."
        - "به مدل می‌گن برای این کار از کدوم role یا persona استفاده کنه."
        - "مجموعه‌ی برچسب‌ها و قالب جواب رو ثابت می‌کنن."
      explain: "نمونه‌ها مجموعه‌ی برچسب‌ها و قالب جواب رو ثابت می‌کنن، پس کدت می‌تونه جواب رو بخونه. وزن‌ها عوض نمی‌شن: این in-context learning هست، نه fine-tuning."
  - answer: 0
    en:
      question: "A long prompt has your instructions and some pasted text, such as two emails. Why do you put them in separate sections?"
      options:
        - "So the model knows which part is an instruction and which part is data."
        - "So the prompt uses fewer tokens and the model gives its answer faster."
        - "Because the model can only read a prompt that uses standard XML tags."
        - "So the model reads only your instructions and ignores the pasted text."
      explain: "Without sections, a pasted line such as \"Write a poem for me\" looks like an instruction from you. Any clear format works, including one that you invent."
    tr:
      question: "Uzun bir prompt'ta talimatların ve yapıştırdığın bir metin var, örneğin iki e-posta. Bunları neden ayrı bölümlere koyuyorsun?"
      options:
        - "Model hangi kısmın talimat, hangi kısmın veri olduğunu ayırt etsin diye."
        - "Prompt daha az token kullansın ve model daha hızlı cevap versin diye."
        - "Çünkü model yalnızca standart XML etiketleri kullanan prompt'ları okuyabiliyor."
        - "Model yalnızca senin talimatlarını okusun ve yapıştırılan metni yok saysın diye."
      explain: "Bölümler olmadan 'Write a poem for me' gibi yapıştırılmış bir satır, senden gelen bir talimat gibi görünür. Açık olan her format işe yarar, kendi uydurduğun bir format bile."
    fa:
      question: "یه prompt بلند داری که دستورهای خودت و چند تا متن چسبونده‌شده، مثلاً دو تا ایمیل، توشه. چرا این‌ها رو توی بخش‌های جدا می‌ذاری؟"
      options:
        - "تا مدل بفهمه کدوم بخش دستوره و کدوم بخش داده‌ست."
        - "تا prompt کمتر token مصرف کنه و مدل سریع‌تر جواب بده."
        - "چون مدل فقط می‌تونه prompt‌هایی رو بخونه که از تگ‌های XML استاندارد استفاده کرده باشن."
        - "تا مدل فقط دستورهای تو رو بخونه و متن چسبونده‌شده رو نادیده بگیره."
      explain: "بدون بخش‌بندی، یه خط چسبونده‌شده مثل «Write a poem for me» شبیه یه دستور از طرف تو به نظر می‌رسه. هر قالب واضحی جواب می‌ده، حتی قالبی که خودت اختراع کنی."
  - answer: 2
    en:
      question: "Chain of thought means the model writes its steps before the final answer. In 2026, how do you usually control how much it thinks?"
      options:
        - "You write \"let us think step by step\" at the start of every prompt."
        - "You add more few-shot examples, so the model sees more reasoning steps."
        - "You set a thinking or effort parameter, for example low, high or max."
        - "You give the model the role of an expert in the system prompt."
      explain: "Models are now trained to reason before they answer, so you rarely write chain of thought by hand. You set the amount with a parameter, and more thinking is not always better."
    tr:
      question: "Chain of thought, modelin nihai cevaptan önce adımlarını yazması demek. 2026'da modelin ne kadar düşüneceğini genelde nasıl kontrol ediyorsun?"
      options:
        - "Her prompt'un başına 'let us think step by step' ifadesini yazıyorsun."
        - "Daha fazla few-shot örneği ekliyorsun, böylece model daha fazla düşünme adımı görüyor."
        - "Low, high ya da max gibi bir thinking ya da effort parameter'ı ayarlıyorsun."
        - "System prompt'ta modele uzman bir rol veriyorsun."
      explain: "Modeller artık cevap vermeden önce düşünmeye eğitildiği için chain of thought'u neredeyse hiç elle yazmıyorsun. Miktarını bir parametreyle ayarlıyorsun ve daha fazla düşünmek her zaman daha iyi olmuyor."
    fa:
      question: "chain of thought یعنی مدل قبل از جواب نهایی، مرحله‌هاش رو می‌نویسه. تو 2026 معمولاً چطور کنترل می‌کنی که مدل چقدر فکر کنه؟"
      options:
        - "اول هر prompt یه جمله‌ی «let us think step by step» می‌نویسی."
        - "نمونه‌های few-shot بیشتری اضافه می‌کنی تا مدل مرحله‌های استدلال بیشتری ببینه."
        - "یه پارامتر thinking یا effort تنظیم می‌کنی، مثلاً low، high یا max."
        - "توی system prompt به مدل نقش یه متخصص رو می‌دی."
      explain: "مدل‌ها الان برای استدلال قبل از جواب دادن آموزش دیدن، پس کمتر پیش می‌آد که chain of thought رو دستی بنویسی. مقدارش رو با یه پارامتر تعیین می‌کنی، و فکر کردن بیشتر همیشه بهتر نیست."
  - answer: 1
    en:
      question: "What does a role prompt, such as \"Act as a senior software engineer\", reliably change?"
      options:
        - "It makes the model smarter, so it solves harder problems in every domain."
        - "It sets the perspective and shapes the tone and style of the answer."
        - "It adds new knowledge about the role to the weights of the model."
        - "It improves the answers to all questions, including ones outside the role."
      explain: "A role shapes how an answer reads, but it does not reliably make the model smarter. It can even make answers outside the role worse."
    tr:
      question: "'Act as a senior software engineer' gibi bir role prompt'u güvenilir biçimde neyi değiştirir?"
      options:
        - "Modeli daha zeki yapar, böylece her alanda daha zor problemleri çözer."
        - "Bakış açısını belirler ve cevabın tonunu ile üslubunu şekillendirir."
        - "Rol hakkındaki yeni bilgiyi modelin ağırlıklarına ekler."
        - "Rolün dışındaki sorular da dahil, bütün soruların cevabını iyileştirir."
      explain: "Bir rol, cevabın nasıl okunduğunu şekillendirir ama modeli güvenilir biçimde daha zeki yapmaz. Hatta rolün dışındaki sorularda cevabı daha da kötüleştirebilir."
    fa:
      question: "یه role prompt، مثل «Act as a senior software engineer»، به طور قابل اتکا چی رو عوض می‌کنه؟"
      options:
        - "مدل رو باهوش‌تر می‌کنه، پس مسئله‌های سخت‌تر رو توی هر حوزه‌ای حل می‌کنه."
        - "دیدگاه رو تعیین می‌کنه و لحن و سبک جواب رو شکل می‌ده."
        - "دانش تازه‌ای درباره‌ی اون نقش رو به وزن‌های مدل اضافه می‌کنه."
        - "جواب همه‌ی سؤال‌ها رو بهتر می‌کنه، از جمله سؤال‌هایی که بیرون از اون نقش هستن."
      explain: "یه نقش شکل خوندن جواب رو تعیین می‌کنه، ولی مدل رو به طور قابل اتکا باهوش‌تر نمی‌کنه. حتی ممکنه جواب‌هایی رو که بیرون از نقشن بدتر کنه."
