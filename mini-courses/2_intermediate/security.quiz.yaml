# Quick quiz: Security. Reinforcement, not assessment.
questions:
  - answer: 1
    en:
      question: "What does a white-box attacker have that a black-box attacker does not have?"
      options:
        - "A copy of the system prompt of the product."
        - "The model itself, including all of its weights."
        - "A list of the topics that the model refuses."
        - "A password for the servers of the provider."
      explain: "With the weights, the attacker can search for the exact tokens that push the model hardest. Attacks on your own product are almost always black box, because it is a text box."
    tr:
      question: "Bir white-box saldırganın elinde olup bir black-box saldırganın elinde olmayan şey nedir?"
      options:
        - "Ürünün system prompt'unun bir kopyası."
        - "Modelin kendisi, bütün weight'leri dahil."
        - "Modelin reddettiği konuların bir listesi."
        - "Sağlayıcının sunucuları için bir şifre."
      explain: "Weight'ler elindeyse, saldırgan modeli en çok iten token'ları tam olarak arayabilir. Senin ürününe yapılan saldırılar neredeyse her zaman black box'tır, çünkü ürünün bir metin kutusudur."
    fa:
      question: "یک مهاجم white-box چه چیزی دارد که یک مهاجم black-box ندارد؟"
      options:
        - "یک کپی از system prompt محصول."
        - "خود مدل، شامل تمام weight‌هایش."
        - "فهرستی از موضوع‌هایی که مدل امتناع می‌کند."
        - "یک رمز عبور برای سرورهای ارائه‌دهنده."
      explain: "با داشتن weight‌ها، مهاجم می‌تواند دقیقاً token‌هایی را پیدا کند که مدل را بیشتر از همه تحت فشار قرار می‌دهند. حمله به محصول خودتان تقریباً همیشه black box است، چون محصول شما یک جعبه‌ی متن است."
  - answer: 2
    en:
      question: "Which attack defeats the safety training of the model itself?"
      options:
        - "Prompt injection"
        - "Prompt leaking"
        - "Jailbreaking"
        - "Indirect prompt injection"
      explain: "Jailbreaking gets past the refusals of the model by rewording the request, like the DAN example. Prompt injection redirects behaviour, and prompt leaking exposes the system prompt."
    tr:
      question: "Hangi saldırı, modelin güvenlik eğitiminin (safety training) kendisini yener?"
      options:
        - "Prompt injection"
        - "Prompt leaking"
        - "Jailbreaking"
        - "Indirect prompt injection"
      explain: "Jailbreaking, isteği farklı kelimelerle yazarak modelin ret cevaplarını (refusal) geçer, DAN örneğindeki gibi. Prompt injection davranışı yönlendirir, prompt leaking ise system prompt'u açığa çıkarır."
    fa:
      question: "کدام حمله، خود آموزش ایمنی مدل را شکست می‌دهد؟"
      options:
        - "Prompt injection"
        - "Prompt leaking"
        - "Jailbreaking"
        - "Indirect prompt injection"
      explain: "Jailbreaking با بازنویسی درخواست، از امتناع‌های مدل عبور می‌کند، مثل مثال DAN. Prompt injection رفتار را منحرف می‌کند، و prompt leaking، system prompt را فاش می‌کند."
  - answer: 0
    en:
      question: "A system prompt has higher priority than a user message by design. Why does prompt injection still work?"
      options:
        - "The model reads one stream of text, and persuasive text can outrank the system prompt."
        - "The system prompt sits in a protected region of memory, and the attacker unlocks it."
        - "The provider gives every user message a higher priority than the system prompt."
        - "The attacker breaks a permission check that protects the system prompt in memory."
      explain: "The system prompt is text in the same stream as the user message, not a protected region of memory. So the attacker does not break any permission check."
    tr:
      question: "Bir system prompt, tasarım gereği bir user mesajından daha yüksek önceliğe sahiptir. Prompt injection neden yine de işler?"
      options:
        - "Model tek bir metin akışı okur, ve ikna edici bir metin system prompt'tan üstün gelebilir."
        - "System prompt korunan bir hafıza (memory) bölgesinde durur, ve saldırgan onun kilidini açar."
        - "Sağlayıcı her user mesajına system prompt'tan daha yüksek bir öncelik verir."
        - "Saldırgan, system prompt'u hafızada koruyan bir izin kontrolünü (permission check) kırar."
      explain: "System prompt korunan bir hafıza (memory) bölgesi değildir, user mesajıyla aynı akıştaki bir metindir. Bu yüzden saldırgan hiçbir izin kontrolünü (permission check) kırmaz."
    fa:
      question: "یک system prompt بنا بر طراحی اولویت بالاتری از یک پیام user دارد. پس چرا prompt injection باز هم کار می‌کند؟"
      options:
        - "مدل یک جریان متن را می‌خواند، و متن قانع‌کننده می‌تواند بر system prompt غلبه کند."
        - "system prompt در یک ناحیه‌ی محافظت‌شده‌ی حافظه (memory) است، و مهاجم قفل آن را باز می‌کند."
        - "ارائه‌دهنده به هر پیام user اولویتی بالاتر از system prompt می‌دهد."
        - "مهاجم یک permission check را می‌شکند که system prompt را در حافظه (memory) محافظت می‌کند."
      explain: "system prompt متنی در همان جریان پیام user است، نه یک ناحیه‌ی محافظت‌شده‌ی حافظه (memory). پس مهاجم هیچ permission check را نمی‌شکند."
  - answer: 3
    en:
      question: "What is a guardrail, and where does it sit?"
      options:
        - "A rule inside the weights of the model, added during safety training."
        - "A single check after the model, because the input cannot carry an attack."
        - "An extra line in the system prompt that asks the model to stay safe."
        - "A check that runs outside the model, before the model or after it."
      explain: "A guardrail runs outside the model, on the way in or on the way out. Because it is not model behaviour, it still works when an attacker persuades the model."
    tr:
      question: "Guardrail nedir, ve nerede durur?"
      options:
        - "Güvenlik eğitimi (safety training) sırasında modelin weight'lerine eklenen bir kural."
        - "Modelden sonra tek bir kontrol, çünkü input bir saldırı taşıyamaz."
        - "System prompt'ta modelden güvenli kalmasını isteyen ek bir satır."
        - "Modelin dışında, modelden önce ya da sonra çalışan bir kontrol."
      explain: "Guardrail modelin dışında çalışır, girişte ya da çıkışta. Model davranışı olmadığı için, bir saldırgan modeli ikna etse bile yine de çalışır."
    fa:
      question: "guardrail چیست، و کجا قرار می‌گیرد؟"
      options:
        - "یک قانون درون weight‌های مدل که در زمان آموزش ایمنی (safety training) اضافه شده است."
        - "یک کنترل تنها بعد از مدل، چون input نمی‌تواند حمله‌ای را حمل کند."
        - "یک خط اضافه در system prompt که از مدل می‌خواهد امن بماند."
        - "یک کنترل که بیرون از مدل اجرا می‌شود، قبل از مدل یا بعد از آن."
      explain: "guardrail بیرون از مدل اجرا می‌شود، در مسیر input یا output. چون رفتار مدل نیست، حتی وقتی مهاجم مدل را متقاعد می‌کند، باز هم کار می‌کند."
  - answer: 1
    en:
      question: "What is red teaming?"
      options:
        - "Waiting for real attackers and recording what they try."
        - "Attacking your own system on purpose, often with a tool."
        - "Putting a guard model in front of every request."
        - "Training the model again on examples of known attacks."
      explain: "You cannot defend against attacks you have not tried. Tools such as promptfoo do the attacking, and the attack success rate is the number to watch over time."
    tr:
      question: "Red teaming nedir?"
      options:
        - "Gerçek saldırganları beklemek ve ne denediklerini kaydetmek."
        - "Kendi sistemine bilerek saldırmak, çoğu zaman bir araçla (tool)."
        - "Her isteğin önüne bir guard model koymak."
        - "Modeli bilinen saldırı örnekleriyle yeniden eğitmek."
      explain: "Denemediğin saldırılara karşı savunma yapamazsın. Saldırıyı promptfoo gibi araçlar (tool) senin yerine yapar, ve zaman içinde izlenecek sayı attack success rate'tir."
    fa:
      question: "Red teaming چیست؟"
      options:
        - "منتظر ماندن برای مهاجمان واقعی و ثبت آنچه امتحان می‌کنند."
        - "عمداً به سیستم خودتان حمله کردن، اغلب با یک ابزار."
        - "گذاشتن یک guard model جلوی هر درخواست."
        - "آموزش دوباره‌ی مدل با نمونه‌هایی از حمله‌های شناخته‌شده."
      explain: "نمی‌توانید در برابر حمله‌هایی که امتحان نکرده‌اید دفاع کنید. ابزارهایی مثل promptfoo حمله را انجام می‌دهند، و attack success rate عددی است که باید در طول زمان زیر نظر داشته باشید."
