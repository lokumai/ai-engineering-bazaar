# Quick quiz: Security. Reinforcement, not assessment.
questions:
  - answer: 1
    en:
      question: "What does a white-box attacker have that a black-box attacker does not have?"
      options:
        - "A copy of the system prompt of the product."
        - "The model itself, including all of its weights."
        - "A list of the topics that the model refuses."
        - "A password for the servers of the provider."
      explain: "With the weights, the attacker can search for the exact tokens that push the model hardest. Attacks on your own product are almost always black box, because it is a text box."
    tr:
      question: "Bir white-box saldırganın, black-box saldırganın sahip olmadığı ne vardır?"
      options:
        - "Ürünün system prompt'unun bir kopyası."
        - "Modelin kendisi, bütün weight'leriyle birlikte."
        - "Modelin reddettiği konuların bir listesi."
        - "Sağlayıcının sunucuları için bir parola."
      explain: "Weight'lere sahip olan saldırgan, modeli en çok iten token'ları tam olarak arayabilir. Kendi ürününe yapılan saldırıların neredeyse hepsi black box olur, çünkü ürün bir metin kutusudur."
    fa:
      question: "یه مهاجم white-box چی داره که یه مهاجم black-box نداره؟"
      options:
        - "یه کپی از system prompt محصول."
        - "خود مدل، با همه‌ی weight‌هاش."
        - "فهرستی از موضوع‌هایی که مدل ازشون امتناع می‌کنه."
        - "یه رمز عبور برای سرورهای ارائه‌دهنده."
      explain: "با داشتن weight‌ها، مهاجم می‌تونه دقیقاً token‌هایی رو پیدا کنه که مدل رو بیشتر از همه به سمت یه جواب می‌برن. حمله به محصول خودت تقریباً همیشه black box هست، چون محصولت یه جعبه‌ی متنه."
  - answer: 2
    en:
      question: "Which attack defeats the safety training of the model itself?"
      options:
        - "Prompt injection"
        - "Prompt leaking"
        - "Jailbreaking"
        - "Indirect prompt injection"
      explain: "Jailbreaking gets past the refusals of the model by rewording the request, like the DAN example. Prompt injection redirects behaviour, and prompt leaking exposes the system prompt."
    tr:
      question: "Modelin kendi güvenlik eğitimini (safety training) hangi saldırı etkisiz bırakır?"
      options:
        - "Prompt injection"
        - "Prompt leaking"
        - "Jailbreaking"
        - "Indirect prompt injection"
      explain: "Jailbreaking, isteği farklı kelimelerle yazarak modelin reddetmelerini (refusal) aşar, tıpkı DAN örneğindeki gibi. Prompt injection davranışı yönlendirir, prompt leaking ise system prompt'u açığa çıkarır."
    fa:
      question: "کدوم حمله خود آموزش ایمنی مدل رو دور می‌زنه؟"
      options:
        - "Prompt injection"
        - "Prompt leaking"
        - "Jailbreaking"
        - "Indirect prompt injection"
      explain: "Jailbreaking با بازنویسی درخواست، از امتناع‌های مدل رد می‌شه، مثل مثال DAN. Prompt injection رفتار مدل رو عوض می‌کنه، و prompt leaking هم system prompt رو لو می‌ده."
  - answer: 0
    en:
      question: "A system prompt has higher priority than a user message by design. Why does prompt injection still work?"
      options:
        - "The model reads one stream of text, and persuasive text can outrank the system prompt."
        - "The system prompt sits in a protected region of memory, and the attacker unlocks it."
        - "The provider gives every user message a higher priority than the system prompt."
        - "The attacker breaks a permission check that protects the system prompt in memory."
      explain: "The system prompt is text in the same stream as the user message, not a protected region of memory. So the attacker does not break any permission check."
    tr:
      question: "Bir system prompt, tasarım gereği bir kullanıcı mesajından daha yüksek önceliğe sahiptir. Peki prompt injection neden yine de işe yarar?"
      options:
        - "Model tek bir metin akışını okur ve ikna edici bir metin system prompt'un önüne geçebilir."
        - "System prompt, hafızada korunan bir bölgede durur ve saldırgan bu bölgenin kilidini açar."
        - "Sağlayıcı her kullanıcı mesajına system prompt'tan daha yüksek bir öncelik verir."
        - "Saldırgan, system prompt'u hafızada koruyan bir izin kontrolünü (permission check) kırar."
      explain: "System prompt, korunan bir hafıza bölgesi değildir. Kullanıcı mesajıyla aynı metin akışındaki bir metindir. Bu yüzden saldırgan hiçbir izin kontrolünü kırmaz."
    fa:
      question: "system prompt بنا بر طراحی از یه پیام user اولویت بالاتری داره. پس چرا prompt injection باز هم جواب می‌ده؟"
      options:
        - "مدل یه جریان متن رو می‌خونه، و یه متن قانع‌کننده می‌تونه از system prompt جلو بزنه."
        - "system prompt توی یه ناحیه‌ی محافظت‌شده‌ی حافظه (memory) قرار داره، و مهاجم قفلش رو باز می‌کنه."
        - "ارائه‌دهنده به هر پیام user یه اولویت بالاتر از system prompt می‌ده."
        - "مهاجم یه permission check رو می‌شکنه که system prompt رو توی حافظه (memory) محافظت می‌کنه."
      explain: "system prompt یه ناحیه‌ی محافظت‌شده‌ی حافظه (memory) نیست، بلکه متنیه توی همون جریانی که پیام user هم توشه. پس مهاجم هیچ permission check رو نمی‌شکنه."
  - answer: 3
    en:
      question: "What is a guardrail, and where does it sit?"
      options:
        - "A rule inside the weights of the model, added during safety training."
        - "A single check after the model, because the input cannot carry an attack."
        - "An extra line in the system prompt that asks the model to stay safe."
        - "A check that runs outside the model, before the model or after it."
      explain: "A guardrail runs outside the model, on the way in or on the way out. Because it is not model behaviour, it still works when an attacker persuades the model."
    tr:
      question: "Guardrail nedir ve nerede durur?"
      options:
        - "Güvenlik eğitimi (safety training) sırasında eklenmiş, modelin weight'leri içinde bir kural."
        - "Yalnızca modelden sonra çalışan tek bir kontrol, çünkü girdi bir saldırı taşıyamaz."
        - "System prompt'a eklenen, modelden güvenli kalmasını isteyen bir satır."
        - "Modelin dışında çalışan ve modelden önce ya da sonra devreye giren bir kontrol."
      explain: "Guardrail, girişte ya da çıkışta, modelin dışında çalışır. Model davranışı olmadığı için, bir saldırgan modeli ikna etse bile çalışmaya devam eder."
    fa:
      question: "guardrail چیه، و کجا قرار می‌گیره؟"
      options:
        - "یه قانون داخل weight‌های مدل که موقع آموزش ایمنی اضافه شده."
        - "یه کنترل تنها بعد از مدل، چون input نمی‌تونه حمله‌ای رو با خودش داشته باشه."
        - "یه خط اضافه توی system prompt که از مدل می‌خواد امن بمونه."
        - "یه کنترل که بیرون از مدل اجرا می‌شه، قبل از مدل یا بعد از اون."
      explain: "guardrail بیرون از مدل اجرا می‌شه، توی مسیر ورودی یا خروجی. چون رفتار مدل نیست، حتی وقتی مهاجم مدل رو قانع می‌کنه، باز هم کار می‌کنه."
  - answer: 1
    en:
      question: "What is red teaming?"
      options:
        - "Waiting for real attackers and recording what they try."
        - "Attacking your own system on purpose, often with a tool."
        - "Putting a guard model in front of every request."
        - "Training the model again on examples of known attacks."
      explain: "You cannot defend against attacks you have not tried. Tools such as promptfoo do the attacking, and the attack success rate is the number to watch over time."
    tr:
      question: "Red teaming nedir?"
      options:
        - "Gerçek saldırganları beklemek ve ne denediklerini kaydetmek."
        - "Kendi sistemine bilerek saldırmak, çoğu zaman bir araçla (tool)."
        - "Her isteğin önüne bir guard model koymak."
        - "Modeli bilinen saldırı örnekleriyle yeniden eğitmek."
      explain: "Denemediğin saldırılara karşı savunma yapamazsın. promptfoo gibi araçlar saldırıyı senin yerine yapar, zaman içinde izlemen gereken sayı ise attack success rate'tir."
    fa:
      question: "Red teaming چیه؟"
      options:
        - "منتظر موندن برای مهاجم‌های واقعی و ثبت اینکه چی امتحان می‌کنن."
        - "عمداً به سیستم خودت حمله کردن، اغلب با یه ابزار."
        - "گذاشتن یه guard model جلوی هر درخواست."
        - "دوباره آموزش دادن مدل با نمونه‌هایی از حمله‌های شناخته‌شده."
      explain: "نمی‌شه در برابر حمله‌هایی که امتحانشون نکردی دفاع کرد. ابزارهایی مثل promptfoo خودشون حمله رو انجام می‌دن، و attack success rate عددیه که باید توی طول زمان زیرنظرش داشته باشی."
