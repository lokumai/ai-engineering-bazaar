# Quick quiz: Agent Frameworks. Reinforcement, not assessment.
questions:
  - answer: 2
    en:
      question: "According to the module, what is the main thing an agent framework gives you?"
      options:
        - "The agent loop itself, because it is too hard to write by hand"
        - "A better model than the one your provider gives you"
        - "Everything around the loop, such as retries, streaming and tool schemas"
        - "A visual canvas where you connect integrations without writing code"
      explain: "The loop is a while loop around a model call, and you can write it yourself. A framework adds retries, streaming, tool schemas, memory that survives a restart, and a place for traces."
    tr:
      question: "Modüle göre bir agent framework'ü sana asıl olarak ne sağlar?"
      options:
        - "Agent loop'unun kendisini, çünkü onu elle yazmak çok zor"
        - "Sağlayıcının sana verdiğinden daha iyi bir model"
        - "Loop'un etrafındaki her şeyi, örneğin yeniden denemeler, streaming ve tool şemalarını"
        - "Kod yazmadan entegrasyonları bağladığın görsel bir canvas"
      explain: "Loop, bir model çağrısının etrafındaki bir while döngüsüdür ve bunu kendin de yazabilirsin. Framework ise yeniden denemeleri, streaming'i, tool şemalarını, yeniden başlatıldıktan sonra da kalan memory'yi ve trace'ler için bir yeri ekler."
    fa:
      question: "طبق این ماژول، مهم‌ترین چیزی که یک agent framework بهت می‌ده چیه؟"
      options:
        - "خود agent loop، چون نوشتنش با دست خیلی سخته"
        - "یه مدل بهتر از اون چیزی که provider بهت می‌ده"
        - "همه‌ی چیزهایی که دور loop هستن، مثل retry، streaming و tool schema"
        - "یه canvas بصری که توش بدون نوشتن کد، integration‌ها رو وصل می‌کنی"
      explain: "loop یه while loop دور یه فراخوانی مدل هست و خودت هم می‌تونی بنویسیش. framework اینا رو اضافه می‌کنه: retry، streaming، tool schema، Memory‌ای که بعد از restart باقی می‌مونه، و جایی برای trace‌ها."
  - answer: 0
    en:
      question: "The LangChain stack has three libraries at three levels. Which statement is correct?"
      options:
        - "Start with LangChain, and use LangGraph when you need to control the flow yourself"
        - "Start with LangGraph, because it is the highest level and does the most work"
        - "Start with deepagents, and use LangChain only when you need multi-agent work"
        - "LangChain, LangGraph and deepagents are one library with three different names"
      explain: "LangChain is the main interface and the place to start. LangGraph is the lowest level, the runtime, for when you need to control the flow yourself."
    tr:
      question: "LangChain Stack'i üç seviyede üç kütüphaneden oluşuyor. Hangi ifade doğru?"
      options:
        - "LangChain ile başla, akışı kendin yönetmen gerektiğinde LangGraph'i kullan"
        - "LangGraph ile başla, çünkü en üst seviye o ve en çok işi o yapar"
        - "deepagents ile başla ve LangChain'i sadece multi-agent işler için kullan"
        - "LangChain, LangGraph ve deepagents aslında üç farklı adı olan tek bir kütüphane"
      explain: "LangChain ana arayüzdür ve başlanacak yerdir. LangGraph en alt seviyedir, yani runtime'dır ve akışı kendin kontrol etmen gerektiğinde onu kullanırsın."
    fa:
      question: "LangChain stack از سه کتابخونه در سه سطح تشکیل شده. کدوم جمله درسته؟"
      options:
        - "از LangChain شروع کن، و وقتی خودت باید جریان رو کنترل کنی، سراغ LangGraph برو"
        - "از LangGraph شروع کن، چون بالاترین سطحه و بیشترین کار رو انجام می‌ده"
        - "از deepagents شروع کن، و LangChain رو فقط برای کارهای multi-agent استفاده کن"
        - "LangChain، LangGraph و deepagents یه کتابخونه‌ان با سه تا اسم مختلف"
      explain: "LangChain رابط اصلی و جای شروعه. LangGraph پایین‌ترین سطحه، یعنی runtime، و وقتی خودت باید جریان رو کنترل کنی به کارت میاد."
  - answer: 3
    en:
      question: "You can describe every step of a job in advance, and the requirements are stable. What does the module recommend?"
      options:
        - "Build an agent, because an agent is the grown-up version of a workflow"
        - "Build an agent, because a workflow cannot call a model at any step"
        - "Build a workflow, and let the model decide the order of the steps"
        - "Build a workflow, because it is more predictable, cheaper and easier to debug"
      explain: "A workflow runs fixed steps, so it is more predictable, and production usually wants that. The agent is not the upgrade: use it for open-ended work where nobody can write the steps in advance."
    tr:
      question: "Bir işin her adımını önceden tarif edebiliyorsun ve gereksinimler sabit. Modül ne öneriyor?"
      options:
        - "Bir agent kur, çünkü agent, workflow'un daha olgun bir sürümü"
        - "Bir agent kur, çünkü bir workflow hiçbir adımda modeli çağıramaz"
        - "Bir workflow kur ve adımların sırasına modelin karar vermesine izin ver"
        - "Bir workflow kur, çünkü daha öngörülebilir, daha ucuz ve debug etmesi daha kolay"
      explain: "Workflow sabit adımları çalıştırır, bu yüzden daha öngörülebilirdir ve production genellikle bunu ister. Agent bir yükseltme değildir; onu, adımların kimse tarafından önceden yazılamadığı açık uçlu işler için kullan."
    fa:
      question: "همه‌ی مراحل یه کار رو از قبل می‌دونی و نیازمندی‌ها هم ثابتن. ماژول چی پیشنهاد می‌کنه؟"
      options:
        - "یه agent بساز، چون agent نسخه‌ی بالغ‌تر workflow‌ه"
        - "یه agent بساز، چون workflow توی هیچ مرحله‌ای نمی‌تونه مدل رو صدا بزنه"
        - "یه workflow بساز، و بذار مدل ترتیب مراحل رو تصمیم بگیره"
        - "یه workflow بساز، چون قابل‌پیش‌بینی‌تره، ارزون‌تره و debug کردنش راحت‌تره"
      explain: "workflow مراحل ثابت رو اجرا می‌کنه، برای همین قابل‌پیش‌بینی‌تره، و production معمولاً همین رو می‌خواد. agent ارتقای workflow نیست. اون رو برای کارهای open-ended نگه دار، یعنی جاهایی که هیچ‌کس نمی‌تونه مراحل رو از قبل بنویسه."
  - answer: 1
    en:
      question: "n8n runs an MCP server. What does this let your coding agent do?"
      options:
        - "Replace the workflow, and do the whole job as an agent on every run"
        - "Build the workflow for you from a description in plain language"
        - "Turn each workflow into an agent that chooses its own path"
        - "Read the workflow only, because the MCP server does not allow changes"
      explain: "The coding agent connects to your n8n instance, assembles the nodes, validates the result, runs it and fixes what broke. So the agent and the workflow become partners, not alternatives."
    tr:
      question: "n8n bir MCP server çalıştırıyor. Bu, coding agent'ının ne yapmasına izin veriyor?"
      options:
        - "Workflow'un yerini alıp her çalışmada işin tamamını bir agent olarak yapmak"
        - "Sade bir dille yazdığın açıklamadan workflow'u senin yerine kurmak"
        - "Her workflow'u kendi yolunu seçen bir agent'a çevirmek"
        - "Workflow'u yalnızca okumak, çünkü MCP server değişikliğe izin vermiyor"
      explain: "Coding agent senin n8n instance'ına bağlanır, node'ları bir araya getirir, sonucu doğrular, çalıştırır ve bozulan şeyi düzeltir. Böylece agent ile workflow alternatif değil, ortak olur."
    fa:
      question: "n8n یه MCP server اجرا می‌کنه. این کار چه کمکی به coding agent تو می‌کنه؟"
      options:
        - "جای workflow رو بگیره، و توی هر اجرا کل کار رو به‌عنوان یه agent انجام بده"
        - "از یه توصیف با زبون ساده، workflow رو برات بسازه"
        - "هر workflow رو به یه agent تبدیل کنه که مسیر خودش رو انتخاب می‌کنه"
        - "فقط workflow رو بخونه، چون MCP server اجازه‌ی تغییر نمی‌ده"
      explain: "coding agent به n8n instance تو وصل می‌شه، node‌ها رو کنار هم می‌ذاره، نتیجه رو اعتبارسنجی می‌کنه، اجرا می‌کنه و هر چی خراب شده رو درست می‌کنه. این‌جوری agent و workflow شریک می‌شن، نه رقیب."
  - answer: 2
    en:
      question: "What trade do you make when you use a no-code platform such as Lovable or Bolt?"
      options:
        - "Slower work now, but full control of the code later"
        - "A higher price now, but you never need to rebuild later"
        - "Speed now, but less control later and a rebuild if you leave"
        - "Full control now, but slow changes each time you prompt it"
      explain: "Lovable and Bolt turn a description into a working application in hours instead of weeks. The cost is less control later, and moving off the platform means rebuilding."
    tr:
      question: "Lovable ya da Bolt gibi bir no-code platform kullandığında nasıl bir takas yapıyorsun?"
      options:
        - "Şimdi daha yavaş ilerleyen bir iş, ama sonra kod üzerinde tam kontrol"
        - "Şimdi daha yüksek bir fiyat, ama sonra hiç yeniden kurmana gerek kalmaz"
        - "Şimdi hız, ama sonra daha az kontrol ve platformdan ayrılırsan yeniden kurmak"
        - "Şimdi tam kontrol, ama her prompt'ta yavaş ilerleyen değişiklikler"
      explain: "Lovable ve Bolt bir açıklamayı haftalar yerine saatler içinde çalışan bir uygulamaya çevirir. Bedeli, sonra daha az kontrole sahip olmak; platformdan ayrılmak ise uygulamayı yeniden kurmak anlamına gelir."
    fa:
      question: "وقتی از یه پلتفرم no-code مثل Lovable یا Bolt استفاده می‌کنی، چه معامله‌ای انجام می‌دی؟"
      options:
        - "الان کارت کندتر پیش می‌ره، ولی بعداً کنترل کامل روی کد داری"
        - "الان قیمت بالاتره، ولی بعداً هیچ‌وقت نیازی به ساختن دوباره نیست"
        - "الان سرعت می‌گیری، ولی بعداً کنترل کمتری داری، و اگه از پلتفرم بری بیرون، باید دوباره بسازی"
        - "الان کنترل کامل داری، ولی هر بار که prompt می‌دی، تغییرات کندن"
      explain: "Lovable و Bolt یه توصیف رو توی چند ساعت، به‌جای هفته‌ها، به یه اپلیکیشن کارکن تبدیل می‌کنن. هزینه‌ش اینه که بعداً کنترل کمتری داری، و خارج شدن از پلتفرم یعنی ساختن دوباره."
