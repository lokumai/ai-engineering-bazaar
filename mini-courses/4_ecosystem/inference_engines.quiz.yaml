# Quick quiz: Inference Engines. Reinforcement, not assessment.
questions:
  - answer: 2
    en:
      question: "What does an inference engine do?"
      options:
        - "It trains the weights of a model on new data."
        - "It shows a chat interface where users talk to a model."
        - "It loads the weights and produces the next token."
        - "It sells access to a model and charges per token."
      explain: "An inference engine loads the weights, turns tokens into the next token, and manages GPU memory and batching. Charging per token is what a provider does when it runs an engine for you."
    tr:
      question: "Bir inference engine ne yapar?"
      options:
        - "Yeni veriyle bir modelin weight'lerini eğitir (training)."
        - "Kullanıcıların bir modelle konuştuğu bir sohbet arayüzü (chat UI) sunar."
        - "Weight'leri yükler ve sıradaki token'ı üretir."
        - "Bir modele erişim satar ve token başına ücret alır."
      explain: "Bir inference engine weight'leri yükler, token'ları bir sonraki token'a çevirir, GPU belleğini ve batching'i yönetir. Token başına ücret almak ise senin için bir engine çalıştıran provider'ın işidir."
    fa:
      question: "inference engine چی کار می‌کنه؟"
      options:
        - "weight‌های مدل رو روی داده‌ی جدید train می‌کنه."
        - "یه رابط چت نشون می‌ده که کاربرها توش با مدل حرف بزنن."
        - "weight‌ها رو load می‌کنه و token بعدی رو تولید می‌کنه."
        - "دسترسی به مدل رو می‌فروشه و به ازای هر token پول می‌گیره."
      explain: "inference engine، weight‌ها رو load می‌کنه، از روی token‌ها token بعدی رو درمیاره، و حافظه‌ی GPU و batching رو مدیریت می‌کنه. پول گرفتن به ازای هر token کار provider‌یه که یه engine رو برات اجرا می‌کنه."
  - answer: 0
    en:
      question: "The module gives three reasons to run a model yourself. Which reason is the most common?"
      options:
        - "The data must stay on your own infrastructure."
        - "Self-hosting takes less work than a provider."
        - "Per-token pricing always costs more than a GPU."
        - "Your own GPU always answers faster than a provider."
      explain: "Data that must stay on your own infrastructure is the most common reason, and it settles the question alone. Cost is a reason only after you pass a crossover point, not always."
    tr:
      question: "Modül, bir modeli kendin çalıştırmak için üç neden sunuyor. Bunlardan hangisi en yaygın?"
      options:
        - "Verinin kendi altyapısında (infrastructure) kalması gerekir."
        - "Self-hosting, bir provider kullanmaktan daha az iş gerektirir."
        - "Token başına fiyatlandırma her zaman bir GPU'nun maliyetinden daha fazlaya mal olur."
        - "Kendi GPU'n her zaman bir provider'dan daha hızlı yanıt verir."
      explain: "En yaygın neden, verinin kendi altyapısında (infrastructure) kalması gerekliliğidir ve soruyu tek başına çözer. Maliyet ise ancak bir kesişim noktasını (crossover point) geçtikten sonra bir neden olur, her zaman değil."
    fa:
      question: "درس سه تا دلیل برای اینکه مدل رو خودت اجرا کنی میاره. کدومش از همه رایج‌تره؟"
      options:
        - "داده باید روی زیرساخت خودت بمونه."
        - "self-hosting از provider کار کمتری می‌بره."
        - "قیمت‌گذاری به ازای هر token همیشه از GPU گرون‌تره."
        - "GPU خودت همیشه از provider سریع‌تر جواب می‌ده."
      explain: "اینکه داده باید روی زیرساخت خودت بمونه رایج‌ترین دلیله، و به‌تنهایی تکلیف رو روشن می‌کنه. هزینه فقط بعد از رد شدن از نقطه‌ی سربه‌سر دلیل حساب می‌شه، نه همیشه."
  - answer: 1
    en:
      question: "Your team serves many users from one GPU server. Every request starts with the same long system prompt. Which engine fits this case best?"
      options:
        - "Ollama"
        - "SGLang"
        - "llm-d"
        - "llama.cpp"
      explain: "SGLang is a serving engine that is strong when requests share a long common prefix. Ollama and llama.cpp are for one machine, and llm-d is for many machines."
    tr:
      question: "Ekibin tek bir GPU sunucusundan çok sayıda kullanıcıya hizmet veriyor. Her istek aynı uzun system prompt'la başlıyor. Bu duruma en uygun engine hangisi?"
      options:
        - "Ollama"
        - "SGLang"
        - "llm-d"
        - "llama.cpp"
      explain: "SGLang, isteklerin uzun ve ortak bir önek (prefix) paylaştığı durumlarda güçlü bir serving engine'dir. Ollama ve llama.cpp tek makine içindir, llm-d ise çok makine içindir."
    fa:
      question: "تیمت از یه سرور GPU به کلی کاربر سرویس می‌ده و همه‌ی درخواست‌ها با همون system prompt طولانی شروع می‌شن. کدوم engine برای این حالت از همه مناسب‌تره؟"
      options:
        - "Ollama"
        - "SGLang"
        - "llm-d"
        - "llama.cpp"
      explain: "SGLang یه serving engine‌ه که وقتی درخواست‌ها یه prefix طولانی مشترک دارن خیلی خوب جواب می‌ده. Ollama و llama.cpp برای یه سیستم تکی‌ان، و llm-d برای چند تا سرور."
  - answer: 3
    en:
      question: "You test your self-hosted model with one request at a time. Why does this test mislead you about the server?"
      options:
        - "Generating a token is mostly arithmetic, so one request fills the GPU."
        - "The engine waits for a full batch before it starts any request."
        - "Batching only matters when you serve a model across many machines."
        - "A GPU with one request is mostly idle, and the batch decides throughput."
      explain: "Generating a token needs little arithmetic and a lot of memory traffic, so one request leaves the GPU mostly idle. When many requests run together, one weight loading serves all of them."
    tr:
      question: "Kendi barındırdığın (self-hosted) modeli bir seferde tek istekle test ediyorsun. Bu test sunucu hakkında seni neden yanıltır?"
      options:
        - "Bir token üretmek ağırlıklı olarak aritmetiktir, yani tek istek GPU'yu doldurur."
        - "Engine, herhangi bir isteğe başlamadan önce batch'in tamamen dolmasını bekler."
        - "Batching, yalnızca bir modeli birçok makine üzerinde sunduğunda önemlidir."
        - "Tek istekle GPU çoğunlukla boştur ve throughput'u batch belirler."
      explain: "Bir token üretmek az aritmetik ama çok bellek trafiği gerektirir, bu yüzden tek istek GPU'yu çoğunlukla boş bırakır. Birçok istek birlikte çalıştığında ise tek bir weight yüklemesi hepsine hizmet eder."
    fa:
      question: "مدل self-host‌شده‌ت رو با یه درخواست در هر لحظه تست می‌کنی. چرا این تست درباره‌ی سرور گمراهت می‌کنه؟"
      options:
        - "تولید token بیشترش محاسبه‌ست، پس همون یه درخواست GPU رو پر می‌کنه."
        - "engine تا batch پر نشه، هیچ درخواستی رو شروع نمی‌کنه."
        - "batching فقط وقتی مهمه که مدل رو روی چند تا سرور serve کنی."
        - "GPU با یه درخواست بیشتر وقتش بیکاره، و throughput رو batch تعیین می‌کنه."
      explain: "تولید token محاسبه‌ی کمی می‌خواد ولی کلی جابه‌جایی داده توی حافظه، پس یه درخواست تنها GPU رو بیشتر وقت بیکار می‌ذاره. وقتی چند تا درخواست با هم اجرا بشن، یه بار load کردن weight‌ها به کار همه‌شون میاد."
  - answer: 1
    en:
      question: "An engine gives you an API and nothing to look at. What is Open WebUI?"
      options:
        - "A serving engine that batches many requests on one GPU."
        - "A chat interface with accounts, history and model switching."
        - "A tool that compiles a model ahead of time for NVIDIA."
        - "A platform that runs inference across many Kubernetes machines."
      explain: "Open WebUI is a chat interface that talks to Ollama or to any engine with the OpenAI API shape. The other options describe engines: vLLM, TensorRT-LLM and llm-d."
    tr:
      question: "Bir engine sana bir API verir, ama gözle bakabileceğin bir şey vermez. Open WebUI nedir?"
      options:
        - "Tek bir GPU'da birçok isteği batch'leyen bir serving engine."
        - "Hesaplar, konuşma geçmişi ve model değiştirme sunan bir sohbet arayüzü (chat UI)."
        - "Bir modeli NVIDIA donanımı için önceden derleyen bir araç."
        - "Inference'ı birçok Kubernetes makinesi üzerinde çalıştıran bir platform."
      explain: "Open WebUI, Ollama'ya ya da OpenAI API biçimini kullanan herhangi bir engine'e bağlanan bir sohbet arayüzüdür (chat UI). Diğer seçenekler engine'leri anlatır: vLLM, TensorRT-LLM ve llm-d."
    fa:
      question: "engine فقط یه API بهت می‌ده و هیچ صفحه‌ای برای دیدن نداره. Open WebUI چیه؟"
      options:
        - "یه serving engine که کلی درخواست رو روی یه GPU توی batch می‌ذاره."
        - "یه رابط چت با حساب کاربری، تاریخچه و امکان عوض کردن مدل."
        - "ابزاری که مدل رو از قبل برای NVIDIA کامپایل می‌کنه."
        - "پلتفرمی که inference رو روی کلی سرور Kubernetes اجرا می‌کنه."
      explain: "Open WebUI یه رابط چته که با Ollama یا هر engine‌ی که API‌ش هم‌شکل OpenAI باشه حرف می‌زنه. بقیه‌ی گزینه‌ها توصیف engine‌ها هستن: vLLM، TensorRT-LLM و llm-d."
