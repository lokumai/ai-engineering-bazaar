# Quick quiz: Inference Providers. Reinforcement, not assessment.
questions:
  - answer: 2
    en:
      question: "What does an inference provider sell you?"
      options:
        - "A copy of the model weights to run on your own machines"
        - "The machines, so that you can host the model yourself"
        - "Access to a model that runs on their hardware, paid per token"
        - "One fixed monthly price for unlimited calls to one model"
      explain: "The provider runs the model on its own hardware, and you pay per token. You own none of the machines and none of the weights."
    tr:
      question: "Bir inference provider sana ne satar?"
      options:
        - "Kendi makinelerinde çalıştırman için modelin weight'lerinin bir kopyasını"
        - "Modeli kendin barındırabilmen için makinelerin kendisini"
        - "Provider'ın kendi donanımında çalışan bir modele, token başına ödemeli erişimi"
        - "Tek bir modele sınırsız çağrı için sabit bir aylık ücreti"
      explain: "Provider modeli kendi donanımında çalıştırır ve sen token başına ödersin. Ne makinelerin ne de weight'lerin sana ait değil."
    fa:
      question: "inference provider دقیقاً چی بهت می‌فروشه؟"
      options:
        - "یه کپی از weight‌های مدل، که روی سرورهای خودت اجراش کنی"
        - "خود سرورها، که مدل رو خودت host کنی"
        - "دسترسی به مدلی که روی سخت‌افزار خودش اجرا می‌شه، با پرداخت به ازای هر token"
        - "یه قیمت ثابت ماهانه برای call نامحدود به یه مدل"
      explain: "provider مدل رو روی سخت‌افزار خودش اجرا می‌کنه و تو به ازای هر token پول می‌دی. نه سرورها مال توئه، نه weight‌ها."
  - answer: 0
    en:
      question: "A gateway such as OpenRouter gives you one key for many models. What is the cost?"
      options:
        - "One extra hop through another company's infrastructure"
        - "A separate account and rate limit for each vendor"
        - "No failover when one provider has an outage"
        - "Only one seller for each open-weights model"
      explain: "Your request goes through another company's infrastructure, which adds a little latency. Separate accounts for each vendor are what a gateway removes."
    tr:
      question: "OpenRouter gibi bir gateway, birçok model için sana tek bir key verir. Bunun bedeli nedir?"
      options:
        - "Başka bir şirketin altyapısından geçen ek bir adım (hop)"
        - "Her üretici için ayrı bir hesap ve rate limit"
        - "Bir provider'da kesinti olduğunda failover olmaması"
        - "Her açık ağırlıklı (open-weights) model için yalnızca tek bir satıcı"
      explain: "İsteğin başka bir şirketin altyapısından geçer, bu da biraz gecikme (latency) ekler. Üretici başına ayrı hesapları ise gateway ortadan kaldırır."
    fa:
      question: "یه gateway مثل OpenRouter برای کلی مدل یه key بهت می‌ده. هزینه‌ش چیه؟"
      options:
        - "یه hop اضافه از زیرساخت یه شرکت دیگه"
        - "یه اکانت و یه rate limit جدا برای هر vendor"
        - "نبودن failover وقتی یه provider قطع می‌شه"
        - "فقط یه فروشنده برای هر مدل open-weights"
      explain: "درخواستت از زیرساخت یه شرکت دیگه رد می‌شه و این یه کم latency اضافه می‌کنه. اکانت جدا برای هر vendor دقیقاً چیزیه که gateway از شرش خلاصت می‌کنه."
  - answer: 3
    en:
      question: "Why does a team go direct to the model maker, such as OpenAI, Anthropic or Google?"
      options:
        - "To use one key and one API shape for many models"
        - "To choose between several sellers of one open-weights model"
        - "To move each request to another provider during an outage"
        - "To get features only the maker ships, such as prompt caching"
      explain: "The maker usually ships new models first, and it offers prompt caching, batch discounts and higher rate limits. One key for many models is what a gateway gives you."
    tr:
      question: "Bir ekip neden modeli yapan şirkete, yani OpenAI, Anthropic ya da Google'a doğrudan gider?"
      options:
        - "Birçok model için tek key ve tek bir API şekli kullanmak için"
        - "Aynı açık ağırlıklı (open-weights) modeli sunan birkaç satıcı arasından seçim yapmak için"
        - "Bir kesinti sırasında her isteği başka bir provider'a taşımak için"
        - "Prompt caching gibi yalnızca üreticinin sunduğu özelliklere ulaşmak için"
      explain: "Üretici şirket yeni modelleri genellikle önce çıkarır ve prompt caching, batch indirimleri ile daha yüksek rate limit'ler sunar. Birçok model için tek key ise gateway'in sana verdiği bir şeydir."
    fa:
      question: "چرا یه تیم مستقیم می‌ره سراغ سازنده‌ی مدل، مثلاً OpenAI، Anthropic یا Google؟"
      options:
        - "که با یه key و یه شکل API از کلی مدل استفاده کنه"
        - "که بین چند فروشنده‌ی یه مدل open-weights انتخاب کنه"
        - "که موقع قطعی، هر درخواست رو بفرسته سراغ یه provider دیگه"
        - "که قابلیت‌هایی مثل prompt caching رو بگیره که فقط سازنده ارائه می‌ده"
      explain: "مدل‌های جدید معمولاً اول پیش سازنده میان، و prompt caching، تخفیف batch و rate limit‌های بالاتر هم همون‌جاست. یه key برای کلی مدل چیزیه که gateway بهت می‌ده."
  - answer: 1
    en:
      question: "Your agent sends the same long system prompt on every turn. Which line of a provider's pricing page matters most?"
      options:
        - "The price per million tokens"
        - "Prompt caching for the repeated prompt"
        - "The size of the context window"
        - "The daily limit of the free tier"
      explain: "A provider that caches a long, stable prompt charges a fraction for each repeat. The price per token alone is the worst number to decide on."
    tr:
      question: "Agent'ın her turda aynı uzun system prompt'u gönderiyor. Bir provider'ın fiyatlandırma sayfasındaki hangi satır en çok önem taşır?"
      options:
        - "Milyon token başına fiyat"
        - "Tekrarlanan prompt için prompt caching"
        - "Context window'un boyutu"
        - "Ücretsiz katmanın (free tier) günlük limiti"
      explain: "Uzun ve değişmeyen bir prompt'u önbelleğe alan provider, her tekrar için yalnızca fiyatın küçük bir kısmını ücretlendirir. Token başına fiyat tek başına karar vermek için en az işe yarayan sayıdır."
    fa:
      question: "agent‌ت توی هر turn همون system prompt طولانی رو می‌فرسته. کدوم خط از صفحه‌ی قیمت‌های provider از همه مهم‌تره؟"
      options:
        - "قیمت هر یک میلیون token"
        - "prompt caching برای prompt تکراری"
        - "اندازه‌ی context window"
        - "سقف روزانه‌ی free tier"
      explain: "provider‌ی که یه prompt طولانی و ثابت رو cache کنه، برای هر تکرار فقط کسری از قیمت رو می‌گیره. قیمت هر token به‌تنهایی بدترین معیار برای تصمیم گرفتنه."
  - answer: 2
    en:
      question: "You test a model on a free tier. What does the free tier tell you?"
      options:
        - "How fast your product will feel to its users"
        - "The rate limits you will get when you pay"
        - "Whether the model can do the task you need"
        - "Which paid provider will give you the lowest latency"
      explain: "A free tier shows whether the model can do your task. Free capacity is slower and more rate limited, so measure latency on the tier you will pay for."
    tr:
      question: "Bir modeli ücretsiz katmanda (free tier) deniyorsun. Ücretsiz katman sana ne söyler?"
      options:
        - "Ürününün kullanıcılarına ne kadar hızlı hissettireceğini"
        - "Ödeme yaptığında alacağın rate limit'leri"
        - "Modelin ihtiyacın olan işi yapıp yapamayacağını"
        - "Hangi ücretli provider'ın sana en düşük gecikmeyi (latency) vereceğini"
      explain: "Ücretsiz katman, modelin işini yapıp yapamayacağını gösterir. Ücretsiz kapasite daha yavaş ve daha sıkı rate limit'li olduğundan, gecikmeyi parasını ödeyeceğin katmanda ölç."
    fa:
      question: "یه مدل رو روی free tier امتحان می‌کنی. free tier چی رو بهت نشون می‌ده؟"
      options:
        - "اینکه محصولت برای کاربرها چقدر سریع به نظر میاد"
        - "rate limit‌هایی که وقتی پول بدی گیرت میاد"
        - "اینکه مدل از پس کاری که لازم داری برمیاد یا نه"
        - "اینکه کدوم provider پولی کمترین latency رو داره"
      explain: "free tier فقط نشون می‌ده مدل از پس کارت برمیاد یا نه. ظرفیت رایگان کندتره و rate limit سخت‌گیرانه‌تری داره، پس latency رو روی tier‌ی اندازه بگیر که قراره پولش رو بدی."
