      - name: advanced_ui
        title: Advanced UI
        status: draft
        notes: >-
          agentic UI, AG-UI, MCP-Apps UI, A2UI, Copilotkit, Agent Client
          Protocol ACP, TUI for agents
      - name: advanced_deployment
        title: Advanced Deployment
        status: draft
        notes: >-
          agent server, langchain agent protocol, the tech stack for UI REDIS
