    status: draft
    blurb: Inside the LLM, advanced RAG, tools, memory, multi-agent, prompting, context, coding agents, harnesses, loops, architectures, UI, deployment, evaluation, fine-tuning and post-training.
    modules:
      - name: advanced_llm
        title: Advanced LLM
        status: draft
        notes: >-
          Transformers using Amirkia's explanation of why, without softmax,
          encoder, decoder or other neural-network and foundation-model detail;
          self-supervised learning in pre-training (from the retired Advanced
          Training); LLM inference loop; MoE; prefill vs. decode;
          model-norm-position-attention-KV-FFN-sparse table or selection;
          static vs. continuous batching; serving metrics (TTFT, generation
          speed); speculative decoding
      - name: advanced_rag
        title: Advanced RAG & Embeddings
        status: draft
        notes: >-
          RAG vs. long context vs. fine-tuning, ingesting data, chunking
          strategies (fixed size, sliding window, recursive, document-based,
          semantic chunking), indexing hyperparameters, retrieval (semantic
          and/or BM25, reranker cross-encoder), bi-encoder vs. cross-encoder,
          hybrid retrieval, Anthropic's contextual retrieval, correct vs.
          faithful, architectures (naive RAG, HyDE, corrective RAG, multi-hop
          RAG, GraphRAG, agentic RAG, multimodal RAG), RAG security
      - name: advanced_tools
        title: Advanced Tools
        status: draft
        notes: >-
          RAG vs Agentic Search, JSON vs CLI tools, Frotend Tools, Code Mode,
          Tool Chaining
      - name: advanced_memory
        title: Advanced Memory
        status: draft
        notes: >-
          Long-term memory using Cognee and MemSearch and Hindsight, Agent
          Dreaming, Agent KnowledgeBase, Entire Provenance
      - name: advanced_multiagent
        title: Advanced Multi-Agent
        status: draft
        notes: >-
          more architectures like proposer-verifierte, , A2A, Multi-agent
          coordination context delegation (handoff) vs subagent context
          delegation vs messaging pool, background agents and monitoring
      - name: advanced_prompting
        title: Advanced Prompting
        status: draft
        notes: >-
          issue #39, first topic: Forcing Structured Output (prompting is
          fragile; constrained decoding filters the next-token pool by a
          grammar; Outlines https://github.com/dottxt-ai/outlines, xgrammar
          https://github.com/mlc-ai/xgrammar, most LLM APIs support it). Then
          Reflextion and Self-critique, Tree of Thought, LLM Consul, caveman,
          ponytail, ADHD
      - name: advanced_context_engineering
        title: Advanced Context Engineering
        status: draft
        notes: >-
          Context engineering for software development like Superpowers,
          SpecKit, GSD, AgentOS, Claude Native Plan Goals Ultrathink Playground
      - name: advanced_coding_agents
        title: Advanced Coding Agents
        status: draft
        notes: >-
          claude code best practices:
          https://code.claude.com/docs/en/best-practices#use-cli-tools, rewind,
          resume, subagent-cli-skills, /fork, btw
      - name: advanced_harness_engineering
        title: Advanced Harness Engineering
        status: draft
        notes: >-
          harness profiles, system prompts, changing tool names, self evolving
          harnessess, context and harness embedded in llm anthtropic article:
          https://claude.com/blog/the-new-rules-of-context-engineering-for-claude-5-generation-models
      - name: advanced_loop_engineering
        title: Advanced Loop Engineering
        status: draft
        notes: >-
          issue #48. Agent Teams, Dynamic Workflows and RLMs, moved here from
          Loop Engineering
      - name: advanced_agent_architectures
        title: Advanced Agent Architectures
        status: draft
        notes: >-
          THREAD, ReAct, Deep, CodeAct, RLM (Dynamic Workflows are taught in
