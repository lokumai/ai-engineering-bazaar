# The shape of the course, in one file.
#
# Category order and module order are FILE ORDER, and no number appears here at
# all. A module's number is its position, computed in exactly one place in the
# repository, so reordering the course is moving a line and nothing else. The
# number used to be the module's identity in seven places at once, two reorders
# each needed a script written for the occasion, and one of them shipped a link
# whose text said "Module 26" while it pointed at file 25.
#
# `name`     the file stem, and the source of the URL slug: `harness_engineering`
#            is `2_intermediate/harness_engineering.md` and
#            `/courses/intermediate/harness-engineering/`.
# `title`    required. It is not derivable from the name: `rag` is
#            "RAG & Embeddings".
# `status`   `ready` or `draft`, and it defaults to `draft`, so a module nobody
#            has written cannot claim to be finished by leaving a field out.
# `minutes`  the estimate a sheet prints. Defaults to 0. A `ready` module needs
#            one above zero.
# `needs`    prerequisites, BY NAME, so `needs: [prompt_engineering]` and the
#            link `[Prompt Engineering](prompt_engineering.md)` share one string
#            that a grep can find. Every name must sit earlier in this file.
# `notes`    what the module is meant to cover. Read by nothing that ships: it
#            is the author's own planning note, carried across verbatim from
#            `scratchpad/topics.txt`, where it sat beside a number that had
#            drifted out of step with the corpus.
#
# One shape, two notations: flow style where a module fits on a line, block
# style where there is more to say. `src/lib/content/curriculum-file.ts`
# validates this file and refuses seven things zod cannot express on its own,
# including the one that matters most: the `.md` files on disk in a category and
# the names listed for it must be the same set, both directions.

categories:
  - slug: fundamentals
    title: Fundamentals
    status: ready
    blurb: LLMs, training, retrieval, tools, memory, and the agent loop. Start here.
    modules:
      - { name: llms, title: LLM Fundamentals, status: ready, minutes: 25 }
      - name: training
        title: Training LLMs
        status: ready
        minutes: 25
        needs: [llms]
        notes: rename fine-tuning markdowns to this
      - name: rag
        title: RAG & Embeddings
        status: ready
        minutes: 30
        needs: [llms, training]
      - name: tools
        title: Tool Calling
        status: ready
        minutes: 25
        needs: [llms]
      - name: memory
        title: Memory
        status: ready
        minutes: 20
        needs: [llms, rag]
        notes: short-term memory which is LLM context, LLM are stateless
      - name: agents
        title: AI Agents
        status: ready
        minutes: 25
        needs: [tools, memory]
      - name: multi_agent
        title: Multi-Agent Systems
        status: ready
        minutes: 25
        needs: [agents]

