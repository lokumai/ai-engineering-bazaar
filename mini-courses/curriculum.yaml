        title: Training LLMs
        status: ready
        minutes: 25
        needs: [llms]
        notes: rename fine-tuning markdowns to this
      - name: rag
        title: RAG & Embeddings
        status: ready
        minutes: 30
        needs: [llms, training]
      - name: tools
        title: Tool Calling
        status: ready
        minutes: 25
