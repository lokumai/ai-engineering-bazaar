site_name: AI Engineering Bazaar
site_description: AI Engineering made simple, short, and useful.
site_url: https://lokumai.github.io/ai-engineering-bazaar/
repo_url: https://github.com/lokumai/ai-engineering-bazaar
repo_name: lokumai/ai-engineering-bazaar

docs_dir: mini-courses

exclude_docs: |
  scratchpad/
  CLAUDE.md
  AGENTS.md

not_in_nav: |
  *_tr.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Fundamentals:
      - Overview: 1_fundamentals/README.md
      - "1. LLM Fundamentals": 1_fundamentals/1_llms.md
      - "2. Training LLMs": 1_fundamentals/2_training.md
      - "3. RAG & Embeddings": 1_fundamentals/3_rag.md
      - "4. Tool Calling": 1_fundamentals/4_tools.md
      - "5. Memory": 1_fundamentals/5_memory.md
      - "6. AI Agents": 1_fundamentals/6_agents.md
      - "7. Multi-Agent Systems": 1_fundamentals/7_multi_agent.md
  - Intermediate:
      - Overview: 2_intermediate/README.md
      - "8. Prompt Engineering": 2_intermediate/8_prompt_engineering.md
      - "9. Context Engineering": 2_intermediate/9_context_engineering.md
      - "10. Coding Agents: The Landscape": 2_intermediate/10_coding_agents_landscape.md
      - "11. Coding Agents: Extending Them": 2_intermediate/11_coding_agents.md
      - "12. Harness Engineering": 2_intermediate/12_harness_engineering.md
      - "13. Security": 2_intermediate/13_security.md
      - "14. Loop Engineering": 2_intermediate/14_loop_engineering.md
      - "15. Personal Agents": 2_intermediate/15_personal_agents.md
  - "🚧 Expert (Draft)":
